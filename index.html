<script>
"use strict";

/* ============================================================
   BATAK ROYALE X
   TEK DOSYA / VANILLA JS
============================================================ */

const $ = id => document.getElementById(id);

const SUITS = [
  {id:"S",name:"Maça",symbol:"♠",red:false},
  {id:"H",name:"Kupa",symbol:"♥",red:true},
  {id:"D",name:"Karo",symbol:"♦",red:true},
  {id:"C",name:"Sinek",symbol:"♣",red:false}
];

const RANKS = [
  {v:2,n:"2"},
  {v:3,n:"3"},
  {v:4,n:"4"},
  {v:5,n:"5"},
  {v:6,n:"6"},
  {v:7,n:"7"},
  {v:8,n:"8"},
  {v:9,n:"9"},
  {v:10,n:"10"},
  {v:11,n:"J"},
  {v:12,n:"Q"},
  {v:13,n:"K"},
  {v:14,n:"A"}
];

const NAMES = ["Zafer","Ahmet","Mehmet","Ali"];

let profile = JSON.parse(localStorage.getItem("batakRoyaleX") || "null") || {
  coins:2500,
  xp:680,
  level:7,
  games:24,
  wins:14,
  losses:10,
  bestBid:10,
  sound:true,
  dailyClaim:false,
  lastReward:""
};

let G = null;

/* ============================================================
   SAVE / XP
============================================================ */

function save(){
  localStorage.setItem("batakRoyaleX",JSON.stringify(profile));
}

function addXP(amount){
  profile.xp += amount;

  while(profile.xp >= profile.level * 150){
    profile.xp -= profile.level * 150;
    profile.level++;

/* ============================================================
   SOUND
============================================================ */

let audioCtx = null;

function sound(type="click"){
  if(!profile.sound) return;

  try{
    audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();

    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();

    o.connect(g);
    g.connect(audioCtx.destination);

    let freq = 420;
    let duration = .06;

    if(type==="card") freq=600;
    if(type==="win") {freq=760;duration=.16}
    if(type==="lose") {freq=180;duration=.18}
    if(type==="coin") {freq=950;duration=.12}

    o.frequency.value=freq;
    o.type="sine";

    g.gain.setValueAtTime(.045,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);

    o.start();
    o.stop(audioCtx.currentTime+duration);
  }catch(e){}
}

let toastTimer;

function toast(msg){
  const t=$("toast");
  t.textContent=msg;
  t.classList.add("show");

  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}

/* ============================================================
   DECK
============================================================ */

function createDeck(){

  const deck=[];

  for(const s of SUITS){
    for(const r of RANKS){
      deck.push({
        suit:s.id,
        rank:r.v,
        name:r.n,
        symbol:s.symbol,
        red:s.red
      });
    }
  }

  return deck;
}

function shuffle(a){

  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }

  return a;
}

/* ============================================================
   START GAME
============================================================ */

function startGame(mode){

  sound("click");

  const deck=shuffle(createDeck());

  G={
    mode,
    players:[
      {name:"Zafer",hand:[]},
      {name:"Ahmet",hand:[]},
      {name:"Mehmet",hand:[]},
      {name:"Ali",hand:[]}
    ],

    dealer:Math.floor(Math.random()*4),
    turn:0,
    lead:null,
    trump:null,
    trick:[],
    tricks:[0,0,0,0],
    played:[],
    bids:[null,null,null,null],
    highestBid:0,
    bidder:null,
    round:1,
    finished:false,
    started:false
  };

  /* Gömmeli = 3 oyuncu + 4 gömülü */
  if(mode==="buried"){

    G.players=[
      {name:"Zafer",hand:[]},
      {name:"Ahmet",hand:[]},
      {name:"Mehmet",hand:[]}
    ];

    while(deck.length>0){

      for(let i=0;i<3;i++){

        if(deck.length){
          G.players[i].hand.push(deck.pop());
        }

        if(G.players[i].hand.length===16) break;
      }

      if(G.players.every(p=>p.hand.length>=16))break;
    }

  }else{

    for(let i=0;i<52;i++){
      G.players[i%4].hand.push(deck.pop());
    }

  }

  G.players.forEach(p=>{
    p.hand.sort(cardSort);
  });

  renderGame();

  setTimeout(()=>beginRound(),450);
}

/* ============================================================
   CARD SORT
============================================================ */

function cardSort(a,b){

  if(a.suit!==b.suit){
    return SUITS.findIndex(x=>x.id===a.suit) -
           SUITS.findIndex(x=>x.id===b.suit);
  }

  return b.rank-a.rank;
}

   ROUND START
============================================================ */

function beginRound(){

  if(G.mode==="spades"){

    G.trump="S";

    /* Koz Maça: herkes hedef belirler */
    bidSequential(0);

    return;
  }

  if(G.mode==="buried"){

    bidSequential(0);
    return;
  }

  bidSequential(0);
}

/* ============================================================
   BIDDING
============================================================ */

function bidSequential(player){

  if(player>=G.players.length){

    finishBidding();
    return;
  }

  G.turn=player;
  renderGame();

  if(player===0){

    setTimeout(()=>openBidModal(),250);

  }else{

    setTimeout(()=>{

      const bid=aiBid(player);

      G.bids[player]=bid;

      if(bid>G.highestBid){

        G.highestBid=bid;
        G.bidder=player;
      }

      bidSequential(player+1);

    },500);
  }
}

/* ============================================================
   AI BID
============================================================ */

function aiBid(i){

  if(G.mode==="spades"){

    const hand=G.players[i].hand;
    return Math.max(2,Math.min(10,
      hand.filter(c=>c.suit==="S").length+
      hand.filter(c=>c.rank>=13).length
    ));
  }

  const h=G.players[i].hand;

  let strength=0;

  h.forEach(c=>{

    if(c.rank===14)strength+=1.3;
    if(c.rank===13)strength+=.8;
    if(c.rank===12)strength+=.45;

    if(c.suit==="S" && c.rank>=11)strength+=.7;

  });

  let bid=Math.round(strength);

  bid=Math.max(0,bid);
  bid=Math.min(12,bid);

  if(bid>0 && bid<=G.highestBid) return 0;

  return bid;
}

/* ============================================================

============================================================ */

function buriedPhase(){

  const p=G.players[0];

  /* İlk 16 kartın 4'ü gömülecek.
     Oyuncunun seçtiği kartları burada basit seçimle alıyoruz. */

  let selected=[];

  function renderBuried(){

    $("app").insertAdjacentHTML("beforeend",`
      <div class="modal" id="buryModal">

        <div class="modalBox">

          <div class="modalHead">
            <h2>🂠 4 Kart Göm</h2>
            <button class="close"
              onclick="autoBury()">✓</button>
          </div>

          <p style="color:#91aaa0;font-size:12px;margin-bottom:12px">
            ${selected.length}/4 kart seçildi.
          </p>

          <div class="hand"
            style="grid-template-columns:repeat(5,1fr)"
            id="buryHand"></div>

        </div>

      </div>
    `);

    const area=$("buryHand");

    p.hand.forEach((c,i)=>{

      const b=document.createElement("button");

      b.className="card";

      if(selected.includes(i))b.classList.add("selected");

      b.innerHTML=`
        <div class="corner ${c.red?"red":""}">
          ${c.name}<br>${c.symbol}
        </div>

        <div class="centerSuit ${c.red?"red":""}">
          ${c.symbol}
        </div>
      `;

      b.onclick=()=>{

        if(selected.includes(i)){
          selected=selected.filter(x=>x!==i);
        }else if(selected.length<4){
          selected.push(i);
        }

        renderBuried();
      };

      area.appendChild(b);
    });
  }

  window.autoBury=function(){

    while(selected.length<4){

      let weakest=0;

      p.hand.forEach((c,i)=>{

        if(selected.includes(i))return;

        if(c.rank< p.hand[weakest].rank){
          weakest=i;
        }
      });

      selected.push(weakest);
    }

    selected.sort((a,b)=>b-a);

    selected.forEach(i=>p.hand.splice(i,1));

    $("buryModal")?.remove();

    startPlay();
  };

  renderBuried();
}

/* ============================================================
   START PLAY
============================================================ */

function startPlay(){

  G.started=true;
  G.turn=G.bidder;

  /* Kullanıcı değilse AI başlayacak */
  renderGame();

  setTimeout(nextTurn,450);
}

/* ============================================================
   LEGAL
============================================================ */

function legal(card,player){

  if(G.trick.length===0)return true;

  const lead=G.trick[0].card.suit;

  const hasLead=G.players[player].hand.some(
    c=>c.suit===lead
  );

  if(hasLead){
    return card.suit===lead;
  }

  return true;
}

/* ============================================================
   NEXT TURN
============================================================ */

function nextTurn(){

  if(G.finished)return;

  if(G.turn===0){

    renderGame();
    return;
  }

  const i=G.turn;

  setTimeout(()=>{

    const idx=chooseAICard(i);

    playCard(i,idx);

  },550);
}

/* ============================================================
   AI CARD
============================================================ */

function chooseAICard(player){

  const h=G.players[player].hand;

  const legalCards=h
    .map((c,i)=>({c,i}))
    .filter(x=>legal(x.c,player));

  if(!legalCards.length)return 0;

  /* İlk kart */
  if(G.trick.length===0){

    /* güçlü ama gereksiz As'ı hemen harcamamaya çalış */
    const sorted=[...legalCards].sort((a,b)=>a.c.rank-b.c.rank);

    return sorted[0].i;
  }

  const lead=G.trick[0].card.suit;

  /* Şu an kazanabilecek kartları bul */
  const winners=legalCards.filter(x=>
    beatsCurrent(x.c)
  );

  if(winners.length){

    /* en küçük kazanan */
    winners.sort((a,b)=>cardPower(a.c)-cardPower(b.c));

    return winners[0].i;
  }

  /* kazanamıyorsa en küçük kart */
  legalCards.sort((a,b)=>cardPower(a.c)-cardPower(b.c));

  return legalCards[0].i;
}

/* ============================================================
   CARD POWER
============================================================ */

function cardPower(c){

  let p=c.rank;

  if(c.suit===G.trump)p+=30;

  return p;
}

/* ============================================================
   CURRENT WINNER
============================================================ */

function beatsCurrent(card){

  if(G.trick.length===0)return true;

  const lead=G.trick[0].card.suit;

  let winner=G.trick[0];

  for(let x of G.trick.slice(1)){

    if(beats(x.card,winner.card,lead)){
      winner=x;
    }
  }

  return beats(card,winner.card,lead);
}

function beats(a,b,lead){

  if(a.suit===b.suit){
    return a.rank>b.rank;
  }

  if(a.suit===G.trump && b.suit!==G.trump){
    return true;
  }

  if(b.suit===G.trump && a.suit!==G.trump){
    return false;
  }

  return a.suit===lead && b.suit!==lead;
}

/* ============================================================
   PLAY CARD
============================================================ */

function playCard(player,index){

  if(G.finished)return;

  const hand=G.players[player].hand;
  const card=hand[index];

  if(!card)return;

  if(!legal(card,player)){
    if(player===0)toast("Bu renkten elinde var. Uymalısın.");
    return;
  }

  hand.splice(index,1);

  if(G.trick.length===0){
    G.lead=card.suit;
  }

  G.trick.push({
    player,
    card
  });

  sound("card");

  renderGame();

  if(G.trick.length===G.players.length){

    setTimeout(resolveTrick,800);

  }else{

    G.turn=(player+1)%G.players.length;

    setTimeout(nextTurn,300);
  }
}

/* ============================================================
   RESOLVE TRICK
============================================================ */

function resolveTrick(){

  let winner=G.trick[0];

  for(let x of G.trick.slice(1)){

    if(beats(
      x.card,
      winner.card,
      G.lead
    )){
      winner=x;
    }
  }

  G.tricks[winner.player]++;

  G.turn=winner.player;

  renderTrick();

  setTimeout(()=>{

    G.trick=[];
    G.lead=null;

    if(allCardsFinished()){
      finishGame();
      return;
    }

    G.round++;

    renderGame();
    nextTurn();

  },850);
}

/* ============================================================
   TRICK UI
============================================================ */

function renderTrick(){

  const area=$("trickArea");
  if(!area)return;

  area.innerHTML="";

  G.trick.forEach((x,i)=>{

    const c=x.card;

    const d=document.createElement("div");

    d.className=`played p${i}`;

    d.innerHTML=`
      <div class="${c.red?"red":""}">
        ${c.name}
      </div>

      <div class="pSuit ${c.red?"red":""}">
        ${c.symbol}
      </div>

      <div class="pRank">
        ${G.players[x.player].name}
      </div>
    `;

    area.appendChild(d);
  });
}

/* ============================================================
   FINISH
============================================================ */

function allCardsFinished(){

  return G.players.every(p=>p.hand.length===0);
}

function finishGame(){

  G.finished=true;

  let result="";

  if(G.mode==="pairs"){

    const teamMe=G.tricks[0]+G.tricks[2];
    const teamEnemy=G.tricks[1]+G.tricks[3];

    const target=G.highestBid || 5;

    if(G.bidder%2===0){

      if(teamMe>=target){
        profile.wins++;
        profile.coins+=120;
        addXP(80);
        sound("win");
        result=`TAKIMIN KAZANDI! ${teamMe} el`;
      }else{
        profile.losses++;
        addXP(25);
        sound("lose");
        result=`TAKIMIN BATTI! ${teamMe}/${target}`;
      }

    }else{

      if(teamEnemy>=target){
        profile.losses++;
        addXP(20);
        result="Rakip takım ihaleyi tuttu.";
      }else{
        profile.wins++;
        profile.coins+=120;
        addXP(80);
        result="Rakip takım battı!";
      }
    }

  }else{

    /* Tekli mod: herkes ayrı değerlendirilir */
    const target=G.highestBid || 5;

    if(G.bidder===0){

      if(G.tricks[0]>=target){

        profile.wins++;
        profile.coins+=120;
        addXP(80);
        sound("win");

        result=
          `KAZANDIN! ${G.tricks[0]}/${target} el`;
      }else{

        profile.losses++;
        addXP(20);
        sound("lose");

        result=
          `BATTI! ${G.tricks[0]}/${target} el`;
      }

    }else{

      /* Kullanıcı ihaleci değilse kendi aldığı el sayısı ayrı */
      if(G.tricks[0]>=5){

        profile.wins++;
        profile.coins+=80;
        addXP(55);
        sound("win");

        result=
          `İYİ OYUN! ${G.tricks[0]} el aldın.`;
      }else{

        profile.losses++;
        addXP(15);

        result=
          `${G.tricks[0]} el aldın.`;
      }

    }
  }

  profile.games++;
  save();

  setTimeout(()=>{

    $("app").insertAdjacentHTML("beforeend",`
      <div class="modal" id="modal">

        <div class="modalBox">

          <div class="modalHead">
            <h2>🏆 El Bitti</h2>
          </div>

          <div style="text-align:center">

            <div style="
              font-size:48px;
              margin:12px 0">
              ${result.includes("KAZANDIN") || result.includes("KAZANDI") ? "🏆":"🃏"}
            </div>

            <h2>${result}</h2>

            <p style="
              color:#8ea99e;
              margin-top:10px;
              font-size:12px">
              Kazanılan eller:
              ${G.tricks.join(" • ")}
            </p>

            <button class="primary"
              style="width:100%"
              onclick="renderHome()">
              ANA MENÜ
            </button>

            <button class="primary"
              style="
                width:100%;
                background:#17261f;
                margin-top:8px"
              onclick="closeModal();startGame('${G.mode}')">
              TEKRAR OYNA
            </button>

          </div>

        </div>

      </div>
    `);

  },900);
}

  if(confirm("Oyundan çıkmak istediğine emin misin?")){
