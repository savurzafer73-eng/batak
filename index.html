<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06130c">
<title>Batak Royale</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#031008;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  touch-action:none;
}
body{
  display:flex;
  justify-content:center;
}
button{
  border:0;
  color:#fff;
  font-weight:800;
  cursor:pointer;
  touch-action:manipulation;
}
#app{
  width:100%;
  max-width:900px;
  height:100%;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 35%,#14552e 0,#08331d 35%,#04180d 75%,#020b06 100%);
}

/* MENÜ */
.screen{
  position:absolute;
  inset:0;
  z-index:50;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:25px;
  background:rgba(2,12,7,.96);
}
.screen h1{
  font-size:42px;
  margin-bottom:8px;
  color:#f4d56a;
  text-shadow:0 4px 15px #000;
}
.subtitle{
  color:#a9c5b2;
  margin-bottom:30px;
}
.menuBtns{
  width:min(360px,90vw);
  display:grid;
  gap:14px;
}
.menuBtn{
  padding:17px;
  border-radius:16px;
  font-size:18px;
  background:linear-gradient(135deg,#1e8b4a,#0d542b);
  box-shadow:0 6px 15px #0008;
}
.menuBtn.secondary{
  background:linear-gradient(135deg,#344d41,#1b2e24);
}
.menuBtn:active{transform:scale(.97)}

#game{
  position:absolute;
  inset:0;
  display:none;
}

/* ÜST BAR */
.topbar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:62px;
  padding:7px 9px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:linear-gradient(#020b07dd,#020b0790,transparent);
  z-index:10;
}
.info{
  display:flex;
  gap:7px;
  align-items:center;
}
.badge{
  background:#071d12dd;
  border:1px solid #ffffff20;
  padding:7px 9px;
  border-radius:10px;
  font-size:12px;
}
.badge b{color:#f5d56c}
.smallBtn{
  width:40px;
  height:40px;
  border-radius:12px;
  background:#183b28dd;
  font-size:18px;
}

/* MASA */
.table{
  position:absolute;
  left:5%;
  right:5%;
  top:18%;
  bottom:25%;
  border-radius:45% / 30%;
  background:
    radial-gradient(ellipse at center,#16703b 0,#0b4c29 50%,#06351c 100%);
  border:8px solid #4c2d17;
  box-shadow:
    inset 0 0 0 3px #986238,
    inset 0 0 50px #00190b,
    0 15px 35px #000b;
}
.center{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:170px;
  height:145px;
}
.trump{
  position:absolute;
  top:-5px;
  left:50%;
  transform:translateX(-50%);
  padding:5px 10px;
  border-radius:12px;
  background:#07150de8;
  font-size:12px;
  white-space:nowrap;
}
.trick{
  position:absolute;
  inset:15px;
}
.played{
  position:absolute;
  width:55px;
  height:78px;
}
.played.p0{left:50%;top:0;transform:translateX(-50%)}
.played.p1{right:0;top:50%;transform:translateY(-50%)}
.played.p2{left:50%;bottom:0;transform:translateX(-50%)}
.played.p3{left:0;top:50%;transform:translateY(-50%)}

/* OYUNCU ETİKETLERİ */
.player{
  position:absolute;
  z-index:8;
  text-align:center;
  min-width:100px;
}
.pname{
  display:inline-block;
  background:#06140de8;
  padding:6px 9px;
  border-radius:10px;
  font-size:12px;
  border:1px solid #ffffff18;
}
.pname.active{
  color:#f9d96a;
  border-color:#f9d96a;
  box-shadow:0 0 12px #f9d96a66;
}
.p0{top:12%;left:50%;transform:translateX(-50%)}
.p1{top:47%;right:1%}
.p2{bottom:24%;left:50%;transform:translateX(-50%)}
.p3{top:47%;left:1%}

/* KART */
.card{
  position:relative;
  width:64px;
  height:90px;
  border-radius:9px;
  background:linear-gradient(145deg,#fff,#e8e8e8);
  color:#111;
  border:2px solid #ddd;
  box-shadow:0 4px 8px #0008;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:5px;
  font-weight:900;
  font-size:20px;
  transition:transform .12s,box-shadow .12s;
  flex:none;
}
.card.red{color:#d62424}
.card.black{color:#111}
.card.back{
  background:
    repeating-linear-gradient(45deg,#123e27 0,#123e27 5px,#0b2b1b 5px,#0b2b1b 10px);
  border:2px solid #d5bd69;
}
.card .corner{
  font-size:15px;
  line-height:15px;
}
.card .suit{
  font-size:26px;
  text-align:center;
}
.card .bottom{
  transform:rotate(180deg);
  align-self:flex-end;
}
.card.selectable:active{
  transform:translateY(-7px);
}
.card.selected{
  transform:translateY(-13px);
  box-shadow:0 0 0 3px #f6d66d,0 8px 18px #000;
}

/* EL */
.handArea{
  position:absolute;
  z-index:20;
  left:8px;
  right:8px;
  bottom:5px;
  height:24%;
  min-height:165px;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.handTitle{
  height:24px;
  font-size:12px;
  color:#b9d0c0;
}
.hand{
  width:100%;
  display:grid;
  grid-template-columns:repeat(7,minmax(38px,1fr));
  grid-template-rows:repeat(2,90px);
  gap:5px;
  justify-items:center;
  align-items:start;
  max-width:560px;
}
.hand .card{
  width:min(64px,12vw);
  height:min(90px,17vw);
  min-width:42px;
  min-height:64px;
  font-size:clamp(15px,4vw,20px);
}
.hand .card .suit{font-size:clamp(18px,5vw,26px)}
.hand .card .corner{font-size:clamp(11px,3vw,15px)}
.hand .card:nth-child(n+8){
  grid-row:2;
}
.hand .card:nth-child(8){grid-column:1}
.hand .card:nth-child(9){grid-column:2}
.hand .card:nth-child(10){grid-column:3}
.hand .card:nth-child(11){grid-column:4}
.hand .card:nth-child(12){grid-column:5}
.hand .card:nth-child(13){grid-column:6}

/* PARTNER ELİ */
.partnerHand{
  position:absolute;
  z-index:25;
  top:7%;
  left:50%;
  transform:translateX(-50%);
  width:min(420px,88vw);
  display:none;
  grid-template-columns:repeat(7,1fr);
  gap:3px;
  padding:7px;
  border-radius:12px;
  background:#04140be8;
  border:1px solid #f3d26766;
}
.partnerHand.show{display:grid}
.partnerHand .card{
  width:42px;
  height:58px;
  font-size:12px;
}
.partnerHand .card .suit{font-size:17px}
.partnerHand .card .corner{font-size:9px}

/* KONTROLLER */
.controls{
  position:absolute;
  z-index:30;
  left:8px;
  right:8px;
  bottom:0;
  display:flex;
  justify-content:center;
  gap:7px;
  pointer-events:none;
}
.controlBtn{
  pointer-events:auto;
  min-width:80px;
  padding:10px 13px;
  border-radius:12px 12px 0 0;
  background:#173b27;
  border:1px solid #ffffff20;
}
.controlBtn.gold{background:#8d6a16}
.controlBtn:disabled{
  opacity:.35;
}

/* MODAL */
.modal{
  position:absolute;
  z-index:100;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#0009;
}
.modal.show{display:flex}
.box{
  width:min(390px,94vw);
  max-height:90vh;
  overflow:auto;
  border-radius:20px;
  padding:20px;
  background:linear-gradient(145deg,#123b25,#06150c);
  border:1px solid #ffffff20;
  box-shadow:0 20px 60px #000;
  text-align:center;
}
.box h2{
  color:#f4d36a;
  margin-bottom:15px;
}
.bidGrid,.suitGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.bidBtn,.suitBtn{
  padding:13px 5px;
  border-radius:11px;
  background:#205c37;
}
.bidBtn.pass{background:#4b2929}
.suitBtn{font-size:26px}
.suitBtn.red{color:#ff5555}
.modalText{
  color:#bcd2c2;
  margin-bottom:15px;
  line-height:1.4;
}
.scoreTable{
  width:100%;
  border-collapse:collapse;
  margin:12px 0 18px;
}
.scoreTable td,.scoreTable th{
  padding:8px 4px;
  border-bottom:1px solid #ffffff15;
}
.win{
  color:#f4d36a;
  font-size:25px;
  margin:10px;
}
.status{
  position:absolute;
  z-index:31;
  left:50%;
  top:11%;
  transform:translateX(-50%);
  background:#06150ddd;
  border:1px solid #ffffff20;
  border-radius:14px;
  padding:7px 12px;
  font-size:12px;
  white-space:nowrap;
  max-width:90%;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* SES */
.soundOn{color:#79e6a0}
.soundOff{color:#ff8d8d}

@media(max-width:500px){
  .table{left:2%;right:2%;top:18%;bottom:25%}
  .player.p1{right:0}
  .player.p3{left:0}
  .pname{font-size:10px;padding:5px 7px}
  .card{width:52px;height:75px}
  .handArea{min-height:150px}
  .hand{
    grid-template-rows:repeat(2,76px);
    gap:3px;
  }
  .center{transform:translate(-50%,-50%) scale(.85)}
}
</style>
</head>

<body>
<div id="app">

  <!-- ANA MENÜ -->
  <div id="menu" class="screen">
    <h1>♠ BATAK ROYALE</h1>
    <div class="subtitle">Mobil Batak • 2 Sıra • Sesli</div>

    <div class="menuBtns">
      <button class="menuBtn" onclick="startGame(false)">♠ TEKLİ BATAK</button>
      <button class="menuBtn" onclick="startGame(true)">♥ EŞLİ BATAK</button>
      <button class="menuBtn secondary" onclick="toggleMenuSound()">🔊 <span id="menuSoundText">Ses Açık</span></button>
    </div>
  </div>

  <!-- OYUN -->
  <div id="game">

    <div class="topbar">
      <div class="info">
        <div class="badge">Tur <b id="roundNo">1</b></div>
        <div class="badge">Koz <b id="topTrump">-</b></div>
        <div class="badge">İhale <b id="topBid">-</b></div>
      </div>
      <button class="smallBtn" onclick="openPause()">Ⅱ</button>
    </div>

    <div class="status" id="status">Oyun başlıyor...</div>

    <div class="table">
      <div class="center">
        <div class="trump" id="centerTrump">Koz: -</div>
        <div class="trick" id="trick"></div>
      </div>
    </div>

    <div class="player p0">
      <div id="name0" class="pname">Rakip 1</div>
    </div>

    <div class="player p1">
      <div id="name1" class="pname">Eş</div>
    </div>

    <div class="player p2">
      <div id="name2" class="pname">Rakip 2</div>
    </div>

    <div class="player p3">
      <div id="name3" class="pname active">Sen</div>
    </div>

    <!-- PARTNERİN ELİ -->
    <div id="partnerHand" class="partnerHand"></div>

    <!-- BENİM ELİM -->
    <div class="handArea">
      <div class="handTitle" id="handTitle">Elin • 13 kart</div>
      <div id="myHand" class="hand"></div>
    </div>

    <div class="controls">
      <button class="controlBtn" onclick="sortHand()">↕ Sırala</button>
      <button class="controlBtn" id="partnerBtn" onclick="togglePartner()" style="display:none">👥 Eşi Göster</button>
      <button class="controlBtn" onclick="newRound()">⟳ Yeni El</button>
    </div>
  </div>

  <!-- İHALE -->
  <div id="bidModal" class="modal">
    <div class="box">
      <h2>İHALE</h2>
      <div class="modalText" id="bidText">İhale sırası sende.</div>
      <div class="bidGrid" id="bidGrid"></div>
    </div>
  </div>

  <!-- KOZ -->
  <div id="suitModal" class="modal">
    <div class="box">
      <h2>KOZ SEÇ</h2>
      <div class="modalText">İhaleyi kazandın. Kozunu seç.</div>
      <div class="suitGrid">
        <button class="suitBtn red" onclick="chooseTrump('♥')">♥</button>
        <button class="suitBtn red" onclick="chooseTrump('♦')">♦</button>
        <button class="suitBtn" onclick="chooseTrump('♣')">♣</button>
        <button class="suitBtn" onclick="chooseTrump('♠')">♠</button>
      </div>
    </div>
  </div>

  <!-- SONUÇ -->
  <div id="resultModal" class="modal">
    <div class="box">
      <h2>EL BİTTİ</h2>
      <div id="winnerText" class="win"></div>
      <table class="scoreTable">
        <thead>
          <tr><th>Oyuncu</th><th>İhale</th><th>El</th><th>Puan</th></tr>
        </thead>
        <tbody id="scoreBody"></tbody>
      </table>
      <button class="menuBtn" onclick="newRound()">▶ Yeni El</button>
      <br><br>
      <button class="menuBtn secondary" onclick="backMenu()">☰ Menü</button>
    </div>
  </div>

  <!-- DURAKLAT -->
  <div id="pauseModal" class="modal">
    <div class="box">
      <h2>OYUN DURAKLATILDI</h2>
      <button class="menuBtn" onclick="closePause()">▶ Devam</button>
      <br>
      <button class="menuBtn secondary" onclick="backMenu()">☰ Menü</button>
      <br>
      <button class="menuBtn secondary" onclick="toggleGameSound()">🔊 <span id="pauseSoundText">Ses Açık</span></button>
    </div>
  </div>

</div>

<script>
/* =========================================================
   BATAK ROYALE
   52 KART - 4 OYUNCU
   MOBİL + 2 SIRA + SES
========================================================= */

const SUITS=["♥","♦","♣","♠"];
const RANKS=[
  {r:"2",v:2},{r:"3",v:3},{r:"4",v:4},{r:"5",v:5},
  {r:"6",v:6},{r:"7",v:7},{r:"8",v:8},{r:"9",v:9},
  {r:"10",v:10},{r:"J",v:11},{r:"Q",v:12},{r:"K",v:13},
  {r:"A",v:14}
];

let players=[];
let deck=[];
let modeTeam=false;
let dealer=0;
let turn=0;
let leader=0;
let trump=null;
let highestBid=0;
let bidder=-1;
let bids=[null,null,null,null];
let trick=[];
let tricksWon=[0,0,0,0];
let scores=[0,0,0,0];
let round=1;
let gameStarted=false;
let bidding=false;
let playing=false;
let partnerVisible=false;
let opponentTrumpPlayed=false;

let sound=true;
let audioCtx=null;

/* SES SİSTEMİ */
function audio(){
  if(!sound) return null;
  if(!audioCtx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    audioCtx=new AC();
  }
  if(audioCtx.state==="suspended") audioCtx.resume();
  return audioCtx;
}

function tone(freq,duration=.08,type="sine",volume=.035,delay=0){
  const c=audio();
  if(!c)return;
  const o=c.createOscillator();
  const g=c.createGain();
  o.type=type;
  o.frequency.value=freq;
  g.gain.setValueAtTime(0,c.currentTime+delay);
  g.gain.linearRampToValueAtTime(volume,c.currentTime+delay+.01);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+delay+duration);
  o.connect(g);
  g.connect(c.destination);
  o.start(c.currentTime+delay);
  o.stop(c.currentTime+delay+duration+.02);
}

function cardSound(){
  tone(520,.05,"triangle",.025);
  tone(700,.07,"triangle",.02,.04);
}
function bidSound(){
  tone(430,.08,"square",.025);
  tone(650,.1,"square",.02,.08);
}
function winSound(){
  tone(600,.12,"sine",.04);
  tone(800,.12,"sine",.035,.12);
  tone(1000,.18,"sine",.03,.24);
}
function loseSound(){
  tone(300,.12,"sine",.035);
  tone(220,.18,"sine",.025,.12);
}
function turnSound(){
  tone(850,.08,"triangle",.03);
}

/* SES AYARI */
function toggleMenuSound(){
  sound=!sound;
  updateSoundTexts();
  if(sound) tone(700,.1);
}
function toggleGameSound(){
  sound=!sound;
  updateSoundTexts();
  if(sound) tone(700,.1);
}
function updateSoundTexts(){
  const txt=sound?"Ses Açık":"Ses Kapalı";
  document.getElementById("menuSoundText").textContent=txt;
  document.getElementById("pauseSoundText").textContent=txt;
}

/* KART */
function makeDeck(){
  deck=[];
  for(const s of SUITS){
    for(const x of RANKS){
      deck.push({
        suit:s,
        rank:x.r,
        value:x.v,
        id:s+x.r
      });
    }
  }
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
}

function cardHTML(c,back=false){
  if(back){
    return `<div class="card back"></div>`;
  }
  const red=(c.suit==="♥"||c.suit==="♦")?"red":"black";
  return `
    <div class="card ${red}" data-id="${c.id}">
      <div class="corner">${c.rank}${c.suit}</div>
      <div class="suit">${c.suit}</div>
      <div class="corner bottom">${c.rank}${c.suit}</div>
    </div>`;
}

/* OYUN BAŞLAT */
function startGame(team){
  audio();
  modeTeam=team;
  gameStarted=true;
  round=1;
  scores=[0,0,0,0];
  dealer=Math.floor(Math.random()*4);

  document.getElementById("menu").style.display="none";
  document.getElementById("game").style.display="block";

  players=[
    {name:"Rakip 1",hand:[]},
    {name:team?"Eş":"Rakip 2",hand:[]},
    {name:team?"Rakip 2":"Rakip 3",hand:[]},
    {name:"Sen",hand:[]}
  ];

  for(let i=0;i<4;i++){
    document.getElementById("name"+i).textContent=players[i].name;
  }

  document.getElementById("partnerBtn").style.display=team?"block":"none";
  newRound();
}

function newRound(){
  if(!gameStarted)return;

  document.getElementById("resultModal").classList.remove("show");
  document.getElementById("pauseModal").classList.remove("show");
  document.getElementById("bidModal").classList.remove("show");
  document.getElementById("suitModal").classList.remove("show");

  makeDeck();
  shuffle(deck);

  players.forEach(p=>p.hand=[]);

  for(let i=0;i<52;i++){
    players[i%4].hand.push(deck[i]);
  }

  players.forEach(p=>sortCards(p.hand));

  trump=null;
  highestBid=0;
  bidder=-1;
  bids=[null,null,null,null];
  tricksWon=[0,0,0,0];
  trick=[];
  playing=false;
  bidding=true;
  partnerVisible=false;
  opponentTrumpPlayed=false;

  dealer=(dealer+1)%4;
  turn=(dealer+1)%4;
  leader=turn;

  document.getElementById("roundNo").textContent=round;
  document.getElementById("topTrump").textContent="-";
  document.getElementById("topBid").textContent="-";
  document.getElementById("centerTrump").textContent="Koz: -";

  renderHand();
  renderTrick();
  updatePlayers();

  setStatus(players[turn].name+" ihale yapıyor");

  setTimeout(nextBid,600);
}

/* SIRALAMA */
function sortCards(hand){
  const suitOrder={"♥":0,"♦":1,"♣":2,"♠":3};
  hand.sort((a,b)=>{
    if(suitOrder[a.suit]!==suitOrder[b.suit])
      return suitOrder[a.suit]-suitOrder[b.suit];
    return b.value-a.value;
  });
}
function sortHand(){
  sortCards(players[3].hand);
  renderHand();
  cardSound();
}

/* İHALE */
function nextBid(){
  if(!bidding)return;

  if(turn===3){
    showBidModal();
  }else{
    setTimeout(()=>aiBid(turn),500);
  }
}

function showBidModal(){
  const grid=document.getElementById("bidGrid");
  grid.innerHTML="";

  for(let n=5;n<=13;n++){
    const b=document.createElement("button");
    b.className="bidBtn";
    b.textContent=n;
    b.disabled=n<=highestBid;
    b.onclick=()=>humanBid(n);
    grid.appendChild(b);
  }

  const pass=document.createElement("button");
  pass.className="bidBtn pass";
  pass.textContent="PAS";
  pass.onclick=()=>humanBid(null);
  grid.appendChild(pass);

  document.getElementById("bidText").textContent=
    highestBid?
    "Mevcut en yüksek ihale: "+highestBid:
    "İhaleyi 5'ten başlatabilirsin.";

  document.getElementById("bidModal").classList.add("show");
  turnSound();
}

function humanBid(value){
  document.getElementById("bidModal").classList.remove("show");
  acceptBid(3,value);
}

function acceptBid(p,value){
  bids[p]=value;

  if(value!==null && value>highestBid){
    highestBid=value;
    bidder=p;
    bidSound();
  }else{
    tone(280,.06,"triangle",.02);
  }

  let next=(p+1)%4;

    const lastBidder=bidder;

    for(let i=0;i<4;i++){

  }

  /* tümü pas */
  if(bids.every(x=>x===null) && bids.filter(x=>x===null).length===4)
    return true;

  return false;
}
