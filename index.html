<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#06130c">
<title>Batak Royale</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020403;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

button{
    font-family:Arial,Helvetica,sans-serif;
}

#game{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
}

/* MASA */

.table{
    position:absolute;
    inset:1.5%;
    overflow:hidden;
    border-radius:42px;
    border:13px solid #24140b;

    background:
    radial-gradient(circle at 50% 50%,rgba(45,143,82,.22),transparent 42%),
    radial-gradient(circle at 50% 45%,#126039 0%,#0b4b2b 42%,#06331d 100%);

    box-shadow:
    0 25px 70px #000,
    inset 0 0 0 3px #75451f,
    inset 0 0 0 7px #321b0d,
    inset 0 0 90px rgba(0,0,0,.65);
}

.table:before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.17;
    background:
    repeating-linear-gradient(
        0deg,
        rgba(255,255,255,.035) 0px,
        rgba(255,255,255,.035) 1px,
        transparent 1px,
        transparent 4px
    ),
    repeating-linear-gradient(
        90deg,
        rgba(0,0,0,.035) 0px,
        rgba(0,0,0,.035) 1px,
        transparent 1px,
        transparent 5px
    );
}

.table:after{
    content:"";
    position:absolute;
    inset:15px;
    border:1px solid rgba(240,202,100,.17);
    border-radius:30px;
    pointer-events:none;
}

/* ÜST BAR */

.header{
    position:absolute;
    top:15px;
    left:25px;
    right:25px;
    height:45px;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:8px;
    color:#f2d273;
    font-size:16px;
    font-weight:900;
    text-shadow:0 2px 5px #000;
}

.logoIcon{
    width:33px;
    height:33px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    background:linear-gradient(#e0bd5d,#88631d);
    color:#fff2ae;
    box-shadow:0 4px 9px #000;
}

.stats{
    display:flex;
    gap:6px;
}

.stat{
    min-width:62px;
    padding:5px 8px;
    border-radius:10px;
    background:rgba(0,0,0,.38);
    border:1px solid rgba(255,255,255,.1);
    color:#aebdb3;
    text-align:center;
    font-size:8px;
}

.stat b{
    display:block;
    margin-top:2px;
    color:#fff;
    font-size:12px;
}

/* OYUNCULAR */

.player{
    position:absolute;
    z-index:60;
    min-width:116px;
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px 9px;
    color:#fff;
    border-radius:14px;
    background:linear-gradient(145deg,rgba(30,48,37,.96),rgba(4,13,8,.94));
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 7px 17px rgba(0,0,0,.45);
}

.player.active{
    border-color:#f0cb65;
    box-shadow:
    0 0 0 1px rgba(240,203,101,.2),
    0 7px 17px #000,
    0 0 15px rgba(240,203,101,.16);
}

.avatar{
    width:32px;
    height:32px;
    flex-shrink:0;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(145deg,#d8b456,#73531a);
    border:2px solid rgba(255,255,255,.3);
    box-shadow:0 2px 7px #000;
    font-size:16px;
}

.playerName{
    font-size:11px;
    font-weight:900;
}

.playerInfo small{
    display:block;
    margin-top:2px;
    color:#9baaa0;
    font-size:8px;
}

.player.top{
    top:70px;
    left:50%;
    transform:translateX(-50%);
}

.player.left{
    left:18px;
    top:43%;
    transform:translateY(-50%);
}

.player.right{
    right:18px;
    top:43%;
    transform:translateY(-50%);
}

.player.bottom{
    left:50%;
    bottom:143px;
    transform:translateX(-50%);
}

.dot{
    position:absolute;
    width:8px;
    height:8px;
    right:5px;
    top:5px;
    border-radius:50%;
    background:#4be784;
    box-shadow:0 0 12px #4be784;
    display:none;
}

.player.active .dot{
    display:block;
}

/* KOZ */

.trump{
    position:absolute;
    z-index:70;
    left:50%;
    top:104px;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:7px;
    padding:6px 13px;
    border-radius:20px;
    background:rgba(0,0,0,.42);
    border:1px solid rgba(255,255,255,.1);
    color:#b9c5bc;
    font-size:9px;
}

.trump b{
    color:#f4d46f;
}

/* ORTA */

.center{
    position:absolute;
    width:300px;
    height:245px;
    left:50%;
    top:46%;
    transform:translate(-50%,-50%);
    z-index:15;
}

.centerRing{
    position:absolute;
    width:190px;
    height:190px;
    left:55px;
    top:25px;
    border-radius:50%;
    border:1px solid rgba(240,201,95,.12);
    box-shadow:inset 0 0 40px rgba(0,0,0,.15);
}

.centerLogo{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:38px;
    color:rgba(242,204,101,.10);
}

.played{
    position:absolute;
    width:61px;
    height:86px;
    padding:5px;
    border-radius:8px;
    background:linear-gradient(145deg,#fff,#e8e8e4);
    border:1px solid #c8c8c5;
    box-shadow:0 7px 15px rgba(0,0,0,.55);
    color:#111;
    font-weight:900;
}

.played.red{
    color:#d21e2b;
}

.played .small{
    font-size:13px;
    line-height:13px;
}

.played .big{
    text-align:center;
    font-size:28px;
    margin-top:4px;
}

.pcTop{
    left:120px;
    top:0;
}

.pcRight{
    left:188px;
    top:70px;
}

.pcBottom{
    left:120px;
    top:140px;
}

.pcLeft{
    left:52px;
    top:70px;
}

/* MESAJ */

.message{
    position:absolute;
    z-index:90;
    left:50%;
    top:calc(46% + 132px);
    transform:translateX(-50%);
    width:min(84%,390px);
    min-height:34px;
    padding:8px 12px;
    border-radius:18px;
    background:rgba(2,11,6,.68);
    border:1px solid rgba(255,255,255,.08);
    color:#dce6df;
    text-align:center;
    font-size:10px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.message b{
    color:#f4d46f;
}

/* EL */

.hand{
    position:absolute;
    left:50%;
    bottom:75px;
    transform:translateX(-50%);
    width:96%;
    max-width:680px;
    z-index:110;
}

.handRow{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    position:relative;
}

.topRow{
    z-index:1;
    margin-bottom:-22px;
}

.bottomRow{
    z-index:5;
}

/* KART */

.card{
    position:relative;
    flex:0 0 auto;
    width:67px;
    height:95px;
    margin-left:-12px;
    border-radius:9px;
    cursor:pointer;

    background:
    linear-gradient(145deg,#fff 0%,#f7f7f4 55%,#deded9 100%);

    border:1px solid #c6c6c1;

    box-shadow:
    0 6px 12px rgba(0,0,0,.5),
    inset 0 0 0 1px rgba(255,255,255,.9);

    color:#111;

    transition:
    transform .14s ease,
    box-shadow .14s ease;
}

.card:first-child{
    margin-left:0;
}

.card.red{
    color:#d41f2b;
}

.card:before{
    content:"";
    position:absolute;
    inset:3px;
    border-radius:6px;
    border:1px solid rgba(0,0,0,.05);
}

.cardTop{
    position:absolute;
    top:5px;
    left:5px;
    font-size:15px;
    line-height:14px;
    font-weight:900;
}

.cardSuit{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:30px;
}

.cardBottom{
    position:absolute;
    right:5px;
    bottom:5px;
    transform:rotate(180deg);
    font-size:15px;
    line-height:14px;
    font-weight:900;
}

.card.selected{
    transform:translateY(-19px);
    z-index:100;
    box-shadow:
    0 16px 22px rgba(0,0,0,.65),
    0 0 0 2px #f2d16c,
    0 0 18px rgba(242,209,108,.35);
}

.card.illegal{
    animation:shake .25s;
}

@keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-4px)}
    75%{transform:translateX(4px)}
}

/* KONTROLLER */

.controls{
    position:absolute;
    left:50%;
    bottom:10px;
    transform:translateX(-50%);
    z-index:150;
    display:flex;
    gap:6px;
    padding:5px;
    border-radius:16px;
    background:rgba(0,0,0,.38);
    border:1px solid rgba(255,255,255,.08);
}

.btn{
    height:38px;
    min-width:76px;
    padding:0 10px;
    border-radius:11px;
    border:1px solid rgba(255,255,255,.12);
    color:white;
    background:linear-gradient(145deg,#315e46,#153322);
    font-size:9px;
    font-weight:900;
    cursor:pointer;
}

.btn.gold{
    color:#1c1405;
    background:linear-gradient(145deg,#ffe68a,#b98823);
}

.btn:active{
    transform:translateY(2px);
}

/* SES */

.sound{
    position:absolute;
    top:18px;
    right:105px;
    z-index:200;
    width:33px;
    height:33px;
    border:0;
    border-radius:10px;
    color:#fff;
    background:rgba(0,0,0,.4);
    border:1px solid rgba(255,255,255,.1);
    cursor:pointer;
}

/* MODAL */

.modal{
    position:absolute;
    inset:0;
    z-index:500;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.74);
    backdrop-filter:blur(4px);
    padding:20px;
}

.modal.show{
    display:flex;
}

.modalBox{
    width:100%;
    max-width:380px;
    padding:24px;
    border-radius:22px;
    background:linear-gradient(145deg,#1b432f,#071710);
    border:1px solid rgba(240,204,105,.25);
    box-shadow:0 25px 70px #000;
    color:white;
    text-align:center;
}

.modalIcon{
    width:50px;
    height:50px;
    margin:0 auto 9px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:15px;
    background:rgba(240,201,88,.1);
    color:#f2d06b;
    font-size:25px;
}

.modalBox h2{
    color:#f2d06b;
    font-size:20px;
    margin-bottom:7px;
}

.modalBox p{
    color:#a5b1a9;
    font-size:11px;
    margin-bottom:18px;
}

.bidGrid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.bid{
    height:46px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:10px;
    color:#fff;
    background:linear-gradient(145deg,#2d6347,#163623);
    font-weight:900;
    font-size:14px;
    cursor:pointer;
}

.suitGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.suit{
    height:62px;
    border-radius:13px;
    border:1px solid #ddd;
    background:linear-gradient(145deg,#fff,#e6e6e2);
    font-size:30px;
    font-weight:900;
    cursor:pointer;
}

.suit.red{
    color:#d51f2b;
}

/* SONUÇ */

.result{
    position:absolute;
    inset:0;
    z-index:600;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.78);
    padding:20px;
}

.result.show{
    display:flex;
}

.resultBox{
    width:100%;
    max-width:390px;
    padding:27px;
    border-radius:23px;
    background:linear-gradient(145deg,#173e2b,#06140c);
    border:1px solid rgba(242,207,104,.28);
    text-align:center;
    color:#fff;
    box-shadow:0 25px 70px #000;
}

.resultBox h1{
    color:#f3d274;
    margin-bottom:10px;
}

.resultScore{
    font-size:44px;
    font-weight:900;
    color:#fff;
    margin:15px 0;
}

.resultText{
    color:#b5c0b8;
    font-size:12px;
    margin-bottom:20px;
}

.resultButton{
    width:100%;
    height:45px;
    border:0;
    border-radius:12px;
    color:#171005;
    background:linear-gradient(145deg,#ffe486,#b98a27);
    font-weight:900;
}

/* MOBİL */

@media(max-width:600px){

    .table{
        inset:1%;
        border-width:9px;
        border-radius:29px;
    }

    .table:after{
        inset:10px;
        border-radius:21px;
    }

    .header{
        left:13px;
        right:13px;
        top:9px;
    }

    .logo{
        font-size:12px;
    }

    .logoIcon{
        width:28px;
        height:28px;
        font-size:15px;
    }

    .stat{
        min-width:52px;
        padding:4px 5px;
    }

    .sound{
        right:86px;
        top:10px;
        width:29px;
        height:29px;
    }

    .player{
        min-width:88px;
        padding:5px 7px;
    }

    .avatar{
        width:27px;
        height:27px;
        font-size:13px;
    }

    .playerName{
        font-size:9px;
    }

    .playerInfo small{
        font-size:7px;
    }

    .player.top{
        top:56px;
    }

    .player.left{
        left:6px;
        top:42%;
    }

    .player.right{
        right:6px;
        top:42%;
    }

    .player.bottom{
        bottom:130px;
    }

    .trump{
        top:88px;
        font-size:8px;
        padding:5px 10px;
    }

    .center{
        top:45%;
        transform:translate(-50%,-50%) scale(.78);
    }

    .message{
        top:calc(45% + 125px);
        font-size:9px;
    }

    .hand{
        bottom:68px;
        width:97%;
    }

    .card{
        width:51px;
        height:73px;
        margin-left:-9px;
        border-radius:7px;
    }

    .topRow{
        margin-bottom:-17px;
    }

    .cardTop{
        left:4px;
        top:4px;
        font-size:11px;
        line-height:11px;
    }

    .cardSuit{
        font-size:23px;
    }

    .cardBottom{
        right:4px;
        bottom:4px;
        font-size:11px;
        line-height:11px;
    }

    .card.selected{
        transform:translateY(-14px);
    }

    .controls{
        bottom:7px;
    }

    .btn{
        min-width:63px;
        height:34px;
        padding:0 7px;
        font-size:8px;
    }
}

@media(max-width:380px){

    .card{
        width:45px;
        height:65px;
        margin-left:-8px;
    }

    .topRow{
        margin-bottom:-14px;
    }

    .cardSuit{
        font-size:20px;
    }

    .cardTop,
    .cardBottom{
        font-size:9px;
        line-height:9px;
    }

    .player{
        min-width:76px;
    }

    .playerInfo small{
        display:none;
    }

    .center{
        transform:translate(-50%,-50%) scale(.67);
    }

    .btn{
        min-width:58px;
        font-size:7px;
    }
}
</style>
</head>

<body>

<div id="game">

<div class="table">

<!-- HEADER -->

<div class="header">

    <div class="logo">
        <div class="logoIcon">♠</div>
        <span>BATAK ROYALE</span>
    </div>

    <div class="stats">

        <div class="stat">
            EL
            <b id="round">1</b>
        </div>

        <div class="stat">
            ELDE
            <b id="trickNo">0/13</b>
        </div>

        <div class="stat">
            PUAN
            <b id="score">0</b>
        </div>

    </div>

</div>

<button class="sound" id="soundButton">🔊</button>


<!-- OYUNCULAR -->

<div class="player top" id="player1">
    <div class="avatar">👨</div>
    <div class="playerInfo">
        <div class="playerName">Mehmet</div>
        <small id="count1">13 kart</small>
    </div>
    <span class="dot"></span>
</div>

<div class="player left" id="player2">
    <div class="avatar">👨</div>
    <div class="playerInfo">
        <div class="playerName">Ali</div>
        <small id="count2">13 kart</small>
    </div>
    <span class="dot"></span>
</div>

<div class="player right" id="player3">
    <div class="avatar">👨</div>
    <div class="playerInfo">
        <div class="playerName">Ahmet</div>
        <small id="count3">13 kart</small>
    </div>
    <span class="dot"></span>
</div>

<div class="player bottom active" id="player0">
    <div class="avatar">👑</div>
    <div class="playerInfo">
        <div class="playerName">Zafer</div>
        <small id="count0">13 kart</small>
    </div>
    <span class="dot"></span>
</div>


<!-- KOZ -->

<div class="trump">
    KOZ:
    <b id="trumpText">BEKLENİYOR</b>
</div>


<!-- ORTA -->

<div class="center">

    <div class="centerRing"></div>
    <div class="centerLogo">♠</div>

    <div class="played pcTop" id="played1"></div>
    <div class="played pcRight" id="played2"></div>
    <div class="played pcBottom" id="played3"></div>
    <div class="played pcLeft" id="played0"></div>

</div>


<!-- MESAJ -->

<div class="message" id="message">
    Oyuna başlamak için <b>İHALE</b> yap.
</div>


<!-- EL -->

<div class="hand" id="hand">

    <div class="handRow topRow" id="rowTop"></div>

    <div class="handRow bottomRow" id="rowBottom"></div>

</div>


<!-- KONTROLLER -->

<div class="controls">

    <button class="btn gold" id="bidButton">
        İHALE
    </button>

    <button class="btn" id="trumpButton">
        KOZ
    </button>

    <button class="btn" id="newButton">
        YENİ OYUN
    </button>

</div>

</div>


<!-- İHALE MODALI -->

<div class="modal" id="bidModal">

<div class="modalBox">

    <div class="modalIcon">♠</div>

    <h2>İhale</h2>

    <p>Bu elde kaç el alacağını seç.</p>

    <div class="bidGrid">

        <button class="bid" data-bid="3">3</button>
        <button class="bid" data-bid="4">4</button>
        <button class="bid" data-bid="5">5</button>
        <button class="bid" data-bid="6">6</button>
        <button class="bid" data-bid="7">7</button>
        <button class="bid" data-bid="8">8</button>
        <button class="bid" data-bid="9">9</button>
        <button class="bid" data-bid="10">10</button>

    </div>

</div>

</div>


<!-- KOZ MODALI -->

<div class="modal" id="trumpModal">

<div class="modalBox">

    <div class="modalIcon">♦</div>

    <h2>Koz Seç</h2>

    <p>Oyunda kullanılacak koz rengini seç.</p>

    <div class="suitGrid">

        <button class="suit red" data-suit="♥">♥</button>
        <button class="suit" data-suit="♠">♠</button>
        <button class="suit red" data-suit="♦">♦</button>
        <button class="suit" data-suit="♣">♣</button>

    </div>

</div>

</div>


<!-- SONUÇ -->

<div class="result" id="result">

<div class="resultBox">

    <h1>EL BİTTİ</h1>

    <div class="resultScore" id="resultScore">
        0
    </div>

    <div class="resultText" id="resultText">
        Sonuç
    </div>

    <button class="resultButton" id="resultButton">
        YENİ EL
    </button>

</div>

</div>

</div>


<script>
"use strict";

/* =========================================================
   SES SİSTEMİ
========================================================= */

var audioContext = null;
var soundEnabled = true;

function initAudio(){

    if(!audioContext){

        var AC =
            window.AudioContext ||
            window.webkitAudioContext;

        if(AC){
            audioContext = new AC();
        }

    }

    if(audioContext && audioContext.state === "suspended"){
        audioContext.resume();
    }

}

function tone(freq,duration,type,volume){

    if(!soundEnabled){
        return;
    }

    initAudio();

    if(!audioContext){
        return;
    }

    var osc = audioContext.createOscillator();
    var gain = audioContext.createGain();

    osc.type = type || "sine";
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(0.0001,audioContext.currentTime);

    gain.gain.exponentialRampToValueAtTime(
        volume || .08,
        audioContext.currentTime + .01
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioContext.currentTime + duration
    );

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start();

    osc.stop(
        audioContext.currentTime + duration + .02
    );
}

/* =========================================================
   DESTE
========================================================= */

var suits = [
    {s:"♠",red:false},
    {s:"♥",red:true},
    {s:"♦",red:true},
    {s:"♣",red:false}
];

var ranks = [
    {r:"2",v:2},
    {r:"3",v:3},
    {r:"4",v:4},
    {r:"5",v:5},
    {r:"6",v:6},
    {r:"7",v:7},
    {r:"8",v:8},
    {r:"9",v:9},
    {r:"10",v:10},
    {r:"J",v:11},
    {r:"Q",v:12},
    {r:"K",v:13},
    {r:"A",v:14}
];

function makeDeck(){

    var deck = [];

    for(var s=0;s<suits.length;s++){

        for(var r=0;r<ranks.length;r++){

            deck.push({
                suit:suits[s].s,
                red:suits[s].red,
                rank:ranks[r].r,
                value:ranks[r].v
            });

        }

    }

    return deck;

}

function shuffle(deck){

    for(var i=deck.length-1;i>0;i--){

        var j=Math.floor(Math.random()*(i+1));

        var temp=deck[i];

        deck[i]=deck[j];
        deck[j]=temp;

    }

    return deck;

}


/* =========================================================
   OYUNCULAR
========================================================= */

var players = [
    {name:"Zafer",hand:[],tricks:0,bid:0},
    {name:"Mehmet",hand:[],tricks:0,bid:0},
    {name:"Ali",hand:[],tricks:0,bid:0},
    {name:"Ahmet",hand:[],tricks:0,bid:0}
];

var currentPlayer = 0;
var leader = 0;

var trick = [];

var trump = null;
var leadSuit = null;

var playerBid = null;

var round = 1;
var score = 0;
var totalScore = 0;

var gameStarted = false;
var waitingForTrump = false;
var dealing = false;

    document.getElementById("message");

    document.getElementById("rowTop");

var rowBottom =

/* =========================================================
   YARDIMCI
========================================================= */

function setMessage(text){
    message.innerHTML=text;
}

function cardLabel(card){
    return card.rank + card.suit;
}

function suitOf(card){
    return card.suit;
}

function hasSuit(player,suit){

    for(var i=0;i<player.hand.length;i++){

        if(player.hand[i].suit===suit){
            return true;
        }

    }

    return false;
}

function getPlayerElement(index){

    return document.getElementById(
        "player"+index
    );

}

function updatePlayers(){

    for(var i=0;i<4;i++){

        var el=getPlayerElement(i);

        if(!el)continue;

        el.classList.remove("active");

        if(i===currentPlayer){
            el.classList.add("active");
        }

        document.getElementById(
            "count"+i
        ).textContent =
            players[i].hand.length+" kart";

    }

}


/* =========================================================
   KART SIRALAMA
========================================================= */

var suitOrder={
    "♠":0,
    "♥":1,
    "♦":2,
    "♣":3
};

function sortHand(hand){

    hand.sort(function(a,b){

        if(suitOrder[a.suit] !== suitOrder[b.suit]){
            return suitOrder[a.suit]-suitOrder[b.suit];
        }

        return b.value-a.value;

    });

}


/* =========================================================
   OYUNCU ELİNİ GÖSTER
========================================================= */

function renderPlayerHand(){

    rowTop.innerHTML="";
    rowBottom.innerHTML="";

    var hand=players[0].hand;

    for(var i=0;i<hand.length;i++){

        var card=hand[i];

        var div=document.createElement("div");

        div.className=
            "card"+
            (card.red?" red":"");

        div.dataset.index=i;

        div.innerHTML=
            '<div class="cardTop">'+
            card.rank+"<br>"+card.suit+
            '</div>'+
            '<div class="cardSuit">'+
            card.suit+
            '</div>'+
            '<div class="cardBottom">'+
            card.rank+"<br>"+card.suit+
            '</div>';

        div.addEventListener(
            "click",
            function(){

                var index=
                    parseInt(
                        this.dataset.index,
                        10
                    );

                chooseCard(index,this);

            }
        );

        if(i<7){
            rowTop.appendChild(div);
        }else{
            rowBottom.appendChild(div);
        }

    }

}


/* =========================================================
   OYNANABİLİR KART KONTROLÜ
========================================================= */

function canPlay(card,playerIndex){

    if(playerIndex!==0){
        return true;
    }

    if(trick.length===0){
        return true;
    }

    if(card.suit===leadSuit){
        return true;
    }

    if(hasSuit(players[0],leadSuit)){
        return false;
    }

    return true;

}


/* =========================================================
   KART SEÇ
========================================================= */

var selectedIndex=-1;

function chooseCard(index,element){

    if(!gameStarted){
        return;
    }

    if(currentPlayer!==0){
        setMessage("Şu anda sıra rakipte.");
        badSound();
        return;
    }

    if(index<0 || index>=players[0].hand.length){
        return;
    }

    var card=players[0].hand[index];

    if(!canPlay(card,0)){

        element.classList.add("illegal");

        setMessage(
            "Bu elde <b>"+
            leadSuit+
            "</b> oynamak zorundasın."
        );

        badSound();

        setTimeout(function(){
            element.classList.remove("illegal");
        },300);

        return;
    }

    selectedIndex=index;

    var all=document.querySelectorAll(".card");

    for(var i=0;i<all.length;i++){
        all[i].classList.remove("selected");
    }

    element.classList.add("selected");

    selectSound();

    setTimeout(function(){

        playCard(0,index);

    },220);

}


/* =========================================================
   KART OYNA
========================================================= */

function playCard(playerIndex,index){

    if(index<0 ||
       index>=players[playerIndex].hand.length){
        return;
    }

    var card=
        players[playerIndex].hand.splice(index,1)[0];

    selectedIndex=-1;

    if(trick.length===0){
        leadSuit=card.suit;
    }

    trick.push({
        player:playerIndex,
        card:card
    });

    playSound();

    showPlayedCard(playerIndex,card);

    renderPlayerHand();

    updatePlayers();

    setMessage(
        "<b>"+
        players[playerIndex].name+
        "</b> oynadı: <b>"+
        cardLabel(card)+
        "</b>"
    );

    if(trick.length===4){

        setTimeout(resolveTrick,800);

    }else{

        currentPlayer=(playerIndex+1)%4;

        updatePlayers();

        if(currentPlayer===0){

            setMessage(
                "Sıra sende. Bir kart seç."
            );

        }else{

            setTimeout(aiPlay,650);

        }

    }

}

   ORTA KARTA
========================================================= */

function showPlayedCard(playerIndex,card){

        document.getElementById(

    el.className=

}


/* =========================================================
   ORTA KARTLARI TEMİZLE
========================================================= */

function clearPlayed(){

    for(var i=0;i<4;i++){

        var el=
            document.getElementById(
                "played"+i
            );

        if(el){
            el.innerHTML="";
            el.className="played";
        }

    }

}


/* =========================================================
   EL KAZANANI
========================================================= */

function cardBeats(a,b){

    if(a.suit===b.suit){
        return a.value>b.value;
    }

    if(trump && a.suit===trump && b.suit!==trump){
        return true;
    }

    if(trump && b.suit===trump && a.suit!==trump){
        return false;
    }

    if(a.suit===leadSuit && b.suit!==leadSuit){
        return true;
    }

    return false;

}

function resolveTrick(){

    var winner=trick[0];

    for(var i=1;i<trick.length;i++){

        if(cardBeats(
            trick[i].card,
            winner.card
        )){
            winner=trick[i];
        }

    }

    players[winner.player].tricks++;

    winSound();

    setMessage(
        "<b>"+
        players[winner.player].name+
        "</b> eli aldı! "+
        cardLabel(winner.card)
    );

    updateTrickInfo();

    setTimeout(function(){

        clearPlayed();

        trick=[];

        leadSuit=null;

        currentPlayer=winner.player;

        updatePlayers();

        if(players[0].hand.length===0){

            finishRound();

        }else{

            if(currentPlayer===0){

                setMessage(
                    "Sıra sende. Bir kart seç."
                );

            }else{

                setTimeout(aiPlay,700);

            }

        }

    },900);

}


/* =========================================================
   AI
========================================================= */

function legalCards(player){

    if(trick.length===0){
        return player.hand.slice();
    }

    var legal=[];

    for(var i=0;i<player.hand.length;i++){

        if(player.hand[i].suit===leadSuit){
            legal.push(player.hand[i]);
        }

    }

    if(legal.length>0){
        return legal;
    }

    return player.hand.slice();

}

function chooseAI(player){

    var legal=legalCards(player);

    if(legal.length===1){
        return legal[0];
    }

    /* Önce kazanabilecek bir kart ara */

    var currentWinner=null;

    for(var i=0;i<trick.length;i++){

        if(!currentWinner ||
           cardBeats(
               trick[i].card,
               currentWinner.card
           )){
            currentWinner=trick[i];
        }

    }

    var winning=[];

    for(var j=0;j<legal.length;j++){

        if(!currentWinner ||
           cardBeats(
               legal[j],
               currentWinner.card
           )){
            winning.push(legal[j]);
        }

    }

    if(winning.length>0){

        winning.sort(function(a,b){
            return a.value-b.value;
        });

        return winning[0];

    }

    /* Kazanamıyorsa en düşük kart */

    legal.sort(function(a,b){
        return a.value-b.value;
    });

    return legal[0];

}

function aiPlay(){

    if(!gameStarted){
        return;
    }

    if(currentPlayer===0){
        return;
    }

    var player=players[currentPlayer];

    if(player.hand.length===0){
        return;
    }

    var card=chooseAI(player);

    var index=player.hand.indexOf(card);

    playCard(currentPlayer,index);

}

function startActualGame(){

    gameStarted=true;

    for(var i=0;i<4;i++){
        players[i].tricks=0;
    }

    setMessage(
        "Koz <b>"+
        trump+

    );

    currentPlayer=leader;

    updatePlayers();

    setTimeout(function(){

        if(currentPlayer===0){

            setMessage(
                "Sıra sende. İlk kartı seç."
            );

        }else{

            aiPlay();

        }

    },600);

}


/* =========================================================
   DAĞIT
========================================================= */

function dealCards(){

    dealing=true;

    var deck=shuffle(makeDeck());

    for(var i=0;i<4;i++){

        players[i].hand=[];
        players[i].tricks=0;

    }

    /*
       Daha gerçekçi dağıtım:
       52 kart sırayla oyunculara
    */

    for(var c=0;c<52;c++){

        var p=c%4;

        players[p].hand.push(deck[c]);

    }

    for(var p=0;p<4;p++){

        sortHand(players[p].hand);

    }

    renderPlayerHand();

    updatePlayers();

    updateTrickInfo();

    dealing=false;

}

/* =========================================================
   PUAN
========================================================= */

function finishRound(){

    gameStarted=false;

    var won=players[0].tricks;

    var required=playerBid || 0;

    var roundPoints=0;

    if(required>0){

        if(won>=required){

            roundPoints=required*10;

            if(won>required){
                roundPoints+=(won-required);
            }

            score+=roundPoints;

            winSound();

            document.getElementById(
                "resultScore"
            ).textContent=
                "+"+roundPoints;

            document.getElementById(
                "resultText"
            ).innerHTML=
                "Tebrikler! "+
                "<b>"+
                won+
                "</b> el aldın. "+
                "İhalen "+
                required+
                ".";

        }else{

            roundPoints=-(required*10);

            score+=roundPoints;

            badSound();

            document.getElementById(
                "resultScore"
            ).textContent=
                roundPoints;

            document.getElementById(
                "resultText"
            ).innerHTML=
                "İhaleyi tutturamadın. "+
                "<b>"+
                won+
                "</b> el aldın, "+
                "ihalen "+
                required+
                ".";

        }

    }

    totalScore+=roundPoints;

    document.getElementById(
        "score"
    ).textContent=score;

    document.getElementById(
        "result"
    ).classList.add("show");

}
