<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mina Video AI V14</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#080b12;
    color:#fff;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

.top{
    padding:18px;
    background:linear-gradient(135deg,#111827,#080b12);
    border-bottom:1px solid #263044;
}
.logo{
    font-size:27px;
    font-weight:800;
}
.logo span{color:#8b5cf6}
.sub{color:#9ca3af;margin-top:5px}

.wrap{
    max-width:1450px;
    margin:auto;
    padding:18px;
}

.panel{
    background:#111827;
    border:1px solid #263044;
    border-radius:16px;
    padding:18px;
    margin-bottom:18px;
}

h2{margin:0 0 14px}
h3{margin:0 0 10px}

textarea,input,select{
    width:100%;
    background:#080d17;
    color:#fff;
    border:1px solid #344056;
    border-radius:10px;
    padding:11px;
    outline:none;
}
textarea:focus,input:focus,select:focus{
    border-color:#8b5cf6;
}

.story{
    min-height:190px;
    resize:vertical;
}

.row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
}

.btn{
    border:0;
    border-radius:10px;
    padding:11px 15px;
    background:#273449;
    color:#fff;
}
.btn:hover{filter:brightness(1.15)}

.primary{
    background:linear-gradient(135deg,#7c3aed,#4f46e5);
}
.green{
    background:#15803d;
}
.red{
    background:#b91c1c;
}
.orange{
    background:#c2410c;
}

.controls{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px;
    margin-top:14px;
}

.scene{
    background:#0b111d;
    border:1px solid #2c3850;
    border-radius:16px;
    padding:16px;
    margin-bottom:14px;
}

.sceneHead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.sceneNumber{
    font-weight:800;
    font-size:19px;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    background:#1e293b;
    color:#cbd5e1;
    font-size:12px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.field{
    margin-bottom:10px;
}
.field label{
    display:block;
    color:#aeb9cb;
    font-size:13px;
    margin-bottom:5px;
}

.full{grid-column:1/-1}

.uploadBox{
    border:1px dashed #475569;
    padding:13px;
    border-radius:10px;
    background:#080d17;
}

.preview{
    width:100%;
    aspect-ratio:16/9;
    background:#020617;
    border-radius:12px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:8px;
}

.preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.noImage{
    color:#64748b;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
}

.prompt{
    min-height:145px;
    resize:vertical;
}

.small{
    font-size:12px;
    color:#94a3b8;
}

#previewCanvas{
    width:100%;
    max-width:900px;
    display:block;
    margin:auto;
    background:#000;
    border-radius:12px;
}

.previewArea{
    text-align:center;
}

.progressOuter{
    height:12px;
    background:#020617;
    border-radius:20px;
    overflow:hidden;
    margin-top:12px;
}

#progress{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#7c3aed,#06b6d4);
}

.status{
    margin-top:10px;
    color:#cbd5e1;
}

.sceneCount{
    max-width:140px;
}

.hidden{display:none}

.timeline{
    display:flex;
    gap:4px;
    overflow-x:auto;
    padding:8px 0;
}

.timelineItem{
    min-width:90px;
    padding:8px;
    background:#1e293b;
    border-radius:8px;
    font-size:11px;
    text-align:center;
}

@media(max-width:800px){
    .grid{grid-template-columns:1fr}
    .full{grid-column:auto}
}
</style>
</head>

<body>

<div class="top">
    <div class="wrap">
        <div class="logo">🎬 <span>Mina</span> Video AI V14</div>
        <div class="sub">
            Hareketli sahne • Sinematik kamera • Ses • Altyazı • WebM
        </div>
    </div>
</div>

<div class="wrap">

<!-- STORY -->
<div class="panel">
    <h2>📖 Hikâye</h2>

    <textarea id="story" class="story"

    <div class="row" style="margin-top:10px">
        <button class="btn" onclick="pasteStory()">📋 Panodan Al</button>

    </div>

    <div class="controls">

        <div>
            <label>Sahne Sayısı</label>
            <input id="sceneCount" class="sceneCount" type="number"

        <div>
            <label>Video Oranı</label>

            <label>FPS</label>
            <select id="fps">

        </div>

        <div>
            <label>Kalite</label>
            <select id="quality">
                <option value="6000000">Yüksek</option>
                <option value="4000000">Orta</option>

            </select>
        </div>

    </div>

    <div class="row" style="margin-top:14px">
        <button class="btn primary" onclick="analyzeStory()">
            🎬 HİKÂYEYİ ANALİZ ET
        </button>

        <button class="btn" onclick="addScene()">
            ➕ Sahne Ekle
        </button>

</div>

<!-- TIMELINE -->
<div class="panel">
    <h2>🎞️ Zaman Çizelgesi</h2>
    <div id="timeline" class="timeline"></div>
</div>

<!-- SCENES -->
<div id="scenes"></div>

<!-- EXPORT -->
<div class="panel">
    <h2>🎥 Video Önizleme</h2>

    <div class="previewArea">
        <canvas id="previewCanvas" width="1280" height="720"></canvas>
    </div>

    <div class="progressOuter">
        <div id="progress"></div>
    </div>

    <div id="status" class="status">
        Hazır.
    </div>

    <div class="row" style="margin-top:14px">
        <button class="btn" onclick="previewVideo()">▶️ Önizle</button>
        <button class="btn red" onclick="stopVideo()">⏹ Durdur</button>
        <button class="btn primary" onclick="renderVideo()">🎬 VİDEOYU OLUŞTUR</button>
    </div>

    <video id="resultVideo"
           controls
           style="width:100%;margin-top:15px;border-radius:12px;display:none">
    </video>

    <a id="downloadBtn"
       class="btn green hidden"
       style="display:inline-block;margin-top:10px;text-decoration:none"
       download="mina-video-ai-v14.webm">
       ⬇️ VİDEOYU İNDİR
    </a>
</div>

</div>

<script>
"use strict";

/* =========================================================
   MINA VIDEO AI V14
   ========================================================= */

let scenes=[];
let imageURLs=[];
let audioBuffers=[];
let animationId=null;
let stopRequested=false;
let previewMode=false;

/* ---------------------------------------------------------
   HELPERS
--------------------------------------------------------- */

const $ = id => document.getElementById(id);

function uid(){
    return Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function escapeHTML(str){
    return String(str||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function splitSentences(text){
    return text
        .replace(/\r/g,"")
        .split(/(?<=[.!?…])\s+|\n+/)
        .map(x=>x.trim())
        .filter(Boolean);
}

function setStatus(text){
    $("status").textContent=text;
}

/* ---------------------------------------------------------
   STORY
--------------------------------------------------------- */

async function pasteStory(){
    try{
        const text=await navigator.clipboard.readText();
        $("story").value=text;
    }catch(e){
        alert("Panoya erişilemedi. Metni normal şekilde yapıştırabilirsin.");
    }
}

function loadExample(){
    $("story").value=
`Stell dir vor, du bist 65 Jahre alt.

Du hast fast alles verloren.

Dein Restaurant ist weg.

Dein Einkommen ist verschwunden.

Und viele Menschen würden jetzt sagen:

Es ist zu spät.

Doch ein Mann dachte anders.

Sein Name war Harland Sanders.

Er hatte viele schwierige Jahre hinter sich.

Er hatte verschiedene Jobs.

Er hatte ein Restaurant geführt.

Er hatte Erfolge erlebt.

Aber auch schwere Rückschläge.

Dann verlor sein Restaurant einen großen Teil seiner Kunden.

Plötzlich musste Sanders wieder von vorne anfangen.

Doch er hatte noch eine Idee.

Sein Rezept für gebratenes Hähnchen.

Er glaubte fest daran, dass dieses Rezept etwas Besonderes war.

Also setzte er sich in sein Auto.

Er begann, von Restaurant zu Restaurant zu fahren.

Er wollte anderen Restaurantbesitzern sein Rezept anbieten.

Doch die ersten Antworten waren nicht das, was er gehofft hatte.

Nein.

Noch ein Nein.

Und wieder ein Nein.

Viele Menschen hätten an diesem Punkt aufgegeben.

Aber Sanders machte weiter.

Er fuhr zur nächsten Adresse.

Er klopfte an die nächste Tür.

Und er stellte sein Rezept wieder vor.

Immer wieder.

Ablehnung für Ablehnung.

Doch irgendwann kam ein Ja.

Ein Restaurantbesitzer gab ihm eine Chance.

Das Hähnchen wurde verkauft.

Die Kunden mochten es.

Andere Restaurants wurden aufmerksam.

Und plötzlich begann sich etwas zu verändern.

Aus einer kleinen Idee entstand ein wachsendes Geschäft.

Sanders wurde immer bekannter.

Aus Harland Sanders wurde Colonel Sanders.

Und sein Rezept wurde schließlich mit Kentucky Fried Chicken verbunden.

Doch diese Geschichte handelt nicht nur von Hähnchen.

Sie handelt von einem Menschen, der sich weigerte aufzugeben.

Es ist niemals zu spät, neu anzufangen.`;
}

function clearAll(){
    scenes=[];
    imageURLs.forEach(x=>URL.revokeObjectURL(x));
    imageURLs=[];
    audioBuffers=[];
    $("story").value="";
    renderScenes();
}

/* ---------------------------------------------------------
   STORY ANALYSIS
--------------------------------------------------------- */

function analyzeStory(){

    const text=$("story").value.trim();

    if(!text){
        alert("Önce hikâyeyi gir.");
        return;
    }

    const sentences=splitSentences(text);

    let wanted=parseInt($("sceneCount").value)||8;
    wanted=Math.max(1,Math.min(200,wanted));

    const groups=[];
    const size=Math.ceil(sentences.length/wanted);

    for(let i=0;i<sentences.length;i+=size){
        groups.push(sentences.slice(i,i+size).join(" "));
    }

    scenes=groups.map((text,i)=>createScene(text,i));

    renderScenes();

    setStatus(
        scenes.length+
        " sahne oluşturuldu. Şimdi her sahneye görsel ve ses ekleyebilirsin."
    );
}

/* ---------------------------------------------------------
   CREATE SCENE
--------------------------------------------------------- */

function createScene(text,index){

    return {
        id:uid(),
        text:text,
        subtitle:text,
        prompt:generatePrompt(text,index),
        motion:"cinematic",
        camera:"push",
        atmosphere:"dust",
        transition:"fade",
        image:null,
        audio:null,
        audioDuration:0,
        zoom:1,
        panX:0,
        panY:0
    };
}

/* ---------------------------------------------------------
   PROMPT ENGINE
--------------------------------------------------------- */

function generatePrompt(text,index){

    const t=text.toLowerCase();

    let subject="cinematic realistic human scene";
    let environment="realistic historical environment";

    if(
        t.includes("restaurant") ||
        t.includes("küche") ||
        t.includes("hähnchen")
    ){
        subject=
        "elderly restaurant owner working in an old American roadside restaurant";
        environment=
        "1950s American roadside restaurant, vintage kitchen, wooden tables, old cooking equipment";
    }

    if(
        t.includes("auto") ||
        t.includes("fahren") ||
        t.includes("car")
    ){
        subject=
        "elderly man driving an old American car through rural America";
        environment=
        "1950s rural American road, countryside, vintage vehicles";
    }

    if(
        t.includes("tür") ||
        t.includes("restaurantbesitzer") ||
        t.includes("adresse")
    ){
        subject=
        "elderly man knocking on the door of a small American restaurant";
        environment=
        "small roadside restaurant in rural America";
    }

    return `
Cinematic photorealistic movie scene.

${subject}.

Story context:
${text}

Environment:
${environment}.

Realistic human anatomy, realistic facial expressions, realistic skin texture,
natural clothing, historical authenticity, detailed environment.

Dramatic cinematic lighting, volumetric light, atmospheric depth,
subtle film grain, realistic shadows, shallow depth of field,
35mm cinema lens, professional cinematography,
photorealistic, emotional storytelling, 4K movie still.

Camera composition should clearly communicate the story.

No text, no subtitles, no logo, no watermark.
`.trim();
}

/* ---------------------------------------------------------
   SCENE RENDER UI
--------------------------------------------------------- */

function renderScenes(){

    const container=$("scenes");
    container.innerHTML="";

    scenes.forEach((scene,index)=>{

        const div=document.createElement("div");
        div.className="scene";

        div.innerHTML=`
        <div class="sceneHead">
            <div>
                <span class="sceneNumber">🎬 SAHNE ${index+1}</span>
                <span class="badge" id="badge-${scene.id}">
                    ${scene.audio?"SES VAR":"SES BEKLENİYOR"}
                </span>
            </div>

            <div class="actions">
                <button class="btn" onclick="moveScene(${index},-1)">⬆️</button>
                <button class="btn" onclick="moveScene(${index},1)">⬇️</button>
                <button class="btn" onclick="duplicateScene(${index})">📑</button>
                <button class="btn red" onclick="deleteScene(${index})">🗑️</button>
            </div>
        </div>

        <div class="grid">

            <div class="field full">
                <label>📝 Sahne Metni</label>
                <textarea
                    id="text-${scene.id}"
                    oninput="updateSceneText('${scene.id}',this.value)"
                >${escapeHTML(scene.text)}</textarea>
            </div>

            <div class="field">
                <label>📝 Altyazı</label>
                <textarea
                    id="sub-${scene.id}"
                    oninput="updateScene('${scene.id}','subtitle',this.value)"
                >${escapeHTML(scene.subtitle)}</textarea>
            </div>

            <div class="field">
                <label>🎨 Sinematik Görsel Prompt</label>
                <textarea
                    class="prompt"
                    id="prompt-${scene.id}"
                    oninput="updateScene('${scene.id}','prompt',this.value)"
                >${escapeHTML(scene.prompt)}</textarea>
            </div>

            <div class="field">
                <label>🎥 Karakter Hareketi</label>
                <select onchange="updateScene('${scene.id}','motion',this.value)">
                    <option value="cinematic" ${scene.motion==="cinematic"?"selected":""}>
                        🎬 Doğal Sinematik
                    </option>
                    <option value="walk" ${scene.motion==="walk"?"selected":""}>
                        🚶 Yürüme
                    </option>
                    <option value="look" ${scene.motion==="look"?"selected":""}>
                        👀 Başını Çevirme
                    </option>
                    <option value="talk" ${scene.motion==="talk"?"selected":""}>
                        🗣️ Konuşma
                    </option>
                    <option value="work" ${scene.motion==="work"?"selected":""}>
                        👨‍🍳 Çalışma
                    </option>
                    <option value="dramatic" ${scene.motion==="dramatic"?"selected":""}>
                        ⚡ Dramatik
                    </option>
                </select>
            </div>

            <div class="field">
                <label>📷 Kamera Hareketi</label>
                <select onchange="updateScene('${scene.id}','camera',this.value)">
                    <option value="push" ${scene.camera==="push"?"selected":""}>
                        🔍 Yavaş Yaklaşma
                    </option>
                    <option value="pull" ${scene.camera==="pull"?"selected":""}>
                        🔎 Uzaklaşma
                    </option>
                    <option value="left" ${scene.camera==="left"?"selected":""}>
                        ⬅️ Pan Sol
                    </option>
                    <option value="right" ${scene.camera==="right"?"selected":""}>
                        ➡️ Pan Sağ
                    </option>
                    <option value="up" ${scene.camera==="up"?"selected":""}>
                        ⬆️ Pan Yukarı
                    </option>
                    <option value="down" ${scene.camera==="down"?"selected":""}>
                        ⬇️ Pan Aşağı
                    </option>
                    <option value="orbit" ${scene.camera==="orbit"?"selected":""}>
                        🔄 Sinematik Orbit
                    </option>
                </select>
            </div>

            <div class="field">
                <label>🌫️ Ortam Hareketi</label>
                <select onchange="updateScene('${scene.id}','atmosphere',this.value)">
                    <option value="none">Yok</option>
                    <option value="dust">Toz</option>
                    <option value="rain">Yağmur</option>
                    <option value="snow">Kar</option>
                    <option value="fire">Ateş</option>
                    <option value="fog">Sis</option>
                </select>
            </div>

            <div class="field">
                <label>🔄 Sahne Geçişi</label>
                <select onchange="updateScene('${scene.id}','transition',this.value)">
                    <option value="fade">Fade</option>
                    <option value="cut">Kesme</option>
                    <option value="black">Siyah Geçiş</option>
                </select>
            </div>

            <div class="field">
                <label>🖼️ Görsel</label>
                <div class="uploadBox">
                    <input type="file"
                           accept="image/*"
                           onchange="loadImage(event,'${scene.id}')">

                    <div class="preview" id="preview-${scene.id}">
                        ${
                            scene.image
                            ?
                            `<img src="${scene.image}" alt="">`
                            :
                            `<div class="noImage">Görsel yüklenmedi</div>`
                        }
                    </div>
                </div>
            </div>

            <div class="field">
                <label>🎙️ Ses</label>
                <div class="uploadBox">
                    <input type="file"
                           accept="audio/*"
                           onchange="loadAudio(event,'${scene.id}')">

                    <div class="small" id="audioInfo-${scene.id}">
                        ${
                            scene.audio
                            ?
                            "Ses yüklendi • "+scene.audioDuration.toFixed(2)+" sn"
                            :
                            "Ses dosyası yüklenmedi"
                        }
                    </div>
                </div>
            </div>

        </div>

        <div class="actions">
            <button class="btn primary"
                    onclick="regeneratePrompt(${index})">
                ✨ Prompt Yenile
            </button>

            <button class="btn"
                    onclick="copyPrompt(${index})">
                📋 Prompt Kopyala
            </button>

            <button class="btn"
                    onclick="previewScene(${index})">
                ▶️ Sahneyi Oynat
            </button>

            <button class="btn"
                    onclick="addSceneAfter(${index})">
                ➕ Sonrasına Sahne
            </button>
        </div>

        <div class="small" style="margin-top:9px">
            ${scene.audio
                ? "⏱️ Süre: "+scene.audioDuration.toFixed(2)+" saniye"
                : "⏱️ Süre: Ses dosyasından belirlenecek"}
        </div>
        `;

        container.appendChild(div);
    });

    updateTimeline();
}

/* ---------------------------------------------------------
   UPDATE
--------------------------------------------------------- */

function updateScene(id,key,value){
    const s=scenes.find(x=>x.id===id);
    if(s)s[key]=value;
}

function updateSceneText(id,value){
    const s=scenes.find(x=>x.id===id);
    if(s){
        s.text=value;
        s.subtitle=value;
        const sub=$("sub-"+id);
        if(sub)sub.value=value;
    }
}

function regeneratePrompt(index){
    scenes[index].prompt=
        generatePrompt(scenes[index].text,index);

    renderScenes();
}

async function copyPrompt(index){
    try{
        await navigator.clipboard.writeText(scenes[index].prompt);
        setStatus("Prompt panoya kopyalandı.");
    }catch(e){
        alert("Kopyalanamadı.");
    }
}

/* ---------------------------------------------------------
   IMAGE
--------------------------------------------------------- */

function loadImage(event,id){

    const file=event.target.files[0];
    if(!file)return;

    const s=scenes.find(x=>x.id===id);
    if(!s)return;

    if(s.image){
        try{URL.revokeObjectURL(s.image)}catch(e){}
    }

    s.image=URL.createObjectURL(file);
    imageURLs.push(s.image);

    renderScenes();
}

/* ---------------------------------------------------------
   AUDIO
--------------------------------------------------------- */

async function loadAudio(event,id){

    const file=event.target.files[0];
    if(!file)return;

    const s=scenes.find(x=>x.id===id);
    if(!s)return;

    s.audio=file;

    try{

        const array=await file.arrayBuffer();

        const ctx=new AudioContext();

        const buffer=await ctx.decodeAudioData(array.slice(0));

        s.audioDuration=buffer.duration;

        await ctx.close();

        setStatus(
            "Sahne sesi yüklendi: "+
            s.audioDuration.toFixed(2)+" saniye."
        );

        renderScenes();

    }catch(e){

        console.error(e);
        alert("Ses dosyası okunamadı.");

    }
}

/* ---------------------------------------------------------
   SCENE MANAGEMENT
--------------------------------------------------------- */

function addScene(){

    const index=scenes.length;

    scenes.push(
        createScene(
            "Yeni sahne...",
            index
        )
    );

    renderScenes();
}

function addSceneAfter(index){

    scenes.splice(
        index+1,
        0,
        createScene(
            "Yeni sahne...",
            index+1
        )
    );

    renderScenes();
}

function duplicateScene(index){

    const original=scenes[index];

    const copy={
        ...original,
        id:uid()
    };

    scenes.splice(index+1,0,copy);

    renderScenes();
}

function deleteScene(index){

    if(scenes.length<=1){
        alert("En az bir sahne kalmalı.");
        return;
    }

    scenes.splice(index,1);
    renderScenes();
}

function moveScene(index,direction){

    const target=index+direction;

    if(target<0||target>=scenes.length)return;

    const temp=scenes[index];
    scenes[index]=scenes[target];
    scenes[target]=temp;

    renderScenes();
}

/* ---------------------------------------------------------
   TIMELINE
--------------------------------------------------------- */

function updateTimeline(){

    const t=$("timeline");

    t.innerHTML="";

    scenes.forEach((s,i)=>{

        const div=document.createElement("div");

        div.className="timelineItem";

        div.innerHTML=`
            <b>SAHNE ${i+1}</b><br>
            ${
                s.audio
                ?
                s.audioDuration.toFixed(1)+" sn"
                :
                "ses yok"
            }
        `;

        t.appendChild(div);
    });
}

/* ---------------------------------------------------------
   CANVAS
--------------------------------------------------------- */

function setCanvasSize(){

    const canvas=$("previewCanvas");

    const ratio=$("ratio").value;

    if(ratio==="16:9"){
        canvas.width=1280;
        canvas.height=720;
    }

    if(ratio==="9:16"){
        canvas.width=720;
        canvas.height=1280;
    }

    if(ratio==="1:1"){
        canvas.width=900;
        canvas.height=900;
    }
}

function drawImageCover(ctx,img,w,h,progress,scene){

    const iw=img.naturalWidth||img.width;
    const ih=img.naturalHeight||img.height;

    const scale=Math.max(w/iw,h/ih);

    let zoom=1;

    if(scene.camera==="push"){
        zoom=1+progress*0.13;
    }

    if(scene.camera==="pull"){
        zoom=1.13-progress*0.13;
    }

    if(scene.camera==="orbit"){
        zoom=1.05;
    }

    const sw=iw*scale*zoom;
    const sh=ih*scale*zoom;

    let x=(w-sw)/2;
    let y=(h-sh)/2;

    if(scene.camera==="left"){
        x=(w-sw)*progress;
    }

    if(scene.camera==="right"){
        x=(w-sw)*(1-progress);
    }

    if(scene.camera==="up"){
        y=(h-sh)*progress;
    }

    if(scene.camera==="down"){
        y=(h-sh)*(1-progress);
    }

    if(scene.camera==="orbit"){
        x+=(Math.sin(progress*Math.PI*2)*20);
    }

    ctx.drawImage(img,x,y,sw,sh);
}

/* ---------------------------------------------------------
   ATMOSPHERE
--------------------------------------------------------- */

function drawAtmosphere(ctx,w,h,scene,time){

    const type=scene.atmosphere;

    if(type==="none")return;

    if(type==="dust"){

        ctx.save();

        for(let i=0;i<45;i++){

            const x=(i*97+(time*0.025*(i%3+1)))%w;
            const y=(i*53+(time*0.012*(i%4+1)))%h;

            const r=1+(i%3);

            ctx.globalAlpha=.18;

            ctx.fillStyle="#fff";

            ctx.beginPath();
            ctx.arc(x,y,r,0,Math.PI*2);
            ctx.fill();
        }

        ctx.restore();
    }

    if(type==="rain"){

        ctx.save();

        ctx.strokeStyle="rgba(190,220,255,.35)";
        ctx.lineWidth=1;

        for(let i=0;i<120;i++){

            let x=(i*47+time*.5)%w;
            let y=(i*83+time*1.1)%h;

            ctx.beginPath();
            ctx.moveTo(x,y);
            ctx.lineTo(x-7,y+22);
            ctx.stroke();
        }

        ctx.restore();
    }

    if(type==="snow"){

        ctx.save();

        ctx.fillStyle="rgba(255,255,255,.75)";

        for(let i=0;i<80;i++){

            const x=(i*73+time*.03)%w;
            const y=(i*41+time*.04)%h;

            ctx.beginPath();
            ctx.arc(x,y,2+(i%3),0,Math.PI*2);
            ctx.fill();
        }

        ctx.restore();
    }

    if(type==="fog"){

        ctx.save();

        const g=ctx.createLinearGradient(0,h*.5,w,h);

        g.addColorStop(0,"rgba(255,255,255,0)");
        g.addColorStop(.5,"rgba(220,230,240,.12)");
        g.addColorStop(1,"rgba(220,230,240,.25)");

        ctx.fillStyle=g;
        ctx.fillRect(0,0,w,h);

        ctx.restore();
    }

    if(type==="fire"){

        ctx.save();

        for(let i=0;i<25;i++){

            const x=(i*79)%w;
            const y=h*.75-(Math.sin(time*.006+i)*20);

            ctx.globalAlpha=.12;

            ctx.fillStyle="#ffb000";

            ctx.beginPath();
            ctx.arc(x,y,20+(i%10),0,Math.PI*2);
            ctx.fill();
        }

        ctx.restore();
    }
}

/* ---------------------------------------------------------
   MOTION
--------------------------------------------------------- */

function drawCharacterMotion(ctx,w,h,scene,progress){

    if(scene.motion==="none")return;

    /*
       Bu bölüm gerçek AI karakter üretimi değildir.
       Canvas üzerinde sahnenin sinematik hareket hissini
       güçlendiren katmandır.
    */

    if(scene.motion==="dramatic"){

        const alpha=.08+Math.sin(progress*Math.PI)*.08;

        ctx.fillStyle=`rgba(0,0,0,${alpha})`;
        ctx.fillRect(0,0,w,h);

    }

    if(scene.motion==="walk"){

        const shift=Math.sin(progress*Math.PI*8)*3;

        ctx.translate(shift,0);
    }

    if(scene.motion==="look"){

        const shift=Math.sin(progress*Math.PI*2)*4;

        ctx.translate(shift,0);
    }

    if(scene.motion==="talk"){

        const pulse=1+Math.sin(progress*Math.PI*16)*.003;

        ctx.translate(w/2,h/2);
        ctx.scale(pulse,pulse);
        ctx.translate(-w/2,-h/2);
    }

    if(scene.motion==="work"){

        const shift=Math.sin(progress*Math.PI*6)*2;

        ctx.translate(shift,0);
    }
}

/* ---------------------------------------------------------
   SUBTITLE
--------------------------------------------------------- */

function drawSubtitle(ctx,w,h,text,progress){

    if(!text)return;

    ctx.save();

    const maxWidth=w*.84;

    ctx.font=
        Math.max(22,Math.round(w*.032))+
        "px Arial";

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    const words=text.split(/\s+/);

    const lines=[];
    let line="";

    for(const word of words){

        const test=line?line+" "+word:word;

        if(ctx.measureText(test).width>maxWidth){

            lines.push(line);
            line=word;

        }else{
            line=test;
        }
    }

    if(line)lines.push(line);

    const lineHeight=parseInt(ctx.font)*1.3;

    const boxH=lines.length*lineHeight+28;

    const y=h*.82;

    ctx.fillStyle="rgba(0,0,0,.66)";

    roundRect(
        ctx,
        w/2-maxWidth/2-15,
        y-boxH/2,
        maxWidth+30,
        boxH,
        14
    );

    ctx.fill();

    ctx.fillStyle="#fff";

    lines.forEach((line,i)=>{

        ctx.fillText(
            line,
            w/2,
            y-(lines.length-1)*lineHeight/2+i*lineHeight
        );
    });

    ctx.restore();
}

function roundRect(ctx,x,y,w,h,r){

    ctx.beginPath();

    ctx.moveTo(x+r,y);

    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);

    ctx.closePath();
}

/* ---------------------------------------------------------
   DRAW FRAME
--------------------------------------------------------- */

async function loadHTMLImage(url){

    return new Promise((resolve,reject)=>{

        const img=new Image();

        img.onload=()=>resolve(img);
        img.onerror=reject;

        img.src=url;
    });
}

async function drawFrame(scene,elapsed){

    const canvas=$("previewCanvas");
    const ctx=canvas.getContext("2d");

    const w=canvas.width;
    const h=canvas.height;

    ctx.clearRect(0,0,w,h);

    ctx.fillStyle="#020617";
    ctx.fillRect(0,0,w,h);

    if(scene.image){

        try{

            const img=await loadHTMLImage(scene.image);

            const duration=Math.max(scene.audioDuration||5,0.1);

            const progress=Math.min(
                1,
                Math.max(0,elapsed/duration)
            );

            ctx.save();

            drawCharacterMotion(
                ctx,
                w,
                h,
                scene,
                progress
            );

            drawImageCover(
                ctx,
                img,
                w,
                h,
                progress,
                scene
            );

            ctx.restore();

            drawAtmosphere(
                ctx,
                w,
                h,
                scene,
                performance.now()
            );

            drawSubtitle(
                ctx,
                w,
                h,
                scene.subtitle,
                progress
            );

        }catch(e){

            drawPlaceholder(ctx,w,h,"Görsel okunamadı");

        }

    }else{

        drawPlaceholder(
            ctx,
            w,
            h,
            "SAHNE "+(scenes.indexOf(scene)+1)+"\nGÖRSEL BEKLENİYOR"
        );

        drawSubtitle(
            ctx,
            w,
            h,
            scene.subtitle,
            0
        );
    }
}

function drawPlaceholder(ctx,w,h,text){

    ctx.fillStyle="#111827";
    ctx.fillRect(0,0,w,h);

    ctx.fillStyle="#475569";
    ctx.font=Math.max(20,w*.03)+"px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
        text,
        w/2,
        h/2
    );
}

/* ---------------------------------------------------------
   AUDIO
--------------------------------------------------------- */

async function decodeAudio(file,ctx){

    const data=await file.arrayBuffer();

    return await ctx.decodeAudioData(
        data.slice(0)
    );
}

/* ---------------------------------------------------------
   VALIDATION
--------------------------------------------------------- */

function validateScenes(){

    if(!scenes.length){
        alert("Önce sahne oluştur.");
        return false;
    }

    const missingImage=[];
    const missingAudio=[];

    scenes.forEach((s,i)=>{

        if(!s.image)
            missingImage.push(i+1);

        if(!s.audio)
            missingAudio.push(i+1);
    });

    if(missingImage.length){

        alert(
            "Görsel olmayan sahneler:\n"+
            missingImage.join(", ")
        );

        return false;
    }

    if(missingAudio.length){

        alert(
            "Ses olmayan sahneler:\n"+
            missingAudio.join(", ")
        );

        return false;
    }

    return true;
}

/* ---------------------------------------------------------
   TOTAL DURATION
--------------------------------------------------------- */

function totalDuration(){

    return scenes.reduce(
        (sum,s)=>sum+(s.audioDuration||0),
        0
    );
}

/* ---------------------------------------------------------
   AUDIO PRELOAD
--------------------------------------------------------- */

async function preloadAudio(){

    const ctx=new AudioContext();

    audioBuffers=[];

    for(let i=0;i<scenes.length;i++){

        setStatus(
            "Ses hazırlanıyor... "+
            (i+1)+"/"+scenes.length
        );

        audioBuffers[i]=await decodeAudio(
            scenes[i].audio,
            ctx
        );
    }

    return ctx;
}

/* ---------------------------------------------------------
   PREVIEW
--------------------------------------------------------- */

async function previewVideo(){

    if(!validateScenes())return;

    stopRequested=false;
    previewMode=true;

    setCanvasSize();

    const start=performance.now();

    const total=totalDuration();

    async function loop(){

        if(stopRequested){
            previewMode=false;
            return;
        }

        const elapsed=(performance.now()-start)/1000;

        if(elapsed>=total){

            previewMode=false;
            setStatus("Önizleme tamamlandı.");
            return;
        }

        let accumulated=0;
        let current=0;

        for(let i=0;i<scenes.length;i++){

            if(
                elapsed>=accumulated &&
                elapsed<
                accumulated+scenes[i].audioDuration
            ){

                current=i;
                break;
            }

            accumulated+=scenes[i].audioDuration;
        }

        const sceneElapsed=
            elapsed-accumulated;

        await drawFrame(
            scenes[current],
            sceneElapsed
        );

        $("progress").style.width=
            ((elapsed/total)*100)+"%";

        setStatus(
            "Önizleme • Sahne "+
            (current+1)+"/"+scenes.length+
            " • "+
            sceneElapsed.toFixed(1)+
            " sn"
        );

        animationId=requestAnimationFrame(loop);
    }

    loop();
}

function stopVideo(){

    stopRequested=true;

    if(animationId)
        cancelAnimationFrame(animationId);

    setStatus("Durduruldu.");
}

/* ---------------------------------------------------------
   RENDER VIDEO
--------------------------------------------------------- */

async function renderVideo(){

    if(!validateScenes())return;

    if(!window.MediaRecorder){
        alert("Bu tarayıcı MediaRecorder desteklemiyor.");
        return;
    }

    stopRequested=false;
    previewMode=false;

    setCanvasSize();

    $("resultVideo").style.display="none";
    $("downloadBtn").classList.add("hidden");

    const canvas=$("previewCanvas");

    const fps=parseInt($("fps").value);
    const bitrate=parseInt($("quality").value);

    const stream=canvas.captureStream(fps);

    let audioContext=null;
    let audioDestination=null;

    try{

        audioContext=new AudioContext();

        audioDestination=
            audioContext.createMediaStreamDestination();

        const buffers=[];

        for(let i=0;i<scenes.length;i++){

            setStatus(
                "Ses hazırlanıyor "+
                (i+1)+"/"+scenes.length
            );

            buffers[i]=await decodeAudio(
                scenes[i].audio,
                audioContext
            );
        }

        const finalStream=
            new MediaStream([
                ...stream.getVideoTracks(),
                ...audioDestination.stream.getAudioTracks()
            ]);

        let mime="video/webm;codecs=vp9,opus";

        if(!MediaRecorder.isTypeSupported(mime))
            mime="video/webm;codecs=vp8,opus";

        if(!MediaRecorder.isTypeSupported(mime))
            mime="video/webm";

        const recorder=new MediaRecorder(
            finalStream,
            {
                mimeType:mime,
                videoBitsPerSecond:bitrate
            }
        );

        const chunks=[];

        recorder.ondataavailable=e=>{

            if(e.data&&e.data.size)
                chunks.push(e.data);
        };

        const finished=new Promise(resolve=>{

            recorder.onstop=resolve;

        });

        recorder.start(250);

        /*
          Sesleri ardışık şekilde schedule ediyoruz.
          Böylece video timeline ile aynı süreyi kullanıyor.
        */

        let audioTime=
            audioContext.currentTime+0.15;

        buffers.forEach(buffer=>{

            const source=
                audioContext.createBufferSource();

            source.buffer=buffer;

            source.connect(audioDestination);

            source.start(audioTime);

            audioTime+=buffer.duration;
        });

        const total=totalDuration();

        const start=performance.now();

        async function renderLoop(){

            if(stopRequested){

                try{recorder.stop()}catch(e){}
                return;
            }

            const elapsed=
                (performance.now()-start)/1000;

            if(elapsed>=total){

                await drawFrame(
                    scenes[scenes.length-1],
                    scenes[scenes.length-1].audioDuration
                );

                setTimeout(()=>{

                    try{
                        recorder.stop();
                    }catch(e){}

                },300);

                return;
            }

            let accumulated=0;
            let current=0;

            for(let i=0;i<scenes.length;i++){

                if(
                    elapsed>=accumulated &&
                    elapsed<
                    accumulated+scenes[i].audioDuration
                ){

                    current=i;
                    break;
                }

                accumulated+=scenes[i].audioDuration;
            }

            const sceneElapsed=
                elapsed-accumulated;

            await drawFrame(
                scenes[current],
                sceneElapsed
            );

            $("progress").style.width=
                ((elapsed/total)*100)+"%";

            setStatus(
                "Video oluşturuluyor • "+
                "Sahne "+(current+1)+"/"+scenes.length+
                " • "+
                elapsed.toFixed(1)+
                " / "+
                total.toFixed(1)+" sn"
            );

            requestAnimationFrame(renderLoop);
        }

        await renderLoop();

        await finished;

        const blob=new Blob(
            chunks,
            {type:mime}
        );

        const url=
            URL.createObjectURL(blob);

        const video=$("resultVideo");

        video.src=url;
        video.style.display="block";

        const download=$("downloadBtn");

        download.href=url;
        download.classList.remove("hidden");

        setStatus(
            "✅ Video hazır! "+
            total.toFixed(1)+" saniye."
        );

    }catch(e){

        console.error(e);

        alert(
            "Video oluşturulurken hata oluştu:\n"+
            e.message
        );

        setStatus("Hata oluştu.");

    }finally{

        if(audioContext){

            try{
                await audioContext.close();
            }catch(e){}
        }
    }
}

/* ---------------------------------------------------------
   SCENE PREVIEW
--------------------------------------------------------- */

async function previewScene(index){

    const scene=scenes[index];

    if(!scene)return;

    stopRequested=false;

    setCanvasSize();

    const duration=
        scene.audioDuration||5;

    const start=performance.now();

    async function loop(){

        if(stopRequested)return;

        const elapsed=
            (performance.now()-start)/1000;

        if(elapsed>=duration){

            setStatus(
                "Sahne önizlemesi tamamlandı."
            );

            return;
        }

        await drawFrame(
            scene,
            elapsed
        );

        $("progress").style.width=
            ((elapsed/duration)*100)+"%";

        setStatus(
            "Sahne "+(index+1)+
            " oynatılıyor • "+
            elapsed.toFixed(1)+" sn"
        );

        animationId=
            requestAnimationFrame(loop);
    }

    loop();
}
