<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#041009">
<title>Batak Royale</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020806;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

button{
  font:inherit;
  color:white;
  border:0;
  cursor:pointer;
}

/* ANA */

#game{
  position:relative;
  width:100%;
  height:100%;
  min-height:620px;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%,rgba(31,117,65,.34),transparent 42%),
    linear-gradient(145deg,#06170d,#031009 65%,#020805);
}

/* ÜST BAR */

.topBar{
  position:absolute;
  z-index:300;
  top:6px;
  left:50%;
  transform:translateX(-50%);
  width:min(760px,96vw);
  height:45px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:5px 9px;
  border-radius:15px;
  background:rgba(3,15,9,.9);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 7px 22px rgba(0,0,0,.4);
  backdrop-filter:blur(8px);
}

.logo{
  font-size:17px;
  font-weight:1000;
  letter-spacing:1px;
}

.logo span{
  color:#e5c15e;
}

.topActions{
  display:flex;
  gap:5px;
}

.iconBtn{
  width:34px;
  height:32px;
  border-radius:10px;
  background:#102b1b;
  border:1px solid rgba(255,255,255,.1);
  font-size:15px;
}

.iconBtn:active{
  transform:scale(.92);
}

/* SKOR */

.teamBox{
  position:absolute;
  z-index:250;
  top:56px;
  width:165px;
  padding:6px 9px;
  border-radius:13px;
  background:rgba(3,17,9,.9);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 6px 18px rgba(0,0,0,.3);
}

.teamBox.left{
  left:7px;
}

.teamBox.right{
  right:7px;
}

.teamName{
  font-size:9px;
  color:#aec6b5;
  font-weight:900;
}

.teamScore{
  font-size:18px;
  font-weight:1000;
  margin-top:1px;
}

.teamDetail{
  color:#78917f;
  font-size:8px;
  margin-top:1px;
}

/* MASA */

.table{
  position:absolute;
  left:50%;
  top:52%;
  transform:translate(-50%,-50%);
  width:min(670px,86vw);
  height:min(420px,48vh);
  border-radius:50%;
  border:9px solid #3d2716;
  background:
    radial-gradient(ellipse at center,#17643b 0%,#0d4b2b 48%,#08351f 100%);
  box-shadow:
    0 25px 60px rgba(0,0,0,.6),
    inset 0 0 70px rgba(0,0,0,.3);
}

.table:before{
  content:"";
  position:absolute;
  inset:12px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.09);
}

.table:after{
  content:"BATAK ROYALE";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:rgba(255,255,255,.07);
  font-size:11px;
  font-weight:1000;
  letter-spacing:3px;
}

/* OYUNCU İSİMLERİ */

.playerLabel{
  position:absolute;
  z-index:240;
  padding:5px 10px;
  border-radius:999px;
  background:rgba(2,11,6,.9);
  border:1px solid rgba(255,255,255,.12);
  font-size:10px;
  font-weight:1000;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
}

.pTop{
  top:8px;
  left:50%;
  transform:translateX(-50%);
}

.pLeft{
  left:-3px;
  top:50%;
  transform:translateY(-50%);
}

.pRight{
  right:-3px;
  top:50%;
  transform:translateY(-50%);
}

/* MEHMET'İN BÜYÜK AÇIK ELİ */

#partnerPanel{
  position:absolute;
  z-index:230;
  left:50%;
  top:102px;
  transform:translateX(-50%);
  width:min(560px,94vw);
  height:156px;
  padding:5px 6px 6px;
  border-radius:17px;
  background:rgba(2,14,8,.86);
  border:1px solid rgba(255,255,255,.11);
  box-shadow:0 8px 25px rgba(0,0,0,.35);
}

.partnerTitle{
  height:18px;
  text-align:center;
  color:#e5c15e;
  font-size:10px;
  font-weight:1000;
  letter-spacing:.4px;
}

.partnerRows{
  position:relative;
  width:100%;
  height:126px;
}

.partnerRow{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

#partnerTop{
  top:0;
}

#partnerBottom{
  top:63px;
}

.partnerCard{
  position:relative;
  width:61px;
  height:88px;
  flex:0 0 61px;
  margin-left:-10px;
  border-radius:7px;
  background:
    linear-gradient(135deg,rgba(255,255,255,.5),transparent 25%),
    repeating-linear-gradient(0deg,rgba(80,65,40,.025) 0 1px,transparent 1px 3px),
    #f3ecd9;
  border:1px solid #a89d87;
  color:#161616;
  box-shadow:
    0 5px 10px rgba(0,0,0,.4),
    inset 0 0 0 2px rgba(255,255,255,.65);
  overflow:hidden;
}

.partnerCard:first-child{
  margin-left:0;
}

.partnerCard.red{
  color:#bd1d25;
}

.partnerCard:before{
  content:"";
  position:absolute;
  inset:4px;
  border:1px solid rgba(89,76,55,.24);
  border-radius:5px;
}

.partnerCard .corner{
  position:absolute;
  z-index:2;
  top:4px;
  left:5px;
  display:flex;
  flex-direction:column;
  align-items:center;
  line-height:10px;
  font-weight:1000;
}

.partnerCard .corner.bottom{
  top:auto;
  left:auto;
  right:5px;
  bottom:4px;
  transform:rotate(180deg);
}

.partnerCard .rank{
  font-size:12px;
}

.partnerCard .smallSuit{
  font-size:11px;
}

.partnerCard .centerSuit{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:29px;
  font-weight:900;
}

/* BİLGİ */

.infoPanel{
  position:absolute;
  z-index:215;
  left:50%;
  top:calc(50% + 105px);
  transform:translateX(-50%);
  min-width:170px;
  padding:6px 10px;
  border-radius:11px;
  background:rgba(3,18,10,.78);
  border:1px solid rgba(255,255,255,.08);
  text-align:center;
}

#roundInfo{
  color:#a5baa9;
  font-size:9px;
}

#trumpInfo{
  margin-top:2px;
  color:#e5c15e;
  font-size:13px;
  font-weight:1000;
}

/* OYNANAN KARTLAR */

.playArea{
  position:absolute;
  z-index:220;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:280px;
  height:170px;
}

.playSlot{
  position:absolute;
  width:65px;
  height:96px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.slot0{
  left:107px;
  bottom:0;
}

.slot1{
  left:107px;
  top:0;
}

.slot2{
  left:198px;
  top:37px;
}

.slot3{
  left:16px;
  top:37px;
}

.playedCardWrap{
  position:relative;
  width:63px;
  height:94px;
}

.playedName{
  position:absolute;
  left:50%;
  bottom:-17px;
  transform:translateX(-50%);
  white-space:nowrap;
  font-size:8px;
  font-weight:1000;
  text-shadow:0 1px 4px #000;
}

/* KART */

.card{
  position:relative;
  width:63px;
  height:93px;
  border-radius:8px;
  background:
    linear-gradient(135deg,rgba(255,255,255,.5),transparent 25%),
    repeating-linear-gradient(0deg,rgba(80,65,40,.025) 0 1px,transparent 1px 3px),
    #f3ecd9;
  border:1px solid #a89d87;
  color:#171717;
  box-shadow:
    0 6px 12px rgba(0,0,0,.38),
    inset 0 0 0 2px rgba(255,255,255,.65);
  overflow:hidden;
}

.card:before{
  content:"";
  position:absolute;
  inset:4px;
  border:1px solid rgba(89,76,55,.25);
  border-radius:5px;
}

.card.red{
  color:#bd1d25;
}

.card .corner{
  position:absolute;
  left:6px;
  top:5px;
  display:flex;
  flex-direction:column;
  align-items:center;
  line-height:11px;
  font-weight:1000;
  z-index:2;
}

.card .corner.bottom{
  left:auto;
  top:auto;
  right:6px;
  bottom:5px;
  transform:rotate(180deg);
}

.card .rank{
  font-size:13px;
}

.card .suitSmall{
  font-size:12px;
}

.card .centerSuit{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:32px;
  font-weight:900;
}

/* ZAFER ELİ */

.handArea{
  position:absolute;
  z-index:260;
  left:50%;
  bottom:4px;
  transform:translateX(-50%);
  width:min(610px,96vw);
  height:185px;
  pointer-events:none;
}

.handRow{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  pointer-events:none;
}

#handTop{
  top:0;
}

#handBottom{
  top:69px;
}

.handCard{
  position:relative;
  width:63px;
  height:94px;
  flex:0 0 63px;
  margin-left:-12px;
  pointer-events:auto;
  transition:.15s;
}

.handCard:first-child{
  margin-left:0;
}

#handBottom .handCard{
  z-index:20;
}

#handTop .handCard{
  z-index:5;
}

.handCard:hover{
  transform:translateY(-8px);
}

.handCard.playable:hover{
  transform:translateY(-11px);
}

.handCard.disabled{
  filter:brightness(.45) saturate(.5);
}

/* MESAJ */

#message{
  position:absolute;
  z-index:500;
  left:50%;
  top:calc(50% - 60px);
  transform:translate(-50%,-50%);
  padding:7px 14px;
  border-radius:999px;
  background:rgba(0,0,0,.72);
  border:1px solid rgba(255,255,255,.1);
  font-size:10px;
  font-weight:1000;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  white-space:nowrap;
}

#message.show{
  opacity:1;
}

/* TOAST */

#toast{
  position:absolute;
  z-index:600;
  left:50%;
  top:18px;
  transform:translate(-50%,-20px);
  padding:7px 13px;
  border-radius:999px;
  background:#e5c15e;
  color:#1c1505;
  font-size:10px;
  font-weight:1000;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

#toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* GENEL MODAL */

.overlay{
  position:absolute;
  z-index:1000;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(5px);
}

.overlay.hidden{
  display:none;
}

.modal{
  width:min(390px,88vw);
  padding:22px;
  border-radius:22px;
  text-align:center;
  background:linear-gradient(145deg,#0b2d19,#04170c);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 25px 70px rgba(0,0,0,.65);
}

.modal h1{
  font-size:25px;
  margin-bottom:7px;
}

.modal p{
  color:#9db5a4;
  font-size:11px;
  line-height:1.5;
  margin-bottom:17px;
}

.modeButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.modeBtn{
  min-height:105px;
  padding:12px;
  border-radius:16px;
  background:linear-gradient(145deg,#17472a,#0b2717);
  border:1px solid rgba(255,255,255,.1);
}

.modeBtn strong{
  display:block;
  font-size:16px;
  margin-bottom:6px;
}

.modeBtn span{
  display:block;
  color:#9db6a6;
  font-size:9px;
  line-height:1.4;
}

/* İHALE */

#bidOverlay{
  position:absolute;
  z-index:700;
  inset:0;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding-top:265px;
  background:transparent;
  pointer-events:none;
}

#bidOverlay.hidden{
  display:none;
}

.bidModal{
  width:min(360px,82vw);
  padding:12px 15px 14px;
  border-radius:18px;
  background:linear-gradient(
    145deg,
    rgba(8,30,18,.96),
    rgba(4,17,10,.97)
  );
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 15px 35px rgba(0,0,0,.55);
  text-align:center;
  pointer-events:auto;
}

.bidModal h2{
  font-size:17px;
  margin-bottom:3px;
}

.bidModal p{
  color:#b9cabe;
  font-size:9px;
  margin-bottom:9px;
}

.bidButtons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.bidBtn{
  height:44px;
  border-radius:11px;
  background:linear-gradient(145deg,#1b4a2d,#10321e);
  border:1px solid rgba(255,255,255,.12);
  font-size:16px;
  font-weight:1000;
}

.bidBtn:active{
  transform:scale(.94);
}

/* KOZ */

#trumpOverlay{
  position:absolute;
  z-index:710;
  inset:0;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding-top:265px;
  background:transparent;
  pointer-events:none;
}

#trumpOverlay.hidden{
  display:none;
}

.trumpModal{
  width:min(350px,82vw);
  padding:12px 15px 14px;
  border-radius:18px;
  background:linear-gradient(
    145deg,
    rgba(8,30,18,.96),
    rgba(4,17,10,.97)
  );
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 15px 35px rgba(0,0,0,.55);
  text-align:center;
  pointer-events:auto;
}

.trumpModal h2{
  font-size:17px;
  margin-bottom:3px;
}

.trumpModal p{
  color:#b9cabe;
  font-size:9px;
  margin-bottom:9px;
}

.trumpButtons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.trumpBtn{
  height:47px;
  border-radius:12px;
  background:linear-gradient(145deg,#173e27,#0b2818);
  border:1px solid rgba(255,255,255,.1);
  font-size:23px;
  font-weight:1000;
}

.trumpBtn.red{
  color:#ed5555;
}

.trumpBtn:active{
  transform:scale(.93);
}

/* SONUÇ */

.resultTitle{
  font-size:23px;
  font-weight:1000;
}

.resultScore{
  font-size:40px;
  font-weight:1000;
  color:#e5c15e;
  margin:12px 0;
}

.resultText{
  color:#a9bbaa;
  font-size:11px;
  line-height:1.6;
}

.bigBtn{
  width:100%;
  height:50px;
  margin-top:17px;
  border-radius:14px;
  background:linear-gradient(145deg,#d2aa45,#8e661d);
  font-size:14px;
  font-weight:1000;
}

/* MOBİL */

@media(max-width:700px){

  #game{
    min-height:620px;
  }

  .table{
    width:93vw;
    height:40vh;
    top:50%;
  }

  .teamBox{
    top:54px;
    width:145px;
  }

  #partnerPanel{
    top:96px;
    width:96vw;
    height:142px;
  }

  .partnerRows{
    height:114px;
  }

  .partnerCard{
    width:55px;
    flex-basis:55px;
    height:79px;
    margin-left:-10px;
  }

  #partnerBottom{
    top:56px;
  }

  .partnerCard .rank{
    font-size:10px;
  }

  .partnerCard .smallSuit{
    font-size:9px;
  }

  .partnerCard .centerSuit{
    font-size:25px;
  }

  .handArea{
    width:99vw;
    height:176px;
  }

  .handCard{
    width:58px;
    flex-basis:58px;
    height:87px;
    margin-left:-13px;
  }

  .card{
    width:58px;
    height:87px;
  }

  .card .rank{
    font-size:11px;
  }

  .card .suitSmall{
    font-size:10px;
  }

  .card .centerSuit{
    font-size:28px;
  }

  #handBottom{
    top:65px;
  }

  .playArea{
    transform:translate(-50%,-50%) scale(.88);
  }

  .infoPanel{
    top:calc(50% + 95px);
  }

  #bidOverlay,
  #trumpOverlay{
    padding-top:250px;
  }

  .bidModal,
  .trumpModal{
    width:86vw;
  }
}

@media(max-width:380px){

  #partnerPanel{
    height:128px;
  }

  .partnerCard{
    width:49px;
    flex-basis:49px;
    height:72px;
    margin-left:-11px;
  }

  #partnerBottom{
    top:51px;
  }

  .handCard{
    width:52px;
    flex-basis:52px;
    height:80px;
    margin-left:-14px;
  }

  .card{
    width:52px;
    height:80px;
  }

  .card .centerSuit{
    font-size:25px;
  }

  #handBottom{
    top:61px;
  }

  #bidOverlay,
  #trumpOverlay{
    padding-top:235px;
  }

  .bidBtn{
    height:40px;
  }
}
</style>
</head>

<body>

<div id="game">

  <!-- ÜST -->

  <div class="topBar">

    <div class="logo">
      ♠ BATAK <span>ROYALE</span>
    </div>

    <div class="topActions">

      <button
        class="iconBtn"
        id="soundBtn"
        onclick="toggleSound()">
        🔊
      </button>

      <button
        class="iconBtn"
        onclick="toggleFullscreen()">
        ⛶
      </button>

    </div>

  </div>


  <!-- SKOR -->

  <div class="teamBox left">

    <div
      class="teamName"
      id="team1Title">
      ZAFER
    </div>

    <div
      class="teamScore"
      id="team1Score">
      0
    </div>

    <div
      class="teamDetail"
      id="team1Detail">
      0 el
    </div>

  </div>


  <div class="teamBox right">

    <div
      class="teamName"
      id="team2Title">
      RAKİPLER
    </div>

    <div
      class="teamScore"
      id="team2Score">
      0
    </div>

    <div
      class="teamDetail"
      id="team2Detail">
      0 el
    </div>

  </div>


  <!-- MEHMET'İN AÇIK 13 KARTI -->

  <div id="partnerPanel">

    <div class="partnerTitle">
      MEHMET — EŞİNİN ELİ
    </div>

    <div class="partnerRows">

      <div
        class="partnerRow"
        id="partnerTop">
      </div>

      <div
        class="partnerRow"
        id="partnerBottom">
      </div>

    </div>

  </div>


  <!-- MASA -->

  <div class="table">

    <div class="playerLabel pTop">
      FATİH
    </div>

    <div class="playerLabel pLeft">
      AHMET
    </div>

    <div class="playerLabel pRight">
      MEHMET
    </div>


    <!-- OYNANAN KARTLAR -->

    <div class="playArea">

      <div
        class="playSlot slot0"
        id="slot0">
      </div>

      <div
        class="playSlot slot1"
        id="slot1">
      </div>

      <div
        class="playSlot slot2"
        id="slot2">
      </div>

      <div
        class="playSlot slot3"
        id="slot3">
      </div>

    </div>


    <!-- BİLGİ -->

    <div class="infoPanel">

      <div id="roundInfo">
        1. TUR • 1/13 EL
      </div>

      <div id="trumpInfo">
        KOZ: —
      </div>

    </div>

  </div>


  <!-- MESAJ -->

  <div id="message"></div>

  <div id="toast"></div>


  <!-- ZAFER'İN ELİ -->

  <div class="handArea">

    <div
      class="handRow"
      id="handTop">
    </div>

    <div
      class="handRow"
      id="handBottom">
    </div>

  </div>


  <!-- MOD -->

  <div
    class="overlay"
    id="modeOverlay">

    <div class="modal">

      <h1>
        ♠ Batak Royale
      </h1>

      <p>
        Oyun modunu seç.
      </p>

      <div class="modeButtons">

        <button
          class="modeBtn"
          onclick="chooseMode('single')">

          <strong>
            👤 Tekli Batak
          </strong>

          <span>
            Her oyuncu kendi adına oynar.
          </span>

        </button>


        <button
          class="modeBtn"
          onclick="chooseMode('team')">

          <strong>
            🤝 Eşli Batak

/* =========================================================
   SES
========================================================= */

function getAudio(){

  if(!audioCtx){

    try{

      audioCtx=new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

    }catch(e){}

  }

  if(
    audioCtx &&
    audioCtx.state==="suspended"
  ){

    audioCtx.resume();

  }

  return audioCtx;
}


function noiseBuffer(ctx,duration){

  const buffer=
    ctx.createBuffer(
      1,
      Math.floor(ctx.sampleRate*duration),
      ctx.sampleRate
    );

  const data=
    buffer.getChannelData(0);

  for(
    let i=0;
    i<data.length;
    i++
  ){

    data[i]=Math.random()*2-1;

  }

  return buffer;
}


function cardMoveSound(){

  if(!soundOn)return;

  const ctx=getAudio();

  if(!ctx)return;

  const now=ctx.currentTime;


  /* ŞİŞŞŞT */

  const noise=
    ctx.createBufferSource();

  noise.buffer=
    noiseBuffer(ctx,.16);

  const filter=
    ctx.createBiquadFilter();

  filter.type="bandpass";

  filter.frequency.setValueAtTime(
    1900,
    now
  );

  filter.frequency.exponentialRampToValueAtTime(
    750,
    now+.13
  );

  filter.Q.value=1.3;

  const gain=
    ctx.createGain();

  gain.gain.setValueAtTime(
    .0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    .13,
    now+.015
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now+.16
  );

  noise.connect(filter);

  filter.connect(gain);

  gain.connect(ctx.destination);

  noise.start(now);

  noise.stop(now+.17);


  /* KART ESNEMESİ */

  const flex=
    ctx.createOscillator();

  const fg=
    ctx.createGain();

  flex.type="triangle";

  flex.frequency.setValueAtTime(
    230,
    now
  );

  flex.frequency.exponentialRampToValueAtTime(
    125,
    now+.08
  );

  fg.gain.setValueAtTime(
    .0001,
    now
  );

  fg.gain.exponentialRampToValueAtTime(
    .035,
    now+.012
  );

  fg.gain.exponentialRampToValueAtTime(
    .0001,
    now+.09
  );

  flex.connect(fg);

  fg.connect(ctx.destination);

  flex.start(now);

  flex.stop(now+.1);


  /* ŞIK */

  const click=
    ctx.createOscillator();

  const cg=
    ctx.createGain();

  click.type="square";

  click.frequency.value=1800;

  cg.gain.setValueAtTime(
    .0001,
    now+.055
  );

  cg.gain.exponentialRampToValueAtTime(
    .045,
    now+.058
  );

  cg.gain.exponentialRampToValueAtTime(
    .0001,
    now+.075
  );

  click.connect(cg);

  cg.connect(ctx.destination);

  click.start(now+.055);

  click.stop(now+.08);


  /* ŞAK */

  const slap=
    ctx.createBufferSource();

  slap.buffer=
    noiseBuffer(ctx,.055);

  const sf=
    ctx.createBiquadFilter();

  sf.type="lowpass";

  sf.frequency.value=1600;

  const sg=
    ctx.createGain();

  sg.gain.setValueAtTime(
    .0001,
    now+.09
  );

  sg.gain.exponentialRampToValueAtTime(
    .18,
    now+.095
  );

  sg.gain.exponentialRampToValueAtTime(
    .0001,
    now+.15
  );

  slap.connect(sf);

  sf.connect(sg);

  sg.connect(ctx.destination);

  slap.start(now+.09);

  slap.stop(now+.16);


  /* TOK */

  const tok=
    ctx.createOscillator();

  const tg=
    ctx.createGain();

  tok.type="sine";

  tok.frequency.setValueAtTime(
    110,
    now+.105
  );

  tok.frequency.exponentialRampToValueAtTime(
    70,
    now+.15
  );

  tg.gain.setValueAtTime(
    .0001,
    now+.105
  );

  tg.gain.exponentialRampToValueAtTime(
    .09,
    now+.11
  );

  tg.gain.exponentialRampToValueAtTime(
    .0001,
    now+.18
  );

  tok.connect(tg);

  tg.connect(ctx.destination);

  tok.start(now+.105);

  tok.stop(now+.19);

}


function selectSound(){

  if(!soundOn)return;

  const ctx=getAudio();

  if(!ctx)return;

  const now=ctx.currentTime;

  [440,554,659].forEach(
    (f,i)=>{

      const o=
        ctx.createOscillator();

      const g=
        ctx.createGain();

      o.type="sine";

      o.frequency.value=f;

      g.gain.setValueAtTime(
        .0001,
        now+i*.07
      );

      g.gain.exponentialRampToValueAtTime(
        .055,
        now+i*.07+.01
      );

      g.gain.exponentialRampToValueAtTime(
        .0001,
        now+i*.07+.12
      );

      o.connect(g);

      g.connect(ctx.destination);

      o.start(now+i*.07);

      o.stop(now+i*.07+.13);

    }
  );

}


function winSound(){

  if(!soundOn)return;

  const ctx=getAudio();

  if(!ctx)return;

  const now=ctx.currentTime;

  [523,659,784,1046].forEach(
    (f,i)=>{

      const o=
        ctx.createOscillator();

      const g=
        ctx.createGain();

      o.type="sine";

      o.frequency.value=f;

      g.gain.setValueAtTime(
        .0001,
        now+i*.09
      );

      g.gain.exponentialRampToValueAtTime(
        .08,
        now+i*.09+.02
      );

      g.gain.exponentialRampToValueAtTime(
        .0001,
        now+i*.09+.2
      );

      o.connect(g);

      g.connect(ctx.destination);

      o.start(now+i*.09);

      o.stop(now+i*.09+.22);

    }
  );

}

/* =========================================================
   DESTE
========================================================= */

function createDeck(){

  deck=[];

  suits.forEach(
    suit=>{

      ranks.forEach(
        rank=>{

          deck.push({

            suit:suit,
            rank:rank,
            value:ranks.indexOf(rank)+2,
            id:rank+suit

          });

        }
      );

    }
  );

}


function shuffle(array){

  for(
    let i=array.length-1;
    i>0;
    i--
  ){

    const j=
      Math.floor(
        Math.random()*(i+1)
      );

    [
      array[i],
      array[j]
    ]=[
      array[j],
      array[i]
    ];

  }

  return array;

}

/* =========================================================
   TUR
========================================================= */

function startRound(){

  createDeck();

  shuffle(deck);


  players.forEach(
    p=>{

      p.hand=[];

      p.bid=0;

      p.tricks=0;

    }
  );


  for(
    let i=0;
    i<52;
    i++
  ){

    players[i%4].hand.push(
      deck[i]
    );

  }


  players.forEach(
    p=>{

      p.hand.sort(
        (a,b)=>{

          const suitOrder=
            suits.indexOf(a.suit)-
            suits.indexOf(b.suit);

          return suitOrder ||
            b.value-a.value;

        }
      );

    }
  );


  trump=null;

  leadSuit=null;

  trick=[];

  trickNumber=0;

  playerBid=0;

  leader=0;

  currentPlayer=0;

  waitingHuman=true;


  renderHands();

  renderPartnerHand();

  updateScores();

  updateRoundInfo();


  document.getElementById(
    "bidOverlay"
  ).classList.remove("hidden");


  showMessage(
    "Kartların açık — ihaleni seç"
  );

  selectSound();

}

/* =========================================================
   GEÇERLİ KART
========================================================= */

function legalCard(card){

  if(!leadSuit)return true;


  const hasLead=
    players[0].hand.some(
      c=>c.suit===leadSuit
    );


  if(
    hasLead &&
    card.suit!==leadSuit
  ){

    return false;

  }


  return true;

}


/* =========================================================
   ZAFER KART OYNA
========================================================= */

function playHumanCard(index){

  if(currentPlayer!==0)return;


  const card=
    players[0].hand[index];

  if(!card)return;


  if(!legalCard(card)){

    showToast(
      "Bu renkten oynamalısın!"
    );

    return;

  }


  playCard(
    0,
    index
  );

}


/* =========================================================
   KART OYNAT
========================================================= */

function playCard(
  player,
  index
){

  const card=
    players[player].hand[index];

  if(!card)return;


  if(
    player===0 &&
    !legalCard(card)
  ){

    showToast(
      "Bu renkten oynamalısın!"
    );

    return;

  }


  players[player].hand.splice(
    index,
    1
  );


  if(trick.length===0){

    leadSuit=card.suit;

  }


  trick.push({

    player:player,
    card:card

  });


  cardMoveSound();


  renderPlayedCard(
    player,
    card
  );


  currentPlayer=
    (player+1)%4;


  renderHands();

  renderPartnerHand();

  updateRoundInfo();


  if(trick.length<4){

    if(currentPlayer===0){

      waitingHuman=true;

      showMessage(
        "Sıra sende"
      );

    }else{

      waitingHuman=false;

      setTimeout(
        aiPlay,
        150
      );

    }

  }else{

    waitingHuman=false;

    setTimeout(
      resolveTrick,
      600
    );

  }

}


/* =========================================================
   OYNANAN KART
========================================================= */

function renderPlayedCard(
  player,
  card
){

  const slot=
    document.getElementById(
      "slot"+player
    );


  slot.innerHTML=`

    <div class="playedCardWrap">

      ${cardHTML(card)}

      <div class="playedName">
        ${playerNames[player]}
      </div>

    </div>

  `;

}


/* =========================================================
   AI
========================================================= */

function aiPlay(){

  if(trick.length>=4)return;


  const p=
    players[currentPlayer];


  let legal=
    p.hand.filter(
      card=>{

        if(!leadSuit)return true;


        const hasLead=
          p.hand.some(
            c=>c.suit===leadSuit
          );


        if(hasLead){

          return card.suit===leadSuit;

        }


        return true;

      }
    );


  if(!legal.length){

    legal=p.hand.slice();

  }


  let selected;


  const winning=
    legal.filter(
      c=>{

        const temp=
          trick.concat([
            {
              player:currentPlayer,
              card:c
            }
          ]);

        return beatsCurrent(
          temp,
          currentPlayer
        );

      }
    );


  if(winning.length){

    winning.sort(
      (a,b)=>a.value-b.value
    );

    selected=winning[0];

  }else{

    legal.sort(
      (a,b)=>a.value-b.value
    );

    selected=legal[0];

  }


  const index=
    p.hand.indexOf(
      selected
    );


  playCard(
    currentPlayer,
    index
  );

}


/* =========================================================
   KART KARŞILAŞTIRMA
========================================================= */

function cardBeats(a,b){

  if(!b)return true;


  if(a.suit===b.suit){

    return a.value>b.value;

  }


  if(
    a.suit===trump &&
    b.suit!==trump
  ){

    return true;

  }


  if(
    a.suit!==trump &&
    b.suit===trump
  ){

    return false;

  }


  if(
    a.suit===leadSuit &&
    b.suit!==leadSuit
  ){

    return true;

  }


  return false;

}


function beatsCurrent(
  arr,
  player
){

  let best=null;


  for(
    const item of arr
  ){

    if(
      !best ||
      cardBeats(
        item.card,
        best.card
      )
    ){

      best=item;

    }

  }


  return best &&
    best.player===player;

}


/* =========================================================
   ELİ ÇÖZ
========================================================= */

function resolveTrick(){

  let winner=
    trick[0];


  for(
    let i=1;
    i<trick.length;
    i++
  ){

    if(
      cardBeats(
        trick[i].card,
        winner.card
      )
    ){

      winner=
        trick[i];

    }

  }


  players[
    winner.player
  ].tricks++;


  showMessage(
    playerNames[winner.player]+
    " eli aldı"
  );


  if(winner.player===0){

    winSound();

  }


  leader=
    winner.player;


  setTimeout(
    ()=>{

      clearTable();

      trickNumber++;


      if(trickNumber>=13){

        finishRound();

      }else{

        leadSuit=null;

        trick=[];

        currentPlayer=
          leader;

        updateRoundInfo();

        renderHands();

        renderPartnerHand();


        if(currentPlayer===0){

          waitingHuman=true;

          showMessage(
            "Sıra sende"
          );

        }else{

          waitingHuman=false;

          setTimeout(
            aiPlay,
            300
          );

        }

      }

    },
    550
  );

}


/* =========================================================
   MASA TEMİZLE
========================================================= */

function clearTable(){

  [
    "slot0",
    "slot1",
    "slot2",
    "slot3"
  ].forEach(
    id=>{

      document.getElementById(
        id
      ).innerHTML="";

    }
  );

}


/* =========================================================
   TUR SONU
========================================================= */

function finishRound(){

  let t1=0;
  let t2=0;


  if(mode==="team"){

    t1=
      players[0].tricks+
      players[2].tricks;

    t2=
      players[1].tricks+
      players[3].tricks;


    const bid1=
      players[0].bid+
      players[2].bid;

    const bid2=
      players[1].bid+
      players[3].bid;


    if(t1>=bid1){

      scores.team1+=t1;

    }else{

      scores.team1-=bid1;

    }


    if(t2>=bid2){

      scores.team2+=t2;

    }else{

      scores.team2-=bid2;

    }

  }else{

    t1=
      players[0].tricks;

    t2=
      players[1].tricks+
      players[2].tricks+
      players[3].tricks;


    if(
      t1>=players[0].bid
    ){

      scores.team1+=t1;

    }else{

      scores.team1-=players[0].bid;

    }


    scores.team2+=t2;

  }


  updateScores();


  document.getElementById(
    "resultScore"
  ).textContent=
    scores.team1+
    " - "+
    scores.team2;


  let text="";


  if(mode==="team"){

    text=
      "ZAFER + MEHMET: "+
      t1+
      " el<br>"+
      "FATİH + AHMET: "+
      t2+
      " el";

  }else{

    text=
      "ZAFER: "+
      t1+
      " el<br>"+
      "Rakipler: "+
      t2+
      " el";

  }


  document.getElementById(
    "resultText"
  ).innerHTML=text;


  if(round>=5){

    document.getElementById(
      "resultTitle"
    ).textContent=
      "🏆 Oyun Bitti";


    document.querySelector(
      "#resultOverlay .bigBtn"
    ).textContent=
      "Yeni Oyun";

  }else{

    document.getElementById(
      "resultTitle"
    ).textContent=
      round+
      ". Tur Bitti";


    document.querySelector(
      "#resultOverlay .bigBtn"
    ).textContent=
      "Sonraki Tur";

  }


  document.getElementById(
    "resultOverlay"
  ).classList.remove(
    "hidden"
  );

}


/* =========================================================
   SONRAKİ TUR
========================================================= */

function nextRound(){

  document.getElementById(
    "resultOverlay"
  ).classList.add(
    "hidden"
  );


  if(round>=5){

    round=1;

    scores={
      team1:0,
      team2:0
    };

  }else{

    round++;

  }


  startRound();

}


/* =========================================================
   SKOR
========================================================= */

function updateScores(){

  document.getElementById(
    "team1Score"
  ).textContent=
    scores.team1;


  document.getElementById(
    "team2Score"
  ).textContent=
    scores.team2;


  if(mode==="team"){

    document.getElementById(
      "team1Detail"
    ).textContent=
      "ZAFER "+
      players[0].tricks+
      " • MEHMET "+
      players[2].tricks;


    document.getElementById(
      "team2Detail"
    ).textContent=
      "FATİH "+
      players[1].tricks+
      " • AHMET "+
      players[3].tricks;

  }else{

    document.getElementById(
      "team1Detail"
    ).textContent=
      "İhale: "+
      players[0].bid+
      " • El: "+
      players[0].tricks;


    document.getElementById(
      "team2Detail"
    ).textContent=
      "Rakipler: "+
      (
        players[1].tricks+
        players[2].tricks+
        players[3].tricks
      );

  }

}


/* =========================================================
   TUR BİLGİ
========================================================= */

function updateRoundInfo(){

  document.getElementById(
    "roundInfo"
  ).textContent=
    round+
    ". TUR • "+
    Math.min(
      trickNumber+1,
      13
    )+
    "/13 EL";

}


/* =========================================================
   MESAJ
========================================================= */

let messageTimer=null;

function showMessage(text){

  const el=
    document.getElementById(
      "message"
    );

  el.textContent=text;

  el.classList.add("show");


  clearTimeout(
    messageTimer
  );


  messageTimer=
    setTimeout(
      ()=>{
        el.classList.remove(
          "show"
        );
      },
      1300
    );

}


let toastTimer=null;

function showToast(text){

  const el=
    document.getElementById(
      "toast"
    );

  el.textContent=text;

  el.classList.add("show");


  clearTimeout(
    toastTimer
  );


  toastTimer=
    setTimeout(
      ()=>{
        el.classList.remove(
          "show"
        );
      },
      1200
    );

}


/* =========================================================
   TAM EKRAN
========================================================= */

function toggleFullscreen(){

  const el=
    document.documentElement;


  if(!document.fullscreenElement){

    if(el.requestFullscreen){

      el.requestFullscreen()
        .catch(()=>{});

    }

  }else{

    if(document.exitFullscreen){

      document.exitFullscreen()
        .catch(()=>{});

    }

  }

}


/* =========================================================
   KLAVYE
========================================================= */

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="f" ||
      e.key==="F"
    ){

      toggleFullscreen();

    }


    if(
      e.key==="m" ||
      e.key==="M"
    ){

      toggleSound();

    }

  }
);


/* =========================================================
   ZOOM ENGELİ
========================================================= */

let lastTouch=0;

document.addEventListener(
  "touchend",
  e=>{

    const now=Date.now();

    if(
      now-lastTouch<300
    ){

      e.preventDefault();

    }

    lastTouch=now;

  },
  {
    passive:false
  }
);


/* BAŞLANGIÇ */

document.getElementById(
  "partnerPanel"
).style.display="none";

</script>
