<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mina Video AI V15</title>

<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#090b10;
    color:#fff;
}
button,input,textarea,select{font:inherit}

:root{
    --bg:#090b10;
    --panel:#11151d;
    --panel2:#171c26;
    --border:#272e3a;
    --text:#f4f6fa;
    --muted:#8d98aa;
    --accent:#7c5cff;
    --accent2:#00d4ff;
    --danger:#ff4d67;
    --green:#36d98b;
}

.app{
    width:100%;
    height:100%;
    display:grid;
    grid-template-rows:58px 1fr 125px;
}

/* TOP */
.topbar{
    background:#0d1017;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    padding:0 15px;
    gap:14px;
}
.logo{
    font-size:19px;
    font-weight:800;
    white-space:nowrap;
}
.logo span{color:var(--accent2)}
.projectName{
    color:var(--muted);
    font-size:13px;
}
.top-actions{
    margin-left:auto;
    display:flex;
    gap:8px;
}
.btn{
    border:1px solid var(--border);
    background:#171c25;
    color:white;
    padding:9px 13px;
    border-radius:8px;
    cursor:pointer;
    transition:.15s;
}
.btn:hover{background:#202735}
.btn.primary{
    background:var(--accent);
    border-color:var(--accent);
}
.btn.green{
    background:#16865b;
    border-color:#16865b;
}
.btn.danger{
    background:#4c1822;
    border-color:#68202e;
}

/* MAIN */
.main{
    min-height:0;
    display:grid;
    grid-template-columns:280px minmax(400px,1fr) 320px;
}

/* LEFT */
.left{
    min-width:0;
    background:var(--panel);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
}
.panel-head{
    height:48px;
    padding:0 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
}
.panel-title{
    font-size:13px;
    font-weight:700;
}
.scene-count{
    color:var(--muted);
    font-size:11px;
}
.scene-list{
    flex:1;
    min-height:0;
    overflow:auto;
    padding:9px;
}
.scene-card{
    background:#151a23;
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:8px;
    padding:7px;
    cursor:pointer;
    position:relative;
}
.scene-card.active{
    border-color:var(--accent);
    box-shadow:0 0 0 1px rgba(124,92,255,.2);
}
.scene-row{
    display:flex;
    gap:8px;
    align-items:center;
}
.thumb{
    width:82px;
    height:50px;
    flex:0 0 82px;
    border-radius:6px;
    overflow:hidden;
    background:#090c11;
    border:1px solid #2b3340;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#697386;
    font-size:10px;
}
.thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}
.scene-info{
    min-width:0;
    flex:1;
}
.scene-number{
    font-size:11px;
    color:var(--accent2);
    font-weight:bold;
    margin-bottom:4px;
}
.scene-text{
    color:#aeb7c6;
    font-size:10px;
    line-height:1.35;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
}
.scene-duration{
    font-size:10px;
    color:#718096;
    margin-top:4px;
}
.scene-mini-actions{
    position:absolute;
    right:5px;
    bottom:5px;
    display:flex;
    gap:3px;
}
.mini{
    width:22px;
    height:22px;
    border:0;
    border-radius:5px;
    background:#222936;
    color:#bbb;
    cursor:pointer;
    font-size:11px;
}
.mini:hover{background:#30394a}

.left-bottom{
    padding:9px;
    border-top:1px solid var(--border);
}
.full{
    width:100%;
}

/* CENTER */
.center{
    min-width:0;
    min-height:0;
    background:#07090d;
    display:flex;
    flex-direction:column;
}
.preview-toolbar{
    height:48px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:7px;
    padding:0 10px;
    background:#0c0f15;
}
.preview-toolbar .spacer{flex:1}
.status{
    font-size:11px;
    color:var(--muted);
}
.preview-wrap{
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:
      radial-gradient(circle at center,#171d28 0,#090c12 45%,#05070a 100%);
}
#canvas{
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    background:#000;
    border:1px solid #252c38;
    box-shadow:0 15px 60px rgba(0,0,0,.55);
}
.story-box{
    position:absolute;
    left:50%;
    top:75px;
    transform:translateX(-50%);
    width:min(700px,70%);
    display:none;
    z-index:10;
}
.story-box textarea{
    width:100%;
    height:150px;
    resize:vertical;
    background:#10151e;
    color:#fff;
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
}

/* RIGHT */
.right{
    min-width:0;
    background:var(--panel);
    border-left:1px solid var(--border);
    overflow:auto;
}
.inspector{
    padding:13px;
}
.section{
    border-bottom:1px solid var(--border);
    padding-bottom:13px;
    margin-bottom:13px;
}
.section-title{
    font-size:11px;
    color:#b9c3d3;
    font-weight:bold;
    text-transform:uppercase;
    letter-spacing:.5px;
    margin-bottom:9px;
}
label{
    display:block;
    font-size:10px;
    color:var(--muted);
    margin:8px 0 4px;
}
input[type=text],
input[type=number],
textarea,
select{
    width:100%;
    background:#0d1118;
    color:#fff;
    border:1px solid var(--border);
    border-radius:7px;
    padding:8px;
    outline:none;
}
textarea{
    resize:vertical;
    min-height:72px;
}
input:focus,textarea:focus,select:focus{
    border-color:var(--accent);
}
.grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}
.file-btn{
    position:relative;
    overflow:hidden;
}
.file-btn input{
    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;
}
.file-status{
    font-size:10px;
    color:#6f7b8d;
    margin-top:5px;
}
.range-row{
    display:flex;
    align-items:center;
    gap:8px;
}
.range-row input{flex:1}
.value{
    min-width:38px;
    text-align:right;
    font-size:10px;
    color:#aeb8c7;
}

/* TIMELINE */
.timeline{
    background:#0c0f15;
    border-top:1px solid var(--border);
    min-height:0;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}
.timeline-head{
    height:31px;
    display:flex;
    align-items:center;
    padding:0 10px;
    border-bottom:1px solid var(--border);
    color:#7e899b;
    font-size:10px;
}
.timeline-scroll{
    flex:1;
    overflow-x:auto;
    overflow-y:hidden;
    padding:9px 10px;
}
.timeline-track{
    display:flex;
    gap:4px;
    height:58px;
    min-width:max-content;
}
.timeline-item{
    height:58px;
    min-width:95px;
    border:1px solid #293140;
    background:#151a23;
    border-radius:6px;
    overflow:hidden;
    position:relative;
    cursor:pointer;
}
.timeline-item.active{
    border-color:var(--accent);
}
.timeline-item img{
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:.55;
}
.timeline-overlay{
    position:absolute;
    inset:0;
    padding:5px;
    background:linear-gradient(transparent,rgba(0,0,0,.85));
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    font-size:9px;
}

/* MODAL */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
}
.modal.show{display:flex}
.modal-box{
    width:min(850px,90vw);
    max-height:85vh;
    overflow:auto;
    background:#11161f;
    border:1px solid var(--border);
    border-radius:12px;
    padding:15px;
}
.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}
.modal-title{font-weight:bold}
#storyInput{
    min-height:300px;
}
.notice{
    padding:9px;
    background:#141b25;
    border:1px solid #273142;
    border-radius:7px;
    color:#8793a6;
    font-size:10px;
    line-height:1.5;
    margin-bottom:10px;
}

/* MOBILE */
@media(max-width:1000px){
    .main{
        grid-template-columns:230px 1fr;
    }
    .right{
        display:none;
    }
}
@media(max-width:700px){
    html,body{overflow:auto}
    .app{height:auto;min-height:100vh;grid-template-rows:58px auto 110px}
    .main{
        display:block;
    }
    .left{
        height:230px;
        border-right:0;
        border-bottom:1px solid var(--border);
    }
    .center{height:55vh}
    .right{display:block;height:auto;border-left:0}
}
</style>
</head>

<body>

<div class="app">

<!-- TOP -->
<div class="topbar">
    <div class="logo">Mina <span>Video AI</span></div>
    <div class="projectName">V15 • Cinematic Story Editor</div>

    <div class="top-actions">
        <button class="btn" onclick="openStory()">📖 Hikâye</button>
        <button class="btn" onclick="autoDirector()">🎬 AI Yönetmen</button>
        <button class="btn primary" onclick="exportVideo()">⬇ Video Oluştur</button>
    </div>
</div>

<!-- MAIN -->
<div class="main">

    <!-- LEFT -->
    <aside class="left">
        <div class="panel-head">
            <div class="panel-title">SAHNELER</div>
            <div class="scene-count" id="sceneCount">0 sahne</div>
        </div>

        <div class="scene-list" id="sceneList"></div>

        <div class="left-bottom">
            <button class="btn full" onclick="addScene()">＋ Yeni Sahne</button>
        </div>
    </aside>

    <!-- CENTER -->
    <section class="center">

        <div class="preview-toolbar">
            <button class="btn" onclick="playPreview()">▶ Oynat</button>
            <button class="btn" onclick="pausePreview()">⏸ Duraklat</button>
            <button class="btn" onclick="stopPreview()">⏹ Durdur</button>

            <div class="spacer"></div>

            <span class="status" id="status">Hazır</span>

            <select id="ratio" onchange="changeRatio()">
                <option value="16:9">16:9</option>
                <option value="9:16">9:16</option>
                <option value="1:1">1:1</option>
            </select>

            <select id="fps">
                <option value="30">30 FPS</option>
                <option value="24">24 FPS</option>
            </select>
        </div>

        <div class="preview-wrap">
            <canvas id="canvas" width="1280" height="720"></canvas>
        </div>

    </section>

    <!-- RIGHT -->
    <aside class="right">
        <div class="inspector" id="inspector"></div>
    </aside>

</div>

<!-- TIMELINE -->
<div class="timeline">
    <div class="timeline-head">
        <span>ZAMAN ÇİZELGESİ</span>
        <span style="margin-left:auto" id="timelineInfo">0 saniye</span>
    </div>
    <div class="timeline-scroll">
        <div class="timeline-track" id="timelineTrack"></div>
    </div>
</div>

</div>

<!-- STORY MODAL -->
<div class="modal" id="storyModal">
    <div class="modal-box">
        <div class="modal-head">
            <div class="modal-title">Hikâyeyi Sahnelere Böl</div>
            <button class="btn" onclick="closeStory()">✕</button>
        </div>

        <div class="notice">
            Hikâyeni buraya yapıştır. Mina metni analiz ederek sahnelere böler,
            her sahne için sinematik görsel komutu oluşturur ve karakter/kamera/
            atmosfer hareketlerini otomatik belirler.
        </div>

        <textarea id="storyInput" placeholder="Hikâyeni buraya yapıştır..."></textarea>

        <div class="grid2" style="margin-top:10px">
            <div>
                <label>Sahne sayısı</label>
                <input type="number" id="sceneNumber" value="10" min="1" max="200">
            </div>

            <div>
                <label>Dağılım</label>
                <select id="splitMode">
                    <option value="balanced">Dengeli</option>
                    <option value="paragraph">Paragraf odaklı</option>
                    <option value="cinematic">Sinematik</option>
                </select>
            </div>
        </div>

        <button class="btn primary full" style="margin-top:10px" onclick="splitStory()">
            🎬 Hikâyeyi Analiz Et ve Sahnelere Böl
        </button>
    </div>
</div>

<script>

/* =========================================================
   MINA VIDEO AI V15
   ========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let scenes = [];
let selectedSceneId = null;

let playing = false;
let animationId = null;
let playStart = 0;
let sceneStartTime = 0;
let currentSceneIndex = 0;

let audioContext = null;
let masterGain = null;
let audioDestination = null;

const imageCache = new Map();
const audioCache = new Map();

/*
 IMPORTANT:
 Her sahnenin benzersiz ID'si vardır.
 Görsel state'i sahneye bağlıdır.
 DOM'a bağlı değildir.
*/

function uid(){
    return "scene_" +
        Date.now().toString(36) +
        "_" +
        Math.random().toString(36).slice(2,10);
}

function createScene(text=""){
    return {
        id:uid(),
        text:text,
        subtitle:text,
        prompt:"",
        imageData:null,
        imageName:"",
        audioData:null,
        audioName:"",
        audioDuration:5,

        character:"none",
        camera:"slow_zoom",
        atmosphere:"none",
        transition:"fade",

        zoom:1,
        panX:0,
        panY:0,

        opacity:1
    };
}

/* =========================================================
   INITIAL STORY
   ========================================================= */

const initialStory = `Stell dir vor, du bist 65 Jahre alt.

Du hast fast alles verloren.

Dein Restaurant ist weg.

Dein Einkommen ist verschwunden.

Und viele Menschen würden jetzt sagen:

„Es ist zu spät.“

Doch ein Mann dachte anders.

Sein Name war Harland Sanders.

Er hatte viele schwierige Jahre hinter sich.

Er hatte verschiedene Jobs.

Er hatte ein Restaurant geführt.

Er hatte Erfolge erlebt.

Aber auch schwere Rückschläge.

Dann verlor sein Restaurant einen großen Teil seiner Kunden.

Plötzlich musste Sanders wieder von vorne anfangen.

Doch er hatte noch eine Idee.

Sein Rezept für gebratenes Hähnchen.

Er glaubte fest daran, dass dieses Rezept etwas Besonderes war.

Also setzte er sich in sein Auto.

Er begann, von Restaurant zu Restaurant zu fahren.

Er wollte anderen Restaurantbesitzern sein Rezept anbieten.

Doch die ersten Antworten waren nicht das, was er gehofft hatte.

Nein.

Noch ein Nein.

Und wieder ein Nein.

Viele Menschen hätten an diesem Punkt aufgegeben.

Aber Sanders machte weiter.

Er fuhr zur nächsten Adresse.

Er klopfte an die nächste Tür.

Und er stellte sein Rezept wieder vor.

Immer wieder.

Ablehnung für Ablehnung.

Doch irgendwann kam ein Ja.

Ein Restaurantbesitzer gab ihm eine Chance.

Das Hähnchen wurde verkauft.

Die Kunden mochten es.

Andere Restaurants wurden aufmerksam.

Und plötzlich begann sich etwas zu verändern.

Aus einer kleinen Idee entstand ein wachsendes Geschäft.

Sanders wurde immer bekannter.

Sein weißer Anzug und sein charakteristischer Bart wurden später zu seinem Markenzeichen.

Aus Harland Sanders wurde Colonel Sanders.

Und sein Rezept wurde schließlich mit Kentucky Fried Chicken verbunden.

Doch diese Geschichte handelt nicht nur von Hähnchen.

Sie handelt von einem Menschen, der sich weigerte aufzugeben.

Stell dir vor, du bist 65 Jahre alt.

Die meisten Menschen denken vielleicht, dass ein neues Leben in diesem Alter unmöglich ist.

Sanders bewies, dass ein Neuanfang trotzdem möglich sein kann.

Vielleicht hast auch du gerade einen Rückschlag erlebt.

Vielleicht hat jemand deine Idee abgelehnt.

Vielleicht hast du schon zehnmal ein Nein gehört.

Dann denk an diese Geschichte.

Ein Nein muss nicht das Ende sein.

Manchmal musst du nur zur nächsten Tür gehen.

Und wieder anklopfen.

Denn vielleicht wartet hinter der nächsten Tür genau die Chance, auf die du gewartet hast.

Es ist niemals zu spät, neu anzufangen.`;

/* =========================================================
   STORY
   ========================================================= */

function openStory(){
    document.getElementById("storyModal").classList.add("show");
    document.getElementById("storyInput").value =
        scenes.length ? scenes.map(s=>s.text).join("\n\n") : initialStory;
}

function closeStory(){
    document.getElementById("storyModal").classList.remove("show");
}

function splitStory(){

    const text = document.getElementById("storyInput").value.trim();

    if(!text){
        alert("Önce hikâyeyi yaz veya yapıştır.");
        return;
    }

    let count = parseInt(document.getElementById("sceneNumber").value)||10;

    count = Math.max(1,Math.min(200,count));

    const paragraphs = text
        .split(/\n+/)
        .map(x=>x.trim())
        .filter(Boolean);

    let chunks=[];

    if(paragraphs.length >= count){

        const per = paragraphs.length / count;

        for(let i=0;i<count;i++){

            const start=Math.floor(i*per);
            const end=Math.floor((i+1)*per);

            chunks.push(
                paragraphs.slice(start,end).join(" ")
            );
        }

    }else{

        const words=text.split(/\s+/);
        const per=words.length/count;

        for(let i=0;i<count;i++){

            const start=Math.floor(i*per);
            const end=Math.floor((i+1)*per);

            chunks.push(
                words.slice(start,end).join(" ")
            );
        }
    }

    scenes=[];

    chunks.forEach((chunk,i)=>{

        if(!chunk.trim()) return;

        const scene=createScene(chunk);

        scene.subtitle=chunk;

        scene.prompt=generatePrompt(chunk,i);

        const director=analyzeScene(chunk);

        scene.character=director.character;
        scene.camera=director.camera;
        scene.atmosphere=director.atmosphere;
        scene.transition=director.transition;

        scenes.push(scene);
    });

    selectedSceneId=scenes[0]?.id||null;

    renderAll();

    closeStory();

    setStatus(
        scenes.length+" sahne oluşturuldu."
    );
}

/* =========================================================
   SCENE ANALYSIS
   ========================================================= */

function analyzeScene(text){

    const t=text.toLowerCase();

    let character="none";
    let camera="slow_zoom";
    let atmosphere="none";
    let transition="fade";

    if(
        /gehen|geht|fahren|fuhr|läuft|läuft|laufen|walk|car|auto|door|tür|klopft|klopfen/.test(t)
    ){
        character="walk";
        camera="tracking";
    }

    if(
        /sagen|sagt|spricht|erzählt|name|stell dir vor/.test(t)
    ){
        character="talk";
        camera="slow_push";
    }

    if(
        /sitzen|saß|sitzt/.test(t)
    ){
        character="sit";
        camera="slow_zoom";
    }

    if(
        /verlieren|verlor|rückschlag|nein|ablehnung|schwer|allein/.test(t)
    ){
        atmosphere="dark";
        camera="slow_push";
    }

    if(
        /regen|rain/.test(t)
    ){
        atmosphere="rain";
    }

    if(
        /feuer|fire|flamme/.test(t)
    ){
        atmosphere="fire";
    }

    if(
        /rauch|smoke|nebel|fog/.test(t)
    ){
        atmosphere="fog";
    }

    if(
        /ja|chance|erfolg|wachsend|bekannt|neuanfang/.test(t)
    ){
        atmosphere="dust";
        transition="flash";
    }

    return {
        character,
        camera,
        atmosphere,
        transition
    };
}

/* =========================================================
   PROMPT ENGINE
   ========================================================= */

function generatePrompt(text,index){

    const t=text.toLowerCase();

    let subject=
        "Harland Sanders, 65-year-old American man, white suit, white hair, distinctive white beard";

    if(/restaurant|küche|hähnchen|rezept|chicken/.test(t)){
        subject += ", inside an authentic mid-century American restaurant kitchen";
    }else if(/auto|fahren|fuhr|car/.test(t)){
        subject += ", sitting inside an old American car";
    }else if(/tür|klopft|adresse/.test(t)){
        subject += ", standing in front of a modest American restaurant";
    }else{
        subject += ", in an authentic 1950s American environment";
    }

    let mood="dramatic emotional atmosphere";

    if(/nein|verlust|verlor|schwer|ablehnung/.test(t)){
        mood="lonely, dramatic, emotionally heavy mood";
    }

    if(/ja|chance|erfolg|wachsend|neuanfang/.test(t)){
        mood="hopeful, inspiring cinematic mood";
    }

    return `${subject}, ${mood}, authentic 1950s America, realistic human proportions, historically believable clothing and environment, cinematic composition, dramatic natural lighting, volumetric light, shallow depth of field, realistic skin texture, detailed environment, film still, anamorphic lens, 35mm cinematic photography, high detail, no text, no logo, no watermark`;
}

/* =========================================================
   RENDER ALL
   ========================================================= */

function renderAll(){

    renderScenes();
    renderInspector();
    renderTimeline();
    updateSceneCount();
    drawFrame();
}

/* =========================================================
   SCENE LIST
   ========================================================= */

function renderScenes(){

    const list=document.getElementById("sceneList");

    /*
      IMPORTANT FIX:
      Listeyi scene.id ile oluşturuyoruz.
      Görsel kesinlikle index'e bağlı değil.
    */

    list.innerHTML="";

    scenes.forEach((scene,index)=>{

        const card=document.createElement("div");

        card.className=
            "scene-card"+
            (scene.id===selectedSceneId ? " active":"");

        card.dataset.sceneId=scene.id;

        const row=document.createElement("div");
        row.className="scene-row";

        const thumb=document.createElement("div");
        thumb.className="thumb";

        if(scene.imageData){

            const img=document.createElement("img");

            img.src=scene.imageData;

            img.dataset.sceneId=scene.id;

            thumb.appendChild(img);

        }else{

            thumb.textContent="GÖRSEL YOK";
        }

        const info=document.createElement("div");
        info.className="scene-info";

        const num=document.createElement("div");
        num.className="scene-number";
        num.textContent="SAHNE "+(index+1);

        const txt=document.createElement("div");
        txt.className="scene-text";
        txt.textContent=scene.text || "Boş sahne";

        const duration=document.createElement("div");
        duration.className="scene-duration";
        duration.textContent=
            "⏱ "+formatTime(scene.audioDuration||5);

        info.appendChild(num);
        info.appendChild(txt);
        info.appendChild(duration);

        row.appendChild(thumb);
        row.appendChild(info);

        card.appendChild(row);

        const actions=document.createElement("div");
        actions.className="scene-mini-actions";

        const up=document.createElement("button");
        up.className="mini";
        up.textContent="↑";
        up.onclick=e=>{
            e.stopPropagation();
            moveScene(scene.id,-1);
        };

        const down=document.createElement("button");
        down.className="mini";
        down.textContent="↓";
        down.onclick=e=>{
            e.stopPropagation();
            moveScene(scene.id,1);
        };

        const dup=document.createElement("button");
        dup.className="mini";
        dup.textContent="⧉";
        dup.onclick=e=>{
            e.stopPropagation();
            duplicateScene(scene.id);
        };

        const del=document.createElement("button");
        del.className="mini";
        del.textContent="×";
        del.onclick=e=>{
            e.stopPropagation();
            deleteScene(scene.id);
        };

        actions.appendChild(up);
        actions.appendChild(down);
        actions.appendChild(dup);
        actions.appendChild(del);

        card.appendChild(actions);

        card.onclick=()=>{
            selectedSceneId=scene.id;
            renderAll();
        };

        list.appendChild(card);
    });
}

/* =========================================================
   IMAGE UPLOAD — CRITICAL FIX
   ========================================================= */

function handleImageUpload(event,sceneId){

    const file=event.target.files?.[0];

    if(!file) return;

    const scene=scenes.find(
        s=>s.id===sceneId
    );

    if(!scene) return;

    /*
      DATA URL kullanıyoruz.
      Böylece UI yeniden oluşturulsa bile
      görsel DOM'dan bağımsız olarak sahnenin
      kendi state'inde kalıyor.
    */

    const reader=new FileReader();

    reader.onload=()=>{

        scene.imageData=reader.result;
        scene.imageName=file.name;

        /*
          Cache de scene.id ile tutuluyor.
        */

        imageCache.set(
            scene.id,
            reader.result
        );

        selectedSceneId=scene.id;

        renderAll();

        setStatus(
            "Sahne "+(scenes.indexOf(scene)+1)+
            " görseli yüklendi."
        );
    };

    reader.readAsDataURL(file);
}

function removeImage(sceneId){

    const scene=scenes.find(
        s=>s.id===sceneId
    );

    if(!scene) return;

    scene.imageData=null;
    scene.imageName="";

    imageCache.delete(sceneId);

    renderAll();

    setStatus("Sahne görseli silindi.");
}

/* =========================================================
   AUDIO
   ========================================================= */

function handleAudioUpload(event,sceneId){

    const file=event.target.files?.[0];

    if(!file) return;

    const scene=scenes.find(
        s=>s.id===sceneId
    );

    if(!scene) return;

    const reader=new FileReader();

    reader.onload=()=>{

        scene.audioData=reader.result;
        scene.audioName=file.name;

        audioCache.set(
            scene.id,
            reader.result
        );

        const audio=new Audio();

        audio.src=reader.result;

        audio.onloadedmetadata=()=>{

            if(
                isFinite(audio.duration) &&
                audio.duration>0
            ){
                scene.audioDuration=audio.duration;
            }

            renderAll();

            setStatus(
                "Ses yüklendi • "+
                formatTime(scene.audioDuration)
            );
        };
    };

    reader.readAsDataURL(file);
}

function removeAudio(sceneId){

    const scene=scenes.find(
        s=>s.id===sceneId
    );

    if(!scene) return;

    scene.audioData=null;
    scene.audioName="";
    scene.audioDuration=5;

    audioCache.delete(sceneId);

    renderAll();
}

/* =========================================================
   SCENE OPERATIONS
   ========================================================= */

function addScene(){

    const scene=createScene(
        "Yeni sahne"
    );

    scene.prompt=generatePrompt(
        scene.text,
        scenes.length
    );

    scenes.push(scene);

    selectedSceneId=scene.id;

    renderAll();
}

function deleteScene(sceneId){

    const index=scenes.findIndex(
        s=>s.id===sceneId
    );

    if(index<0) return;

    scenes.splice(index,1);

    imageCache.delete(sceneId);
    audioCache.delete(sceneId);

    if(selectedSceneId===sceneId){

        selectedSceneId=
            scenes[index]?.id ||
            scenes[index-1]?.id ||
            null;
    }

    renderAll();
}

function duplicateScene(sceneId){

    const index=scenes.findIndex(
        s=>s.id===sceneId
    );

    if(index<0) return;

    const original=scenes[index];

    const copy={
        ...original,

        id:uid(),

        /*
          Görsel ve ses bilinçli şekilde kopyalanıyor.
          Yeni sahne yine kendi state'ine sahip.
        */

        imageData:original.imageData,
        imageName:original.imageName,
        audioData:original.audioData,
        audioName:original.audioName
    };

    scenes.splice(index+1,0,copy);

    selectedSceneId=copy.id;

    renderAll();
}

function moveScene(sceneId,direction){

    const index=scenes.findIndex(
        s=>s.id===sceneId
    );

    if(index<0) return;

    const target=index+direction;

    if(target<0 || target>=scenes.length)
        return;

    const temp=scenes[index];

    scenes[index]=scenes[target];
    scenes[target]=temp;

    selectedSceneId=sceneId;

    renderAll();
}

/* =========================================================
   UPDATE
   ========================================================= */

function updateScene(sceneId,key,value){

    const scene=scenes.find(
        s=>s.id===sceneId
    );

    if(!scene) return;

    scene[key]=value;

    if(key==="character" ||
       key==="camera" ||
       key==="atmosphere"){
        scene.prompt=generatePrompt(
            scene.text,
            scenes.indexOf(scene)
        );
    }

    renderScenes();
    renderTimeline();
    drawFrame();
}

function changeDuration(sceneId,value){

    const scene=scenes.find(
        s=>s.id===sceneId
    );

    if(!scene) return;

    scene.audioDuration=parseFloat(value)||5;

    renderScenes();
    renderTimeline();
}

/* =========================================================
   PROMPT
   ========================================================= */

function generateScenePrompt(sceneId){

    const scene=scenes.find(
        s=>s.id===sceneId
    );

    if(!scene) return;

    scene.prompt=generatePrompt(
        scene.text,
        scenes.indexOf(scene)
    );

    const director=analyzeScene(
        scene.text
    );

    scene.character=director.character;
    scene.camera=director.camera;
    scene.atmosphere=director.atmosphere;
    scene.transition=director.transition;

    renderInspector();
    drawFrame();
}

/* =========================================================
   AI DIRECTOR
   ========================================================= */

function autoDirector(){

    if(!scenes.length){

        alert("Önce hikâyeyi sahnelere böl.");

        return;
    }

    scenes.forEach((scene,index)=>{

        const d=analyzeScene(
            scene.text
        );

        scene.character=d.character;
        scene.camera=d.camera;
        scene.atmosphere=d.atmosphere;
        scene.transition=d.transition;

        scene.prompt=generatePrompt(
            scene.text,
            index
        );
    });

    renderAll();

    setStatus(
        "AI Yönetmen tüm sahneleri analiz etti."
    );
}

/* =========================================================
   TIMELINE
   ========================================================= */

function renderTimeline(){

    const track=document.getElementById(
        "timelineTrack"
    );

    track.innerHTML="";

    let total=0;

    scenes.forEach((scene,index)=>{

        const duration=scene.audioDuration||5;

        total+=duration;

        const item=document.createElement("div");

        item.className=
            "timeline-item"+
            (scene.id===selectedSceneId ? " active":"");

        item.style.width=
            Math.max(95,duration*35)+"px";

        if(scene.imageData){

            const img=document.createElement("img");

            img.src=scene.imageData;

            item.appendChild(img);
        }

        const overlay=document.createElement("div");

        overlay.className="timeline-overlay";

        overlay.innerHTML=
            `<span>S${index+1}</span>
             <span>${formatTime(duration)}</span>`;

        item.appendChild(overlay);

        item.onclick=()=>{
            selectedSceneId=scene.id;
            renderAll();
        };

        track.appendChild(item);
    });

    document.getElementById(
        "timelineInfo"
    ).textContent=
        formatTime(total);
}

/* =========================================================
   CANVAS RATIO
   ========================================================= */

function changeRatio(){

    const ratio=
        document.getElementById("ratio").value;

    if(ratio==="16:9"){

        canvas.width=1280;
        canvas.height=720;

    }else if(ratio==="9:16"){

        canvas.width=720;
        canvas.height=1280;

    }else{

        canvas.width=1000;
        canvas.height=1000;
    }

    drawFrame();
}

/* =========================================================
   IMAGE LOADING
   ========================================================= */

function getImage(scene){

    if(!scene || !scene.imageData)
        return null;

    if(imageCache.has(scene.id)){

        return imageCache.get(scene.id);
    }

    const img=new Image();

    img.onload=()=>{
        imageCache.set(
            scene.id,
            img
        );
        drawFrame();
    };

    img.src=scene.imageData;

    imageCache.set(
        scene.id,
        img
    );

    return img;
}

/* =========================================================
   CANVAS DRAW
   ========================================================= */

function drawFrame(time=0){

    const scene=getSelected();

    if(!scene){

        ctx.fillStyle="#05070a";
        ctx.fillRect(
            0,0,
            canvas.width,
            canvas.height
        );

        ctx.fillStyle="#6d7788";
        ctx.font="24px Arial";
        ctx.textAlign="center";
        ctx.fillText(
            "Bir sahne seç",
            canvas.width/2,
            canvas.height/2
        );

        return;
    }

    drawScene(
        scene,
        time
    );
}

function drawScene(scene,time){

    const W=canvas.width;
    const H=canvas.height;

    ctx.clearRect(
        0,0,W,H
    );

    const img=getImage(scene);

    if(img && img.complete){

        const iw=img.naturalWidth;
        const ih=img.naturalHeight;

        if(iw && ih){

            const scale=Math.max(
                W/iw,
                H/ih
            );

            const baseW=iw*scale;
            const baseH=ih*scale;

            let zoom=1;

            const t=(time%10000)/10000;

            if(scene.camera==="slow_zoom"){
                zoom=1+0.08*t;
            }

            if(scene.camera==="slow_push"){
                zoom=1+0.12*t;
            }

            if(scene.camera==="pull_back"){
                zoom=1.12-0.12*t;
            }

            if(scene.camera==="handheld"){
                zoom=1.04;
            }

            const dw=baseW*zoom;
            const dh=baseH*zoom;

            let x=(W-dw)/2;
            let y=(H-dh)/2;

            if(scene.camera==="pan_left"){
                x=(W-dw)/2-(W*.10*t);
            }

            if(scene.camera==="pan_right"){
                x=(W-dw)/2+(W*.10*t);
            }

            if(scene.camera==="tilt_up"){
                y=(H-dh)/2-(H*.08*t);
            }

            if(scene.camera==="tilt_down"){
                y=(H-dh)/2+(H*.08*t);
            }

            if(scene.camera==="orbit"){
                x=(W-dw)/2+
                    Math.sin(t*Math.PI*2)*
                    W*.04;
            }

            if(scene.camera==="handheld"){

                x+=(Math.random()-.5)*7;
                y+=(Math.random()-.5)*7;
            }

            ctx.drawImage(
                img,
                x,y,dw,dh
            );

        }else{
            drawPlaceholder(scene);
        }

    }else{
        drawPlaceholder(scene);
    }

    drawAtmosphere(
        scene,
        time
    );

    drawCharacterMotion(
        scene,
        time
    );

    drawSubtitle(
        scene
    );

    drawCinematicBars();
}

function drawPlaceholder(scene){

    const W=canvas.width;
    const H=canvas.height;

    const g=ctx.createLinearGradient(
        0,0,W,H
    );

    g.addColorStop(0,"#111827");
    g.addColorStop(1,"#05070b");

    ctx.fillStyle=g;
    ctx.fillRect(
        0,0,W,H
    );

    ctx.fillStyle="#667085";
    ctx.font=
        Math.max(18,W*.022)+"px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        "GÖRSEL YÜKLE",
        W/2,
        H/2
    );
}

/* =========================================================
   ATMOSPHERE
   ========================================================= */

function drawAtmosphere(scene,time){

    const W=canvas.width;
    const H=canvas.height;

    if(scene.atmosphere==="none")
        return;

    if(scene.atmosphere==="dark"){

        const g=ctx.createRadialGradient(
            W/2,H/2,0,
            W/2,H/2,
            Math.max(W,H)*.7
        );

        g.addColorStop(0,
            "rgba(0,0,0,.05)");

        g.addColorStop(1,
            "rgba(0,0,0,.65)");

        ctx.fillStyle=g;

        ctx.fillRect(
            0,0,W,H
        );
    }

    if(scene.atmosphere==="fog"){

        ctx.fillStyle=
            "rgba(220,230,240,.09)";

        for(let i=0;i<8;i++){

            const x=
                (Math.sin(time*.0002+i)*.5+.5)*W;

            const y=
                H*(.2+i*.09);

            ctx.beginPath();

            ctx.ellipse(
                x,
                y,
                W*.22,
                H*.06,
                0,0,Math.PI*2
            );

            ctx.fill();
        }
    }

    if(scene.atmosphere==="smoke"){

        ctx.fillStyle=
            "rgba(180,180,180,.10)";

        for(let i=0;i<12;i++){

            const x=
                (i*127+time*.025)%W;

            const y=
                H*.7-
                ((time*.02+i*60)%H)*.4;

            ctx.beginPath();

            ctx.arc(
                x,y,
                20+i*2,
                0,
                Math.PI*2
            );

            ctx.fill();
        }
    }

    if(
        scene.atmosphere==="rain"
    ){

        ctx.strokeStyle=
            "rgba(170,210,255,.45)";

        ctx.lineWidth=1;

        for(let i=0;i<90;i++){

            const x=
                (i*73+
                 time*.5)%W;

            const y=
                (i*97+
                 time*1.2)%H;

            ctx.beginPath();

            ctx.moveTo(
                x,y
            );

            ctx.lineTo(
                x-5,y+18
            );

            ctx.stroke();
        }
    }

    if(
        scene.atmosphere==="snow"
    ){

        ctx.fillStyle=
            "rgba(255,255,255,.8)";

        for(let i=0;i<70;i++){

            const x=
                (i*83+
                 Math.sin(time*.001+i)*20)%W;

            const y=
                (i*61+
                 time*.05)%H;

            ctx.beginPath();

            ctx.arc(
                x,y,
                2+(i%3),
                0,
                Math.PI*2
            );

            ctx.fill();
        }
    }

    if(
        scene.atmosphere==="dust"
    ){

        ctx.fillStyle=
            "rgba(220,190,130,.28)";

        for(let i=0;i<60;i++){

            const x=
                (i*97+
                 time*.03)%W;

            const y=
                (i*43+
                 time*.015)%H;

            ctx.fillRect(
                x,y,2,2
            );
        }
    }

    if(
        scene.atmosphere==="fire"
    ){

        ctx.fillStyle=
            "rgba(255,170,60,.22)";

        for(let i=0;i<35;i++){

            const x=
                W*.15+
                ((i*71+
                  time*.03)%(
                    W*.7
                  ));

            const y=
                H*.8-
                ((i*37+
                  time*.08)%(
                    H*.55
                  ));

            ctx.beginPath();

            ctx.arc(
                x,y,
                2+(i%4),
                0,
                Math.PI*2
            );

            ctx.fill();
        }
    }
}

/* =========================================================
   CHARACTER MOTION
   ========================================================= */

function drawCharacterMotion(scene,time){

    /*
      Gerçek AI karakter animasyonu değildir.
      Buradaki hareket mevcut görsel üzerinde
      sinematik hareket katmanıdır.
    */

    if(scene.character==="none")
        return;

    const W=canvas.width;
    const H=canvas.height;

    let amount=0;

    if(scene.character==="walk")
        amount=Math.sin(time*.004)*4;

    if(scene.character==="talk")
        amount=Math.sin(time*.009)*2;

    if(scene.character==="sit")
        amount=Math.sin(time*.002)*1;

    if(scene.character==="stand")
        amount=Math.sin(time*.003)*2;

    if(scene.character==="turn")
        amount=Math.sin(time*.004)*5;

    if(scene.character==="door")
        amount=Math.sin(time*.002)*3;

    if(scene.character==="object")
        amount=Math.sin(time*.006)*3;

    ctx.save();

    ctx.globalAlpha=.18;

    ctx.fillStyle="#fff";

    ctx.beginPath();

    ctx.ellipse(
        W*.5+amount,
        H*.82,
        W*.12,
        H*.015,
        0,0,Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}

/* =========================================================
   SUBTITLE
   ========================================================= */

function drawSubtitle(scene){

    if(!scene.subtitle)
        return;

    const W=canvas.width;
    const H=canvas.height;

    const text=scene.subtitle;

    ctx.save();

    ctx.textAlign="center";

    const fontSize=
        Math.max(
            20,
            Math.floor(W*.025)
        );

    ctx.font=
        `bold ${fontSize}px Arial`;

    const maxWidth=W*.82;

    const words=text.split(/\s+/);

    const lines=[];

    let line="";

    words.forEach(word=>{

        const test=
            line ? line+" "+word : word;

        if(
            ctx.measureText(test).width >
            maxWidth
        ){

            lines.push(line);
            line=word;

        }else{

            line=test;
        }
    });

    if(line)
        lines.push(line);

    const lineHeight=
        fontSize*1.3;

    const total=
        lines.length*lineHeight;

    const yStart=
        H-total-45;

    ctx.fillStyle=
        "rgba(0,0,0,.62)";

    const boxW=
        Math.min(
            W*.9,
            Math.max(
                200,
                ...lines.map(
                    l=>ctx.measureText(l).width
                )
            )+40
        );

    ctx.fillRect(
        W/2-boxW/2,
        yStart-14,
        boxW,
        total+22
    );

    ctx.fillStyle="#fff";

    lines.forEach((line,i)=>{

        ctx.fillText(
            line,
            W/2,
            yStart+
            i*lineHeight+
            fontSize
        );
    });

    ctx.restore();
}

/* =========================================================
   CINEMATIC BARS
   ========================================================= */

function drawCinematicBars(){

    const W=canvas.width;
    const H=canvas.height;

    const bar=
        Math.max(
            0,
            H*.035
        );

    ctx.fillStyle="#000";

    ctx.fillRect(
        0,0,W,bar
    );

    ctx.fillRect(
        0,H-bar,W,bar
    );
}

/* =========================================================
   PLAYBACK
   ========================================================= */

function playPreview(){

    if(!scenes.length)
        return;

    if(playing)
        return;

    playing=true;

    currentSceneIndex=
        Math.max(
            0,
            scenes.findIndex(
                s=>s.id===selectedSceneId
            )
        );

    sceneStartTime=
        performance.now();

    startAudioForScene(
        scenes[currentSceneIndex]
    );

    animate();
}

function pausePreview(){

    playing=false;

    if(animationId)
        cancelAnimationFrame(
            animationId
        );

    stopAudio();

    setStatus("Duraklatıldı");
}

function stopPreview(){

    playing=false;

    if(animationId)
        cancelAnimationFrame(
            animationId
        );

    stopAudio();

    currentSceneIndex=0;

    if(scenes[0])
        selectedSceneId=scenes[0].id;

    renderAll();

    setStatus("Durduruldu");
}

function previewScene(sceneId){

    selectedSceneId=sceneId;

    renderAll();

    playing=false;

    if(animationId)
        cancelAnimationFrame(
            animationId
        );

    currentSceneIndex=
        scenes.findIndex(
            s=>s.id===sceneId
        );

    if(currentSceneIndex<0)
        currentSceneIndex=0;

    playing=true;

    sceneStartTime=
        performance.now();

    startAudioForScene(
        scenes[currentSceneIndex]
    );

    animate();
}

function animate(now){

    if(!playing)
        return;

    if(!now)
        now=performance.now();

    const scene=
        scenes[currentSceneIndex];

    if(!scene){

        stopPreview();

        return;
    }

    const elapsed=
        (now-sceneStartTime)/1000;

    const duration=
        scene.audioDuration||5;

    drawScene(
        scene,
        now
    );

    setStatus(
        "Sahne "+
        (currentSceneIndex+1)+
        " / "+
        scenes.length+
        " • "+
        formatTime(elapsed)+
        " / "+
        formatTime(duration)
    );

    if(elapsed>=duration){

        currentSceneIndex++;

        if(
            currentSceneIndex>=scenes.length
        ){

            playing=false;

            stopAudio();

            setStatus(
                "Video önizlemesi tamamlandı."
            );

            return;
        }

        selectedSceneId=
            scenes[currentSceneIndex].id;

        sceneStartTime=now;

        startAudioForScene(
            scenes[currentSceneIndex]
        );

        renderScenes();
        renderTimeline();
        renderInspector();
    }

    animationId=
        requestAnimationFrame(
            animate
        );
}

/* =========================================================
   AUDIO ENGINE
   ========================================================= */

let activeAudio=null;

function startAudioForScene(scene){

    stopAudio();

    if(!scene.audioData)
        return;

    activeAudio=new Audio(
        scene.audioData
    );

    activeAudio.currentTime=0;

    activeAudio.play()
        .catch(()=>{});
}

function stopAudio(){

    if(activeAudio){

        activeAudio.pause();

        activeAudio.currentTime=0;

        activeAudio=null;
    }
}

/* =========================================================
   EXPORT
   ========================================================= */

async function exportVideo(){

    if(!scenes.length){

        alert("Önce sahne oluştur.");

        return;
    }

    if(!window.MediaRecorder){

        alert(
            "Tarayıcınız MediaRecorder desteklemiyor."
        );

        return;
    }

    pausePreview();

    const fps=
        parseInt(
            document.getElementById("fps").value
        )||30;

    const stream=
        canvas.captureStream(fps);

    let recorder;

    try{

        recorder=
            new MediaRecorder(
                stream,
                {
                    mimeType:"video/webm;codecs=vp9"
                }
            );

    }catch(e){

        recorder=
            new MediaRecorder(
                stream
            );
    }

    const chunks=[];

    recorder.ondataavailable=e=>{

        if(e.data.size)
            chunks.push(e.data);
    };

    recorder.onstop=()=>{

        const blob=
            new Blob(
                chunks,
                {type:"video/webm"}
            );

        const url=
            URL.createObjectURL(blob);

        const a=
            document.createElement("a");

        a.href=url;
        a.download=
            "mina-video-ai-v15.webm";

        document.body.appendChild(a);

        a.click();

        a.remove();

        setTimeout(
            ()=>URL.revokeObjectURL(url),
            5000
        );

        setStatus(
            "Video hazırlandı."
        );
    };

    recorder.start();

    let i=0;

    const renderExportScene=()=>{

        if(i>=scenes.length){

            recorder.stop();

            return;
        }

        const scene=scenes[i];

        selectedSceneId=scene.id;

        const duration=
            scene.audioDuration||5;

        const start=
            performance.now();

        const loop=(now)=>{

            const elapsed=
                (now-start)/1000;

            drawScene(
                scene,
                now
            );

            setStatus(
                "Video oluşturuluyor • Sahne "+
                (i+1)+
                "/"+
                scenes.length
            );

            if(elapsed>=duration){

                i++;

                renderExportScene();

            }else{

                requestAnimationFrame(
                    loop
                );
            }
        };

        requestAnimationFrame(
            loop
        );
    };

    renderExportScene();
}

/* =========================================================
   UTILS
   ========================================================= */

function option(value,label,current){

    return `
        <option value="${value}"
            ${value===current?"selected":""}>
            ${label}
        </option>
    `;
}

function formatTime(sec){

    sec=parseFloat(sec)||0;

    const m=Math.floor(sec/60);

    const s=Math.floor(sec%60);

    return String(m).padStart(2,"0")+
        ":"+
        String(s).padStart(2,"0");
}

function escapeHTML(str){

    return String(str||"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function setStatus(text){

    document.getElementById(
        "status"
    ).textContent=text;
}

/* =========================================================
   INIT
   ========================================================= */

function init(){

    /*
      İlk açılışta 10 sahne oluşturuyoruz.
      Kullanıcı isterse Hikâye butonundan
      yeniden sahne oluşturabilir.
    */

    const paragraphs=
        initialStory
        .split(/\n+/)
        .map(x=>x.trim())
        .filter(Boolean);

    const count=10;

    const per=
        paragraphs.length/count;

    for(let i=0;i<count;i++){

        const start=
            Math.floor(i*per);

        const end=
            Math.floor((i+1)*per);

        const text=
            paragraphs
            .slice(start,end)
            .join(" ");

        const scene=
            createScene(text);

        scene.prompt=
            generatePrompt(
                text,
                i
            );

        const d=
            analyzeScene(text);

        scene.character=d.character;
        scene.camera=d.camera;
        scene.atmosphere=d.atmosphere;
        scene.transition=d.transition;

        scenes.push(scene);
    }

    selectedSceneId=
        scenes[0].id;

    renderAll();
}

init();
