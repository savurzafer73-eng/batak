<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050b08">
<title>Batak Royale X</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,body{
    width:100%;
    min-height:100%;
    background:#030806;
    color:#fff;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

button{
    border:0;
    outline:0;
    cursor:pointer;
    color:inherit;
    font-family:inherit;
}

body{
    overflow-x:hidden;
}

::-webkit-scrollbar{
    width:4px;
}

::-webkit-scrollbar-thumb{
    background:#24543e;
    border-radius:20px;
}


/* =========================================================
   APP
========================================================= */

#app{
    min-height:100vh;
}


/* =========================================================
   HOME
========================================================= */

.royaleHome{
    min-height:100vh;
    position:relative;
    overflow:hidden;
    padding-bottom:100px;

    background:
        radial-gradient(
            circle at 50% -15%,
            #1a5138 0%,
            #0b2619 30%,
            #06130d 58%,
            #030806 100%
        );
}

.homeGlow{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
    filter:blur(75px);
    opacity:.22;
}

.glow1{
    width:360px;
    height:360px;
    background:#00c878;
    top:70px;
    right:-190px;
}

.glow2{
    width:280px;
    height:280px;
    background:#d3aa3e;
    top:500px;
    left:-190px;
}

.homeGrid{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.025;

    background-image:
        linear-gradient(
            rgba(255,255,255,.8) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.8) 1px,
            transparent 1px
        );

    background-size:42px 42px;
}


/* HEADER */

.royaleHeader{
    height:74px;
    padding:
        10px
        max(13px,calc((100vw - 1180px)/2));

    display:flex;
    align-items:center;
    justify-content:space-between;

    position:relative;
    z-index:20;

    background:
        linear-gradient(
            rgba(3,10,7,.94),
            rgba(3,10,7,.72)
        );

    border-bottom:
        1px solid
        rgba(255,255,255,.055);

    backdrop-filter:blur(18px);
}

.brandArea{
    display:flex;
    align-items:center;
    gap:10px;
}

.brandMark{
    width:43px;
    height:43px;

    display:grid;
    place-items:center;

    border-radius:13px;

    background:
        linear-gradient(
            145deg,
            #20d58a,
            #075b39
        );

    box-shadow:
        0 8px 28px
        rgba(0,200,120,.25);
}

.brandMark span{
    font-family:Georgia,serif;
    font-size:25px;
}

.brandTitle{
    font-size:15px;
    font-weight:1000;
    letter-spacing:1.4px;
}

.brandSub{
    color:#dfbf5b;
    font-size:7px;
    letter-spacing:3px;
    margin-top:2px;
}

.headerActions{
    display:flex;
    align-items:center;
    gap:8px;
}

.headerCoin{
    height:40px;
    padding:0 10px;

    display:flex;
    align-items:center;
    gap:6px;

    border-radius:12px;

    background:
        rgba(255,255,255,.055);

    border:
        1px solid
        rgba(255,255,255,.08);

    color:#f3d16a;

    font-size:12px;
    font-weight:800;
}

.headerCoin b{
    color:#58dca6;
    font-size:17px;
}

.headerProfile{
    width:43px;
    height:43px;

    position:relative;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #f0d579,
            #795718
        );

    border:
        2px solid
        rgba(255,255,255,.18);
}

.profileAvatar{
    font-size:21px;
}

.onlineDot{
    position:absolute;
    right:-1px;
    bottom:1px;

    width:10px;
    height:10px;

    border-radius:50%;

    background:#1fe08a;
    border:2px solid #07110b;
}


/* CONTENT */

.royaleContent{
    max-width:1180px;
    margin:auto;

    padding:
        18px 18px 120px;

    position:relative;
    z-index:2;
}


/* PROFILE */

.playerStrip{
    min-height:76px;

    padding:10px 14px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;

    border-radius:19px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.022)
        );

    border:
        1px solid
        rgba(255,255,255,.065);

    box-shadow:
        0 15px 35px
        rgba(0,0,0,.16);
}

.playerIdentity{
    display:flex;
    align-items:center;
    gap:11px;
}

.bigAvatar{
    width:50px;
    height:50px;

    display:grid;
    place-items:center;

    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            #f1d77b,
            #76551c
        );

    font-size:24px;
}

.playerName{
    font-size:14px;
    font-weight:900;
}

.verified{
    display:inline-grid;
    place-items:center;

    width:14px;
    height:14px;

    border-radius:50%;

    background:#11b875;

    font-size:9px;
}

.playerLevel{
    margin-top:4px;

    color:#d9b95a;

    font-size:8px;
    letter-spacing:1.3px;
    font-weight:900;
}

.levelProgress{
    width:min(300px,42%);
}

.xpLabels{
    display:flex;
    justify-content:space-between;

    color:#8fa79e;

    font-size:8px;
    margin-bottom:5px;
}

.premiumXP{
    height:7px;

    border-radius:10px;

    background:#06100b;

    overflow:hidden;
}

.premiumXP div{
    height:100%;

    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            #08a967,
            #f1c957
        );

    box-shadow:
        0 0 13px
        rgba(30,210,130,.35);
}


/* HERO */

.royaleHero{
    min-height:350px;

    margin-top:15px;

    position:relative;
    overflow:hidden;

    border-radius:28px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        radial-gradient(
            circle at 78% 50%,
            rgba(31,174,111,.28),
            transparent 30%
        ),
        linear-gradient(
            125deg,
            #173f2d,
            #0a1b13 60%,
            #07100c
        );

    box-shadow:
        0 25px 60px
        rgba(0,0,0,.32);
}

.heroTexture{
    position:absolute;
    inset:0;
    opacity:.045;

    background:
        repeating-linear-gradient(
            45deg,
            #fff 0,
            #fff 1px,
            transparent 1px,
            transparent 10px
        );
}

.heroLeft{
    position:relative;
    z-index:5;

    padding:42px;

    max-width:610px;
}

.seasonBadge{
    display:inline-flex;
    align-items:center;
    gap:7px;

    padding:7px 10px;

    border-radius:999px;

    background:
        rgba(220,182,71,.12);

    border:
        1px solid
        rgba(220,182,71,.27);

    color:#e9ca65;

    font-size:8px;
    letter-spacing:1.5px;
    font-weight:900;
}

.seasonBadge span:last-child{
    color:#fff;
}

.seasonDot{
    width:6px;
    height:6px;
    border-radius:50%;

    background:#2de193;

    box-shadow:
        0 0 10px
        #2de193;
}

.royaleHero h1{
    margin-top:20px;

    font-size:
        clamp(40px,6vw,68px);

    line-height:.86;

    letter-spacing:-2.5px;

    font-weight:1000;
}

.royaleHero h1 strong{
    display:block;

    color:#e9c75d;

    text-shadow:
        0 8px 30px
        rgba(235,198,80,.15);
}

.royaleHero p{
    max-width:470px;

    margin-top:17px;

    color:#a8c0b6;

    font-size:13px;
    line-height:1.55;
}

.heroButtons{
    display:flex;
    align-items:center;
    gap:9px;
    margin-top:24px;
}

.royalePlay{
    min-height:56px;

    padding:0 14px;

    display:flex;
    align-items:center;
    gap:10px;

    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            #17c77d,
            #07804e
        );

    box-shadow:
        0 13px 30px
        rgba(0,180,105,.25);

    transition:.2s;
}

.royalePlay:active{
    transform:scale(.97);
}

.royalePlay span:nth-child(2){
    display:flex;
    flex-direction:column;
    text-align:left;

    font-size:12px;
}

.royalePlay small{
    margin-top:2px;

    color:#b9ead3;

    font-size:7px;
    letter-spacing:1px;
}

.royalePlay b{
    font-size:22px;
}

.playTriangle{
    font-size:17px;
}

.heroSecondary{
    height:56px;

    padding:0 15px;

    border-radius:15px;

    background:
        rgba(255,255,255,.06);

    border:
        1px solid
        rgba(255,255,255,.09);

    font-size:9px;
    letter-spacing:.7px;
}

.heroCards{
    position:absolute;

    right:4%;
    top:50%;

    width:350px;
    height:290px;

    transform:translateY(-50%);
}

.floatingCard{
    position:absolute;

    width:108px;
    height:154px;

    padding:9px;

    display:flex;
    flex-direction:column;
    justify-content:space-between;

    border-radius:11px;

    background:
        linear-gradient(
            145deg,
            #fff,
            #e0e0e0
        );

    color:#111;

    font-family:Georgia,serif;

    font-size:23px;
    font-weight:900;

    box-shadow:
        0 20px 35px
        rgba(0,0,0,.4);

    border:1px solid #aaa;
}

.floatingCard span{
    text-align:center;
    font-size:63px;
}

.redSuit{
    color:#c71928;
}

.fc1{
    left:40px;
    top:58px;
    transform:rotate(-18deg);
}

.fc2{
    left:108px;
    top:24px;
    transform:rotate(-4deg);
    z-index:2;
}

.fc3{
    left:176px;
    top:50px;
    transform:rotate(14deg);
    z-index:3;
}

.heroChip{
    position:absolute;

    right:18px;
    bottom:24px;

    padding:8px 12px;

    border-radius:8px;

    background:
        rgba(4,12,8,.8);

    border:
        1px solid
        rgba(225,190,79,.3);

    color:#dfbf59;

    font-size:8px;
    letter-spacing:2px;
}


/* STATS */

.quickStats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
    margin-top:12px;
}

.quickStat{
    min-height:70px;

    padding:12px;

    display:flex;
    align-items:center;
    gap:10px;

    border-radius:16px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.055);
}

.qsIcon{
    width:37px;
    height:37px;

    display:grid;
    place-items:center;

    border-radius:11px;

    background:
        rgba(216,184,83,.09);

    font-size:17px;
}

.quickStat b{
    display:block;
    font-size:18px;
}

.quickStat small{
    display:block;

    margin-top:2px;

    color:#819a90;

    font-size:7px;
    letter-spacing:.7px;
}


/* SECTION */

.sectionHeader{
    display:flex;
    align-items:end;
    justify-content:space-between;

    margin:
        28px 2px 12px;
}

.sectionHeader span{
    color:#809b90;

    font-size:8px;
    letter-spacing:1.5px;
}

.sectionHeader h2{
    margin-top:4px;
    font-size:20px;
}

.sectionHeader button{
    background:none;
    color:#d7b957;

    font-size:9px;
    font-weight:900;
}


/* MODES */

.royaleModes{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:11px;
}

.royaleMode{
    position:relative;
    overflow:hidden;

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            #13241b,
            #09120d
        );

    border:
        1px solid
        rgba(255,255,255,.065);

    cursor:pointer;

    transition:
        transform .2s,
        border-color .2s;
}

.royaleMode:hover{
    transform:translateY(-5px);

    border-color:
        rgba(210,177,75,.3);
}

.modeRibbon{
    position:absolute;

    top:10px;
    left:10px;

    z-index:5;

    padding:5px 7px;

    border-radius:6px;

    background:#0ca967;

    color:#fff;

    font-size:7px;
    font-weight:1000;
}

.modeVisual{
    height:145px;

    position:relative;
    overflow:hidden;

    display:grid;
    place-items:center;

    background:
        radial-gradient(
            circle,
            rgba(31,173,109,.2),
            transparent 65%
        );
}

.miniTable{
    position:absolute;

    width:130px;
    height:80px;

    border-radius:50%;

    background:#0e5538;

    border:7px solid #422914;

    box-shadow:
        0 15px 30px
        rgba(0,0,0,.5);
}

.miniCard{
    position:absolute;

    width:52px;
    height:72px;

    padding:5px;

    border-radius:6px;

    background:#fff;
    color:#111;

    font-family:Georgia,serif;

    font-size:12px;

    box-shadow:
        0 7px 15px
        rgba(0,0,0,.5);
}

.mc1{
    transform:
        translate(-25px,-4px)
        rotate(-12deg);
}

.mc2{
    transform:
        translate(0,-9px);
    z-index:2;
}

.mc3{
    transform:
        translate(27px,-1px)
        rotate(12deg);
    z-index:3;
}

.redCard{
    color:#c71928;
}

.pairVisual{
    background:
        radial-gradient(
            circle,
            rgba(94,157,231,.18),
            transparent 65%
        );
}

.pairAvatar{
    font-size:55px;

    filter:
        drop-shadow(
            0 12px 20px
            rgba(0,0,0,.45)
        );
}

.spadeVisual{
    background:
        radial-gradient(
            circle,
            rgba(150,65,190,.22),
            transparent 65%
        );
}

.hugeSuit{
    font-size:90px;

    color:#fff;

    text-shadow:
        0 10px 35px
        rgba(0,0,0,.5);
}

.buriedVisual{
    background:
        radial-gradient(
            circle,
            rgba(211,169,55,.15),
            transparent 65%
        );
}

.buriedCards{
    display:flex;
    align-items:center;
}

.buriedCards span{
    font-size:60px;

    margin-left:-25px;

    filter:
        drop-shadow(
            0 10px 15px
            rgba(0,0,0,.5)
        );
}

.buriedCards span:first-child{
    margin-left:0;
}

.modeInfo{
    padding:13px 14px 15px;
}

.modeTopLine{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modeNumber{
    color:#d7b957;
    font-size:8px;
    font-weight:900;
}

.modePlayers{
    color:#70897e;
    font-size:7px;
}

.modeInfo h3{
    margin-top:7px;
    font-size:15px;
}

.modeInfo p{
    margin-top:5px;

    min-height:34px;

    color:#839b91;

    font-size:9px;
    line-height:1.4;
}

.modeInfo button{
    margin-top:11px;

    width:100%;
    height:34px;

    border-radius:9px;

    background:
        rgba(255,255,255,.055);

    color:#d9bd5d;

    font-size:8px;
}

.modeInfo button b{
    float:right;
    font-size:15px;
}


/* DAILY */

.dailyPanel{
    min-height:105px;

    margin-top:13px;
    padding:15px 17px;

    display:flex;
    align-items:center;
    gap:13px;

    border-radius:19px;

    background:
        radial-gradient(
            circle at 10% 50%,
            rgba(221,183,64,.15),
            transparent 35%
        ),
        linear-gradient(
            120deg,
            #201b0d,
            #11160f
        );

    border:
        1px solid
        rgba(216,183,75,.15);
}

.dailyIcon{
    width:55px;
    height:55px;

    display:grid;
    place-items:center;

    border-radius:16px;

    background:
        rgba(218,181,67,.1);

    font-size:28px;
}

.dailyTitle{
    color:#d9b957;

    font-size:8px;
    letter-spacing:1.5px;
}

.dailyText h3{
    margin-top:4px;
    font-size:14px;
}

.dailyText p{
    margin-top:3px;

    color:#8b9e96;
    font-size:9px;
}

.dailyReward{
    margin-left:auto;

    display:flex;
    align-items:center;
    gap:8px;
}

.dailyReward div{
    color:#e9c95f;

    font-size:14px;
    font-weight:900;
}

.dailyReward button{
    height:38px;

    padding:0 17px;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            #e4bd50,
            #8d681c
        );

    color:#171108;

    font-size:9px;
}


/* MISSIONS */

.missionGrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
}

.mission{
    min-height:87px;

    padding:11px;

    display:flex;
    align-items:center;
    gap:9px;

    border-radius:15px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.05);
}

.missionIcon{
    width:35px;
    height:35px;

    display:grid;
    place-items:center;

    border-radius:10px;

    background:
        rgba(14,171,105,.1);

    color:#d7b954;
    font-size:16px;
}

.missionBody{
    flex:1;
}

.missionBody b{
    display:block;
    font-size:10px;
}

.missionBody small{
    color:#789188;
    font-size:7px;
}

.missionProgress{
    height:4px;

    margin:
        7px 0 3px;

    border-radius:10px;

    background:#06100c;

    overflow:hidden;
}

.missionProgress span{
    display:block;
    height:100%;
    background:#0db16d;
}

.mission>strong{
    color:#d9bd59;
    font-size:9px;
}


/* SEASON */

.seasonPanel{
    min-height:145px;

    margin-top:13px;

    display:flex;
    align-items:center;

    position:relative;
    overflow:hidden;

    border-radius:20px;

    background:
        linear-gradient(
            125deg,
            #172d22,
            #09120e
        );

    border:
        1px solid
        rgba(255,255,255,.065);
}

.seasonArtwork{
    width:180px;
    height:145px;

    position:relative;

    display:grid;
    place-items:center;

    background:
        radial-gradient(
            circle,
            rgba(21,183,112,.25),
            transparent 65%
        );
}

.seasonNumber{
    position:absolute;

    left:15px;
    top:13px;

    color:#d6b852;

    font-size:9px;
    letter-spacing:2px;
}

.seasonSuit{
    font-size:90px;
    color:#fff;

    text-shadow:
        0 15px 35px
        rgba(0,0,0,.45);
}

.seasonInfo{
    padding:20px 15px;
    flex:1;
}

.seasonInfo>span{
    color:#7f988e;
    font-size:7px;
    letter-spacing:1.5px;
}

.seasonInfo h2{
    margin-top:5px;
    font-size:20px;
}

.seasonInfo p{
    margin-top:5px;
    color:#8ca49a;
    font-size:9px;
}

.seasonProgress{
    margin-top:12px;
    max-width:400px;
}

.seasonProgressTop{
    display:flex;
    justify-content:space-between;

    color:#81988f;

    font-size:7px;

    margin-bottom:5px;
}

.seasonBar{
    height:6px;

    border-radius:10px;

    background:#06100b;

    overflow:hidden;
}

.seasonBar span{
    display:block;
    height:100%;

    background:
        linear-gradient(
            90deg,
            #0aaa68,
            #e5c35b
        );
}

.seasonButton{
    width:43px;
    height:43px;

    margin-right:18px;

    border-radius:13px;

    background:
        rgba(255,255,255,.06);

    font-size:20px;

    color:#dfc15c;
}


/* BOTTOM */

.bottomNav{
    position:fixed;

    left:50%;
    bottom:10px;

    transform:translateX(-50%);

    width:min(620px,94vw);
    height:67px;

    z-index:100;

    display:grid;
    grid-template-columns:repeat(5,1fr);
    align-items:center;

    padding:5px 9px;

    border-radius:21px;

    background:
        rgba(5,13,9,.94);

    border:
        1px solid
        rgba(255,255,255,.09);

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.55);

    backdrop-filter:blur(18px);
}

.navItem{
    height:55px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;");
}

        document.querySelector(".toast");

    if(!el){

        el =
            document.createElement("div");

        el.className="toast";

        document.body.appendChild(el);

    }

    el.textContent=message;

    el.classList.add("show");

let audioCtx = null;

function sound(type="click"){

    if(!profile.sound) return;

    try{

        if(!audioCtx){

            audioCtx =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        const osc =
            audioCtx.createOscillator();

        const gain =
            audioCtx.createGain();

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        let frequency=500;

        if(type==="card")
            frequency=650;

        if(type==="win")
            frequency=850;

        if(type==="coin")
            frequency=1000;

        osc.frequency.value=frequency;

        gain.gain.setValueAtTime(
            .0001,
            audioCtx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .08,
            audioCtx.currentTime+.01
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            audioCtx.currentTime+.12
        );

        osc.start();
        osc.stop(
            audioCtx.currentTime+.13
        );

    }catch(e){}
}

/* =========================================================

========================================================= */

function checkLevel(){

    const required =
        profile.level * 150;

    if(profile.xp >= required){

        profile.xp -= required;
        profile.level++;

        profile.coins+=500;

        sound("win");

        toast(
            "🎉 Seviye atladın! +" +
            "500 coin"
        );
    }
}

/* =========================================================
   CARD ENGINE
========================================================= */

function createDeck(){

    const deck=[];

    suits.forEach(suit=>{

        ranks.forEach((rank,index)=>{

            deck.push({
                suit:suit.key,
                symbol:suit.symbol,
                red:suit.red,
                rank,
                value:index+2
            });

        });

    });

    return deck;
}

function shuffle(deck){

    for(let i=deck.length-1;i>0;i--){

        const j=
            Math.floor(
                Math.random()*(i+1)
            );

        [
            deck[i],
            deck[j]
        ]=[
            deck[j],
            deck[i]
        ];
    }

    return deck;
}

function cardHTML(card){

    if(!card) return "";

    return `

        <div
            class="
                card
                ${card.red ? "red" : ""}
            "
            onclick="playCard(${card.index})">

            <div class="cardCorner">

                <span class="rank">
                    ${card.rank}
                </span>

                <span class="suit">
                    ${card.symbol}
                </span>

            </div>


            <div class="cardCenter">
                ${card.symbol}
            </div>


            <div class="cardBottomCorner">

                <span class="rank">
                    ${card.rank}
                </span>

                <span class="suit">
                    ${card.symbol}
                </span>

            </div>

        </div>
    `;
}


/* =========================================================
   GAME
========================================================= */

function startGame(mode){

    sound("click");

    const deck =
        shuffle(createDeck());

    const players=[
        {
            name:"Zafer",
            avatar:"👑",
            hand:[],
            tricks:0
        },
        {
            name:"Ahmet",
            avatar:"🤵",
            hand:[],
            tricks:0
        },
        {
            name:"Mehmet",
            avatar:"😎",
            hand:[],
            tricks:0
        },
        {
            name:"Ali",
            avatar:"🧔",
            hand:[],
            tricks:0
        }
    ];


    for(let i=0;i<52;i++){

        players[i%4]
            .hand
            .push(deck[i]);

    }


    players.forEach(player=>{

        player.hand.sort(
            (a,b)=>{
                if(a.suit===b.suit)
                    return b.value-a.value;

                return (
                    suits.findIndex(
                        x=>x.key===b.suit
                    )
                    -
                    suits.findIndex(
                        x=>x.key===a.suit
                    )
                );
            }
        );

    });


    game={
        mode,
        players,
        trump:
            mode==="spades"
            ? "spades"
            : null,

        leadSuit:null,

        turn:0,

        trick:[],

        trickNumber:1,

        bidder:null,

        bid:null,

        started:Date.now(),

        over:false
    };


    renderGame();
}

/* =========================================================
   SUIT
========================================================= */

function suitByKey(key){

    return suits.find(
        s=>s.key===key
    );
}


/* =========================================================
   LEGAL CARD
========================================================= */

function isLegal(
    card,
    player
){

    if(!game.leadSuit)
        return true;

    const hasLead =
        player.hand.some(
            c=>c.suit===game.leadSuit
        );

    if(hasLead)
        return card.suit===game.leadSuit;

    if(
        game.trump &&
        card.suit===game.trump
    ){

        return true;
    }

    return true;
}


/* =========================================================
   PLAYER MOVE
========================================================= */

function playCard(index){

    if(!game) return;

    if(game.turn!==0){

        toast("Sıra rakipte");

        return;
    }

    const player=
        game.players[0];

    const card=
        player.hand[index];

    if(!card) return;

    if(!isLegal(card,player)){

        toast(
            "Yere atılan renkten kartın varsa onu oynamalısın"
        );

        return;
    }

    makeMove(
        0,
        index
    );
}


/* =========================================================
   MAKE MOVE
========================================================= */

function makeMove(
    playerIndex,
    handIndex
){

    const player=
        game.players[playerIndex];

    const card=
        player.hand.splice(
            handIndex,
            1
        )[0];

    if(!game.leadSuit){

        game.leadSuit=
            card.suit;
    }

    game.trick.push({
        player:playerIndex,
        card
    });

    sound("card");

    if(game.trick.length===4){

        setTimeout(
            resolveTrick,
            500
        );

        renderGame();

        return;
    }

    game.turn=
        (game.turn+1)%4;

    renderGame();
}


/* =========================================================
   AI
========================================================= */

function aiTurn(){

    if(!game || game.over)
        return;

    if(game.turn===0)
        return;

    const player=
        game.players[game.turn];

    if(!player.hand.length)
        return;

    const legal =
        player.hand.filter(
            c=>isLegal(c,player)
        );

    let selected;


    /* First player */
    if(game.trick.length===0){

        selected =
            chooseLeadCard(
                player,
                legal
            );

    }else{

        selected =
            chooseAICard(
                player,
                legal
            );

    }


    const index =
        player.hand.indexOf(
            selected
        );

    makeMove(
        game.turn,
        index
    );
}


/* =========================================================
   AI LEAD
========================================================= */

function chooseLeadCard(
    player,
    legal
){

    const nonTrump =
        legal.filter(
            c=>c.suit!==game.trump
        );

    const source =
        nonTrump.length
        ? nonTrump
        : legal;

    /*
       Akıllı bot:
       mümkün olduğunca küçük kart
       oynayarak yüksek kartları korur.
    */

    return [...source]
        .sort(
            (a,b)=>
                a.value-b.value
        )[0];
}


/* =========================================================
   AI RESPONSE
========================================================= */

function chooseAICard(
    player,
    legal
){

    const winners =
        legal.filter(
            cardCanWin
        );


    if(winners.length){

        /*
          Eğer eli kazanabilecek
          düşük maliyetli kart varsa
          onu kullan.
        */

        return [...winners]
            .sort(
                (a,b)=>
                    a.value-b.value
            )[0];
    }


    /*
      Eli kazanamıyorsa en düşük
      değeri bırak.
    */

    return [...legal]
        .sort(
            (a,b)=>
                a.value-b.value
        )[0];
}


/* =========================================================
   CARD WIN
========================================================= */

function cardCanWin(card){

    if(!game.trick.length)
        return true;

    const currentWinner =
        winningCard(
            game.trick
        );

    if(!currentWinner)
        return true;

    return beats(
        card,
        currentWinner.card
    );
}


/* =========================================================
   COMPARE
========================================================= */

function beats(
    a,
    b
){

    if(
        a.suit===game.trump &&
        b.suit!==game.trump
    )
        return true;

    if(
        a.suit!==game.trump &&
        b.suit===game.trump
    )
        return false;

    if(
        a.suit!==b.suit
    )
        return false;

    return a.value>b.value;
}


/* =========================================================
   WINNING CARD
========================================================= */

function winningCard(
    trick
){

    if(!trick.length)
        return null;

    let winner=
        trick[0];

    for(let i=1;i<trick.length;i++){

        if(
            beats(
                trick[i].card,
                winner.card
            )
        ){

            winner=
                trick[i];

        }

    }

    return winner;
}


/* =========================================================
   RESOLVE TRICK
========================================================= */

function resolveTrick(){

    if(!game) return;

    const winner=
        winningCard(
            game.trick
        );

    game.players[
        winner.player
    ].tricks++;

    sound("win");

    const winnerName=
        game.players[
            winner.player
        ].name;


    toast(
        winnerName +
        " eli aldı"
    );


    setTimeout(()=>{

        game.trick=[];

        game.leadSuit=null;

        game.trickNumber++;


        if(game.trickNumber>13){

            finishGame();

            return;
        }


        game.turn=
            winner.player;

        renderGame();

    },850);
}


/* =========================================================
   END GAME
========================================================= */

function finishGame(){

    game.over=true;

    const scores=
        game.players.map(
            p=>p.tricks
        );

    const winnerIndex=
        scores.indexOf(
            Math.max(...scores)
        );

    const playerScore=
        scores[0];

    const won=
        winnerIndex===0;


    profile.games++;

    if(won)
        profile.wins++;

    profile.xp +=
        won ? 45 : 15;

    profile.coins +=
        won ? 150 : 40;


    if(
        game.bid &&
        game.bid>profile.bestBid
    ){

        profile.bestBid=
            game.bid;
    }


    checkLevel();

    saveProfile();

    showGameResult(
        winnerIndex,
        scores
    );
}


/* =========================================================
   RESULT
========================================================= */

function showGameResult(
    winnerIndex,
    scores
){

    const names=
        game.players.map(
            p=>p.name
        );

    const overlay=
        document.createElement(
            "div"
        );

    overlay.className="overlay";

    overlay.innerHTML=`

        <div class="modal">

            <h2>
                ${
                    winnerIndex===0
                    ? "🏆 ZAFER!"
                    : "🏁 EL TAMAMLANDI"
                }
            </h2>

            <p>
                ${names[winnerIndex]}
                bu eli kazandı.
            </p>


            <div class="profileStats">

                ${game.players
                    .map(
                        (p,i)=>`

                        <div class="profileStat">

                            <span>
                                ${p.name}
                            </span>

                            <b>
                                ${scores[i]} EL
                            </b>

                        </div>

                        `
                    )
                    .join("")}

            </div>


            <button
                class="modalButton"
                style="
                    width:100%;
                    margin-top:15px;
                "
                onclick="
                    this.closest('.overlay').remove();
                    renderHome();
                ">

                ANA MENÜ

            </button>


            <button
                class="modalButton"
                style="
                    width:100%;
                    margin-top:8px;
                "
                onclick="
                    this.closest('.overlay').remove();
                    startGame('${game.mode}');
                ">

                TEKRAR OYNA

            </button>

        </div>
    `;

    document.body.appendChild(
        overlay
    );
}


/* =========================================================
   EXIT
========================================================= */

function confirmExit(){

    const overlay=
        document.createElement(
            "div"
        );

    overlay.className="overlay";

    overlay.innerHTML=`

        <div class="modal">

            <h2>
                Oyundan çık?
            </h2>

            <p>
                Mevcut el kaydedilmeyecek.
            </p>


            <div
                style="
                display:grid;
                grid-template-columns:1fr 1fr;
                gap:8px;
                margin-top:18px;
                ">

                <button
                    class="modalButton"
                    onclick="
                        this.closest('.overlay').remove();
                    ">

                    DEVAM ET

                </button>


                <button
                    class="modalButton"
                    onclick="
                        this.closest('.overlay').remove();
                        game=null;
                        renderHome();
                    ">

                    ÇIK

                </button>

            </div>

        </div>
    `;

    document.body.appendChild(
        overlay
    );
}


/* =========================================================
   SOUND TOGGLE
========================================================= */

function toggleSound(){

    profile.sound=
        !profile.sound;

    saveProfile();

    renderGame();

    toast(
        profile.sound
        ? "🔊 Ses açıldı"
        : "🔇 Ses kapatıldı"
    );
}


/* =========================================================
   INIT
========================================================= */

renderHome();

</script>
