<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mina Video AI V47.1 — GeldStory Studio</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0b0b0d;
  color:#eee;
  font-family:Arial,Helvetica,sans-serif;
}

header{
  background:linear-gradient(135deg,#111,#1d1d22);
  padding:18px;
  border-bottom:1px solid #333;
  position:sticky;
  top:0;
  z-index:20;
}

header h1{
  margin:0 0 6px;
  font-size:24px;
}

header p{
  margin:0;
  color:#aaa;
  font-size:13px;
}

.container{
  max-width:1450px;

  padding:18px;
}

.panel{
  background:#151518;
  border:1px solid #2d2d32;
  border-radius:14px;
  padding:16px;
  margin-bottom:16px;
}

textarea{
  width:100%;
  min-height:190px;
  resize:vertical;
  background:#09090b;
  color:#fff;
  border:1px solid #38383f;
  border-radius:10px;
  padding:14px;
  font-size:15px;

}

textarea:focus{
  border-color:#777;
}

button,
select,
input[type="range"]{
  font-family:inherit;
}

button{
  background:#24242a;
  color:#fff;
  border:1px solid #444;
  border-radius:9px;
  padding:10px 14px;
  cursor:pointer;
  transition:.15s;
}

button:hover{
  background:#33333a;
}

button.primary{
  background:#eee;
  color:#111;
  border-color:#eee;
  font-weight:bold;
}

button.danger{
  background:#38171b;
  border-color:#65252d;
}

button.green{
  background:#17351f;
  border-color:#2d7040;
}

button.subtitle-on{
  background:#194b2b;
  border-color:#4ca667;
}

button.subtitle-off{
  background:#29292f;
}

.toolbar{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  align-items:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field label{
  color:#aaa;
  font-size:12px;
}

select{
  width:100%;
  padding:10px;
  background:#0c0c0f;
  color:#fff;
  border:1px solid #3a3a42;
  border-radius:8px;
}

.status{
  background:#0b0b0d;
  border:1px solid #303038;
  border-radius:10px;
  padding:12px;
  color:#bbb;
  font-size:13px;
  margin-top:10px;
}

#scenes{
  display:flex;
  flex-direction:column;
  gap:16px;
}

.scene{
  background:#151518;
  border:1px solid #303038;
  border-radius:15px;
  overflow:hidden;
}

.sceneHead{
  padding:13px 15px;
  background:#1b1b20;
  border-bottom:1px solid #303038;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.sceneTitle{
  font-weight:bold;
}

.sceneTools{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.sceneBody{
  padding:15px;
}

.sceneText{
  min-height:110px;
}

.promptBox{
  margin-top:10px;
  background:#0a0a0c;
  border:1px solid #2e2e35;
  border-radius:10px;
  padding:10px;
}

.promptBox textarea{
  min-height:120px;
  font-size:13px;
}

.sceneGrid{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:15px;
  margin-top:14px;
}

.imageArea{
  background:#09090b;
  border:1px dashed #444;
  border-radius:12px;
  min-height:260px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
}

.imageArea img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.noImage{
  color:#666;
  text-align:center;
  padding:30px;
}

.imageButtons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.audioBox{
  margin-top:12px;
  background:#0b0b0d;
  border:1px solid #303038;
  border-radius:10px;
  padding:12px;
}

audio{
  width:100%;
  margin-top:8px;
}

.meta{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.small{
  color:#888;
  font-size:12px;
}

.subtitleControl{
  margin-top:12px;
  padding:12px;
  background:#101014;
  border:1px solid #303038;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.subtitleInfo{
  font-size:13px;
}

.previewPanel{
  position:sticky;
  bottom:10px;
  z-index:10;
}

#previewCanvas{
  display:block;
  width:100%;
  max-height:650px;
  background:#000;
  border-radius:12px;
  border:1px solid #333;
}

.renderProgress{
  margin-top:10px;
  height:12px;
  background:#08080a;
  border-radius:20px;
  overflow:hidden;
  border:1px solid #333;
}

#progressBar{
  width:0%;
  height:100%;
  background:#ddd;
  transition:.15s;
}

#progressText{
  margin-top:7px;
  font-size:13px;
  color:#aaa;
}

.hidden{
  display:none !important;
}

@media(max-width:950px){
  .grid{
    grid-template-columns:1fr 1fr;
  }

  .sceneGrid{
    grid-template-columns:1fr;
  }
}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>🎬 Mina Video AI V47.1 — GeldStory Studio</h1>
  <p>Almanca gerçek hikâyeler • Görsel • Seslendirme • Hareket • WebM</p>
</header>

<div class="container">

  <!-- STORY -->
  <section class="panel">

    <h2>📖 Hikâye</h2>

    <textarea id="story"
      placeholder="Almanca hikâyeni buraya yapıştır..."></textarea>

    <div class="toolbar" style="margin-top:10px">

      <button class="primary" id="createScenesBtn">

      </button>

      <button id="clearStoryBtn">

      </button>

    </div>

    <div class="status" id="storyStatus">

    </div>

  </section>


  <!-- SETTINGS -->
  <section class="panel">

    <h2>⚙️ Video Ayarları</h2>

    <div class="grid">

      <div class="field">
        <label>Format</label>
        <select id="format">
          <option value="16:9">16:9 YouTube</option>
          <option value="9:16">9:16 Shorts</option>

      </div>

      <div class="field">
        <label>FPS</label>
        <select id="fps">
          <option value="24">24 FPS</option>
          <option value="30" selected>30 FPS</option>
        </select>
      </div>

      <div class="field">
        <label>Almanca Ses</label>
        <select id="voice">
          <option value="de_DE-thorsten-medium">
            Thorsten Medium
          </option>
          <option value="de_DE-thorsten-high">
            Thorsten High
          </option>
        </select>
      </div>

      <div class="field">
        <label>Varsayılan hareket</label>
        <select id="defaultMotion">
          <option value="zoomIn">Zoom In</option>
          <option value="zoomOut">Zoom Out</option>
          <option value="panLeft">Pan Left</option>
          <option value="panRight">Pan Right</option>
          <option value="panUp">Pan Up</option>
          <option value="panDown">Pan Down</option>

          <option value="static">Sabit</option>
        </select>

    </div>

    <div class="toolbar" style="margin-top:14px">

      <button id="testTtsBtn">
        🔊 TEST ALMANCA SES
      </button>

      <button class="primary" id="renderBtn">
        🎥 VİDEOYU RENDER ET
      </button>

    </div>

    <div id="ttsStatus" class="status">

    </div>

  </section>


  <!-- SCENES -->

  <section class="panel">

    <h2>🎞️ Sahneler</h2>

    <div id="scenes"></div>

  </section>


  <!-- PREVIEW -->

  <section class="panel previewPanel">

    <h2>👁 Önizleme</h2>

    <canvas id="previewCanvas"></canvas>

    <div class="toolbar" style="margin-top:10px">

      <button id="prevSceneBtn">
        ◀ Önceki
      </button>

      <button id="playPreviewBtn">
        ▶ Önizle
      </button>

      <button id="stopPreviewBtn">
        ⏹ Durdur
      </button>

      <button id="nextSceneBtn">
        Sonraki ▶
      </button>

    </div>

    <div class="renderProgress">
      <div id="progressBar"></div>
    </div>

    <div id="progressText">
      Render bekleniyor.
    </div>

    <div id="downloadArea"></div>

  </section>

</div>


<script>
"use strict";

/* =========================================================
   GLOBAL STATE
========================================================= */

let scenes = [];
let sceneCounter = 1;

let currentSceneIndex = 0;

let ttsModule = null;
let ttsSession = null;

let previewTimer = null;
let previewAudio = null;

let renderBlob = null;

const $ = id => document.getElementById(id);


/* =========================================================
   STORY SPLITTER
========================================================= */

function splitSentences(text){

  return text
    .replace(/\r/g," ")
    .replace(/\n+/g," ")
    .replace(/\s+/g," ")
    .trim()
    .match(
      /[^.!?…]+[.!?…]+(?=\s|$)|[^.!?…]+$/g
    ) || [];
}


function cleanSentence(text){

  return text
    .replace(/\s+/g," ")
    .trim();
}


/* =========================================================
   VISUAL PROMPT
========================================================= */

function createImagePrompt(text,index){

  const clean = text
    .replace(/"/g,"'")
    .trim();

  return `Cinematic realistic documentary scene for a German success story,
based directly on this moment:

"${clean}"

Visualize the exact situation described in the narration.

Realistic human emotions,
natural facial expressions,
authentic environment,
believable clothing,
historically appropriate details,
cinematic composition,
dramatic but natural lighting,
photorealistic photography,
realistic skin texture,
high detail,
shallow depth of field,
professional documentary film still,
subtle film grain,
atmospheric background,
strong storytelling composition,
16:9 cinematic frame,
no text,
no subtitles,
no logos,
no watermark.`;
}


/* =========================================================
   CREATE SCENES
========================================================= */

function createScenes(){

  const story = $("story").value.trim();

  if(!story){

    $("storyStatus").textContent =
      "❌ Önce hikâyeyi gir.";

    return;
  }

  const sentences = splitSentences(story);

  if(!sentences.length){

    $("storyStatus").textContent =
      "❌ Hikâyede cümle bulunamadı.";

    return;
  }

  scenes = [];
  sceneCounter = 1;

  /*
    İKİ CÜMLE = 1 SAHNE
  */

  for(let i=0;i<sentences.length;i+=2){

    const a = cleanSentence(sentences[i] || "");
    const b = cleanSentence(sentences[i+1] || "");

    const textPart = [a,b]
      .filter(Boolean)
      .join(" ");

    scenes.push({

      id:sceneCounter++,

      text:textPart,

      subtitle:textPart,

      /*
        YENİ:
        ALTYAZI BAŞLANGIÇTA KAPALI
      */
      subtitleEnabled:false,

      prompt:createImagePrompt(
        textPart,
        scenes.length+1
      ),

      image:null,
      imageURL:null,
      imageObject:null,

      audio:null,
      audioURL:null,

      duration:4,

      motion:$("defaultMotion").value,

      ttsState:"Hazır"

    });
  }

  currentSceneIndex = 0;

  renderScenes();

  $("storyStatus").textContent =
    `✅ ${scenes.length} sahne oluşturuldu.`;

  if(scenes.length){

    drawScene(
      scenes[0],
      0,
      $("previewCanvas")
    );

  }
}


/* =========================================================
   RENDER SCENE UI
========================================================= */

function renderScenes(){

  const container = $("scenes");

  container.innerHTML = "";

  scenes.forEach((scene,index)=>{

    const div = document.createElement("div");

    div.className = "scene";

    div.dataset.index = index;

    div.innerHTML = `

      <div class="sceneHead">

        <div class="sceneTitle">
          🎬 Sahne ${index+1}
        </div>

        <div class="sceneTools">

          <button
            class="subtitleBtn ${
              scene.subtitleEnabled
              ? "subtitle-on"
              : "subtitle-off"
            }"
            data-action="subtitle"
          >
            ${
              scene.subtitleEnabled
              ? "💬 ALTYAZI: AÇIK"
              : "💬 ALTYAZI: KAPALI"
            }
          </button>

          <button data-action="duplicate">
            📋 Kopyala
          </button>

          <button
            class="danger"
            data-action="delete"
          >
            🗑 Sil
          </button>

        </div>

      </div>


      <div class="sceneBody">

        <label class="small">
          Sahne metni
        </label>

        <textarea
          class="sceneText"
          data-field="text"
        >${escapeHtml(scene.text)}</textarea>


        <div class="promptBox">

          <div class="small">
            🎨 Görsel Prompt
          </div>

          <textarea
            data-field="prompt"
          >${escapeHtml(scene.prompt)}</textarea>

          <div class="toolbar" style="margin-top:8px">

            <button data-action="copyPrompt">
              📋 PROMPT KOPYALA
            </button>

            <button data-action="regenPrompt">
              🔄 PROMPT YENİLE
            </button>

          </div>

        </div>


        <div class="subtitleControl">

          <div class="subtitleInfo">

            <strong>
              💬 Sahne Altyazısı
            </strong>

            <br>

            <span class="small">
              Görselde zaten yazı varsa kapalı bırakabilirsin.
            </span>

          </div>

          <button
            class="subtitleBtn ${
              scene.subtitleEnabled
              ? "subtitle-on"
              : "subtitle-off"
            }"
            data-action="subtitle"
          >
            ${
              scene.subtitleEnabled
              ? "ALTYAZIYI KALDIR"
              : "ALTYAZIYI EKLE"
            }
          </button>

        </div>


        <div class="sceneGrid">

          <div>

            <div class="imageArea">

              ${
                scene.imageURL
                ?
                `<img
                   src="${scene.imageURL}"
                   alt="Sahne ${index+1}"
                 >`
                :
                `<div class="noImage">
                   🖼️<br>
                   Bu sahne için görsel yüklenmedi.
                 </div>`
              }

            </div>

            <div class="imageButtons">

              <label>
                <input
                  type="file"
                  accept="image/*"
                  class="imageInput hidden"
                >

                <button
                  type="button"
                  class="uploadImageButton"
                >
                  🖼️ GÖRSEL YÜKLE
                </button>

              </label>

              <button data-action="removeImage">
                ❌ GÖRSELİ KALDIR
              </button>

            </div>

          </div>


          <div>

            <div class="audioBox">

              <strong>
                🔊 Seslendirme
              </strong>

              <div class="small">
                ${escapeHtml(scene.ttsState)}
              </div>

              <div class="toolbar" style="margin-top:8px">

                <button
                  class="green"
                  data-action="tts"
                >
                  🎙️ SESLENDİR VE KAYDET
                </button>

                ${
                  scene.audioURL
                  ?
                  `
                  <a
                    href="${scene.audioURL}"
                    download="GeldStory_Sahne_${index+1}.wav"
                  >
                    <button type="button">
                      ⬇️ WAV İNDİR
                    </button>
                  </a>
                  `
                  :
                  ""
                }

              </div>

              ${
                scene.audioURL
                ?
                `
                <audio
                  controls
                  src="${scene.audioURL}"
                ></audio>

                <div class="small">
                  Süre:
                  ${scene.duration.toFixed(2)} saniye
                </div>
                `
                :
                `
                <div class="small" style="margin-top:8px">
                  Henüz seslendirme oluşturulmadı.
                </div>
                `
              }

            </div>


            <div class="meta">

              <div class="field">

                <label>
                  Hareket
                </label>

                <select data-field="motion">

                  <option value="zoomIn"
                    ${scene.motion==="zoomIn"?"selected":""}>
                    Zoom In
                  </option>

                  <option value="zoomOut"
                    ${scene.motion==="zoomOut"?"selected":""}>
                    Zoom Out
                  </option>

                  <option value="panLeft"
                    ${scene.motion==="panLeft"?"selected":""}>
                    Pan Left
                  </option>

                  <option value="panRight"
                    ${scene.motion==="panRight"?"selected":""}>
                    Pan Right
                  </option>

                  <option value="panUp"
                    ${scene.motion==="panUp"?"selected":""}>
                    Pan Up
                  </option>

                  <option value="panDown"
                    ${scene.motion==="panDown"?"selected":""}>
                    Pan Down
                  </option>

                  <option value="kenBurns"
                    ${scene.motion==="kenBurns"?"selected":""}>
                    Ken Burns
                  </option>

                  <option value="static"
                    ${scene.motion==="static"?"selected":""}>
                    Sabit
                  </option>

                </select>

              </div>


              <div class="field">

                <label>
                  Süre
                </label>

                <input
                  type="range"
                  min="2"
                  max="30"
                  step="0.1"
                  value="${scene.duration}"
                  data-field="duration"
                  ${scene.audioURL ? "disabled":""}
                >

                <div class="small durationLabel">
                  ${scene.duration.toFixed(1)} sn
                  ${
                    scene.audioURL
                    ? " • Ses süresi"
                    : ""
                  }
                </div>

              </div>

            </div>

          </div>

        </div>

      </div>
    `;

    container.appendChild(div);

    bindScene(div,index);

  });
}


/* =========================================================
   SCENE EVENTS
========================================================= */

function bindScene(div,index){

  const scene = scenes[index];

  const textArea =
    div.querySelector('[data-field="text"]');

  textArea.addEventListener("input",()=>{

    scene.text = textArea.value;

    scene.subtitle = textArea.value;

  });


  const promptArea =
    div.querySelector('[data-field="prompt"]');

  promptArea.addEventListener("input",()=>{

    scene.prompt = promptArea.value;

  });


  const motion =
    div.querySelector('[data-field="motion"]');

  motion.addEventListener("change",()=>{

    scene.motion = motion.value;

  });


  const duration =
    div.querySelector('[data-field="duration"]');

  duration.addEventListener("input",()=>{

    scene.duration =
      parseFloat(duration.value);

    const label =
      div.querySelector(".durationLabel");

    if(label){

      label.textContent =
        scene.duration.toFixed(1)+" sn";

    }

  });


  /*
    YENİ ALTYAZI BUTONU
  */

  div.querySelectorAll(
    '[data-action="subtitle"]'
  ).forEach(btn=>{

    btn.addEventListener("click",()=>{

      scene.subtitleEnabled =
        !scene.subtitleEnabled;

      renderScenes();

      currentSceneIndex = index;

      drawScene(
        scene,
        0,
        $("previewCanvas")
      );

    });

  });


  const imageInput =
    div.querySelector(".imageInput");

  const uploadBtn =
    div.querySelector(".uploadImageButton");

  uploadBtn.addEventListener("click",()=>{

    imageInput.click();

  });


  imageInput.addEventListener("change",async e=>{

    const file =
      e.target.files[0];

    if(!file) return;

    if(scene.imageURL){

      URL.revokeObjectURL(scene.imageURL);

    }

    scene.image = file;

    scene.imageURL =
      URL.createObjectURL(file);

    scene.imageObject =
      await loadImage(scene.imageURL);

    renderScenes();

    currentSceneIndex = index;

    drawScene(
      scene,
      0,
      $("previewCanvas")
    );

  });


  div.querySelector(
    '[data-action="removeImage"]'
  ).addEventListener("click",()=>{

    if(scene.imageURL){

      URL.revokeObjectURL(
        scene.imageURL
      );

    }

    scene.image = null;
    scene.imageURL = null;
    scene.imageObject = null;

    renderScenes();

  });


  div.querySelector(
    '[data-action="copyPrompt"]'
  ).addEventListener("click",async()=>{

    try{

      await navigator.clipboard.writeText(
        scene.prompt
      );

      alert("✅ Prompt kopyalandı.");

    }catch(e){

      prompt(
        "Prompt:",
        scene.prompt
      );

    }

  });


  div.querySelector(
    '[data-action="regenPrompt"]'
  ).addEventListener("click",()=>{

    scene.prompt =
      createImagePrompt(
        scene.text,
        index+1
      );

    renderScenes();

  });


  div.querySelector(
    '[data-action="tts"]'
  ).addEventListener("click",()=>{

    generateSceneTTS(index);

  });


  div.querySelector(
    '[data-action="duplicate"]'
  ).addEventListener("click",()=>{

    const copy =
      JSON.parse(
        JSON.stringify({
          ...scene,
          image:null,
          imageURL:null,
          imageObject:null,
          audio:null,
          audioURL:null
        })
      );

    copy.id =
      sceneCounter++;

    copy.ttsState =
      "Hazır";

    scenes.splice(
      index+1,
      0,
      copy
    );

    renderScenes();

  });


  div.querySelector(
    '[data-action="delete"]'
  ).addEventListener("click",()=>{

    if(!confirm(
      `Sahne ${index+1} silinsin mi?`
    )) return;

    if(scene.imageURL){

      URL.revokeObjectURL(
        scene.imageURL
      );

    }

    if(scene.audioURL){

      URL.revokeObjectURL(
        scene.audioURL
      );

    }

    scenes.splice(index,1);

    currentSceneIndex =
      Math.max(
        0,
        Math.min(
          currentSceneIndex,
          scenes.length-1
        )
      );

    renderScenes();

    if(scenes.length){

      drawScene(
        scenes[currentSceneIndex],
        0,
        $("previewCanvas")
      );

    }

  });

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   IMAGE LOADER
========================================================= */

function loadImage(url){

  return new Promise((resolve,reject)=>{

    const img =
      new Image();

    img.onload=()=>{
      resolve(img);
    };

    img.onerror=reject;

    img.src=url;

  });

}


/* =========================================================
   TTS MODULE
========================================================= */

async function loadTTS(){

  if(ttsModule){

    return ttsModule;

  }

  $("ttsStatus").textContent =
    "⏳ Almanca ses sistemi yükleniyor...";

  ttsModule =
    await import(
      "https://cdn.jsdelivr.net/npm/@realtimex/piper-tts-web@1.1.1/+esm"
    );

  return ttsModule;

}


/* =========================================================
   AUDIO DURATION
========================================================= */

function getAudioDuration(url){

  return new Promise((resolve,reject)=>{

    const audio =
      new Audio();

    audio.preload="metadata";

    audio.onloadedmetadata=()=>{

      if(
        Number.isFinite(audio.duration)
      ){

        resolve(audio.duration);

      }else{

        reject(
          new Error(
            "Ses süresi okunamadı."
          )
        );

      }

    };

    audio.onerror=()=>{

      reject(
        new Error(
          "Ses dosyası okunamadı."
        )
      );

    };

    audio.src=url;

  });

}


/* =========================================================
   GENERATE TTS
========================================================= */

async function generateSceneTTS(index){

  const scene =
    scenes[index];

  if(!scene || !scene.text.trim()){

    alert(
      "Bu sahnede metin yok."
    );

    return;

  }

  scene.ttsState =
    "⏳ Ses oluşturuluyor...";

  renderScenes();

  try{

    const tts =
      await loadTTS();

    const voice =
      $("voice").value;


    /*
      TTS SESSION
    */

    if(tts.TtsSession){

      if(
        !ttsSession ||
        ttsSession.voiceId !== voice
      ){

        ttsSession =
          new tts.TtsSession({

            voiceId:voice,

            allowLocalModels:true,

            fallbackStrategy:"auto",

            progress:p=>{

              if(typeof p === "number"){

                scene.ttsState =
                  "⏳ Ses: "+
                  Math.round(p*100)+
                  "%";

                renderScenes();

              }

            },

            logger:message=>{

              console.log(
                "Piper:",
                message
              );

            }

          });

        ttsSession.voiceId =
          voice;

      }


      const wav =
        await ttsSession.predict(
          scene.text.trim()
        );

      scene.audio =
        wav;

      if(scene.audioURL){

        URL.revokeObjectURL(
          scene.audioURL
        );

      }

      scene.audioURL =
        URL.createObjectURL(wav);

    }

    /*
      FALLBACK API
    */

    else if(tts.predict){

      const wav =
        await tts.predict({

          text:
            scene.text.trim(),

          voiceId:
            voice

        });

      scene.audio =
        wav;

      if(scene.audioURL){

        URL.revokeObjectURL(
          scene.audioURL
        );

      }

      scene.audioURL =
        URL.createObjectURL(wav);

    }

    else{

      throw new Error(
        "TTS motoru bulunamadı."
      );

    }


    /*
      SES SÜRESİ = SAHNE SÜRESİ
    */

    scene.duration =
      await getAudioDuration(
        scene.audioURL
      );

    scene.ttsState =
      "✅ Ses hazır";

    renderScenes();

    $("ttsStatus").textContent =
      `✅ Sahne ${index+1} seslendirildi. `+
      `Süre: ${scene.duration.toFixed(2)} sn`;

  }catch(error){

    console.error(error);

    scene.ttsState =
      "❌ Seslendirme hatası";

    renderScenes();

    $("ttsStatus").textContent =
      "❌ "+error.message;

    alert(
      "Sahne "+(index+1)+
      " seslendirme hatası:\n\n"+
      error.message
    );

  }

}

/* =========================================================
   CANVAS SIZE
========================================================= */

function getCanvasSize(){

  const format =
    $("format").value;

  if(format==="9:16"){

    return {
      width:720,
      height:1280
    };

  }

  if(format==="1:1"){

    return {
      width:1080,
      height:1080
    };

  }

  return {
    width:1280,
    height:720
  };

}


/* =========================================================
   DRAW IMAGE COVER
========================================================= */

function drawImageCover(
  ctx,
  img,
  x,
  y,
  w,
  h,
  scale,
  offsetX,
  offsetY
){

  const iw =
    img.naturalWidth ||
    img.width;

  const ih =
    img.naturalHeight ||
    img.height;

  if(!iw || !ih){

    return;

  }

  const base =
    Math.max(
      w/iw,
      h/ih
    );

  const dw =
    iw*base*scale;

  const dh =
    ih*base*scale;

  const dx =
    x+(w-dw)/2+
    offsetX;

  const dy =
    y+(h-dh)/2+
    offsetY;

  ctx.drawImage(
    img,
    dx,
    dy,
    dw,
    dh
  );

}


/* =========================================================
   MOTION
========================================================= */

function getMotion(
  motion,
  p,
  w,
  h
){

  let scale=1;
  let ox=0;
  let oy=0;

  switch(motion){

    case "zoomIn":

      scale =
        1+
        p*0.10;

      break;


    case "zoomOut":

      scale =
        1.10-
        p*0.10;

      break;


    case "panLeft":

      scale=1.10;

      ox =
        (p-.5)*w*.12;

      break;


    case "panRight":

      scale=1.10;

      ox =
        (.5-p)*w*.12;

      break;


    case "panUp":

      scale=1.10;

      oy =
        (p-.5)*h*.12;

      break;


    case "panDown":

      scale=1.10;

      oy =
        (.5-p)*h*.12;

      break;


    case "kenBurns":

      scale =
        1+
        p*0.08;

      ox =
        Math.sin(
          p*Math.PI
        )*w*.025;

      oy =
        Math.cos(
          p*Math.PI
        )*h*.018;

      break;


    case "static":

    default:

      scale=1;

      break;

  }

  return {
    scale,
    ox,
    oy
  };

}


/* =========================================================
   SUBTITLE WRAP
========================================================= */

function wrapText(
  ctx,
  text,
  maxWidth
){

  const words =
    text.split(/\s+/);

  const lines=[];

  let line="";

  for(const word of words){

    const test =
      line
      ? line+" "+word
      : word;

    if(
      ctx.measureText(test)
        .width
      <=
      maxWidth
    ){

      line=test;

    }else{

      if(line){

        lines.push(line);

      }

      line=word;

    }

  }

  if(line){

    lines.push(line);

  }

  return lines;

}


/* =========================================================
   DRAW SCENE
========================================================= */

function drawScene(
  scene,
  progress,
  canvas
){

  if(!scene){

    return;

  }

  const size =
    getCanvasSize();

  canvas.width =
    size.width;

  canvas.height =
    size.height;

  const ctx =
    canvas.getContext("2d");

  const w =
    canvas.width;

  const h =
    canvas.height;


  /*
    BACKGROUND
  */

  ctx.fillStyle="#050505";

  ctx.fillRect(
    0,
    0,
    w,
    h
  );


  /*
    IMAGE
  */

  if(scene.imageObject){

    const m =
      getMotion(
        scene.motion,
        progress,
        w,
        h
      );

    drawImageCover(
      ctx,
      scene.imageObject,
      0,
      0,
      w,
      h,
      m.scale,
      m.ox,
      m.oy
    );

  }else{

    /*
      GÖRSEL YOKSA SİYAH
    */

    ctx.fillStyle="#080808";

    ctx.fillRect(
      0,
      0,
      w,
      h
    );

    ctx.fillStyle="#777";

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    ctx.font =
      `${Math.max(24,w*0.025)}px Arial`;

    ctx.fillText(
      "GeldStory",
      w/2,
      h/2
    );

  }


  /*
    KARARTMA
  */

  const gradient =
    ctx.createLinearGradient(
      0,
      h*.60,
      0,
      h
    );

  gradient.addColorStop(
    0,
    "rgba(0,0,0,0)"
  );

  gradient.addColorStop(
    1,
    "rgba(0,0,0,.82)"
  );

  ctx.fillStyle =
    gradient;

  ctx.fillRect(
    0,
    0,
    w,
    h
  );


  /*
    =====================================================
    YENİ ALTYAZI SİSTEMİ
    SADECE subtitleEnabled === true İSE GÖSTER
    =====================================================
  */

  if(
    scene.subtitleEnabled &&
    scene.subtitle
  ){

    const maxWidth =
      w*.82;

    const fontSize =
      Math.max(
        25,
        Math.floor(w*.030)
      );

    ctx.font =
      `bold ${fontSize}px Arial`;

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    const lines =
      wrapText(
        ctx,
        scene.subtitle,
        maxWidth
      );

    const lineHeight =
      fontSize*1.35;

    const boxPadding =
      fontSize*.55;

    const totalHeight =
      lines.length*
      lineHeight+
      boxPadding*2;

    const boxY =
      h-
      totalHeight-
      h*.07;


    /*
      ALTYAZI ARKA PLANI
    */

    ctx.fillStyle =
      "rgba(0,0,0,.68)";

    roundRect(
      ctx,
      w*.09,
      boxY,
      w*.82,
      totalHeight,
      fontSize*.35
    );

    ctx.fill();


    /*
      ALTYAZI
    */

    ctx.fillStyle="#fff";

    lines.forEach(
      (line,i)=>{

        const y =
          boxY+
          boxPadding+
          lineHeight*i+
          lineHeight/2;

        ctx.fillText(
          line,
          w/2,
          y
        );

      }
    );

  }


  /*
    SAHNE NUMARASI
  */

  ctx.textAlign="left";

  ctx.textBaseline="top";

  ctx.font =
    `${Math.max(13,w*.014)}px Arial`;

  ctx.fillStyle =
    "rgba(255,255,255,.72)";

  ctx.fillText(
    "GeldStory",
    w*.025,
    h*.025
  );

}


/* =========================================================
   ROUNDED RECT
========================================================= */

function roundRect(
  ctx,
  x,
  y,
  w,
  h,
  r
){

  ctx.beginPath();

  ctx.moveTo(
    x+r,
    y
  );

  ctx.lineTo(
    x+w-r,
    y
  );

  ctx.quadraticCurveTo(
    x+w,
    y,
    x+w,
    y+r
  );

  ctx.lineTo(
    x+w,
    y+h-r
  );

  ctx.quadraticCurveTo(
    x+w,
    y+h,
    x+w-r,
    y+h
  );

  ctx.lineTo(
    x+r,
    y+h
  );

  ctx.quadraticCurveTo(
    x,
    y+h,
    x,
    y+h-r
  );

  ctx.lineTo(
    x,
    y+r
  );

  ctx.quadraticCurveTo(
    x,
    y,
    x+r,
    y
  );

  ctx.closePath();

}


/* =========================================================
   PREVIEW
========================================================= */

function updatePreview(){

  if(!scenes.length){

    return;

  }

  currentSceneIndex =
    Math.max(
      0,
      Math.min(
        currentSceneIndex,
        scenes.length-1
      )
    );

  drawScene(
    scenes[currentSceneIndex],
    0,
    $("previewCanvas")
  );

}


$("prevSceneBtn")
.addEventListener("click",()=>{

  if(!scenes.length) return;

  stopPreview();

  currentSceneIndex =
    Math.max(
      0,
      currentSceneIndex-1
    );

  updatePreview();

});


$("nextSceneBtn")
.addEventListener("click",()=>{

  if(!scenes.length) return;

  stopPreview();

  currentSceneIndex =
    Math.min(
      scenes.length-1,
      currentSceneIndex+1
    );

  updatePreview();

});


/* =========================================================
   PREVIEW PLAY
========================================================= */

async function playPreview(){

  if(!scenes.length){

    alert(
      "Önce sahneleri oluştur."
    );

    return;

  }

  stopPreview();

  let index =
    currentSceneIndex;

  const canvas =
    $("previewCanvas");

  while(
    index < scenes.length
  ){

    currentSceneIndex =
      index;

    const scene =
      scenes[index];

    const duration =
      Math.max(
        0.5,
        scene.duration || 4
      );

    if(
      scene.audioURL
    ){

      previewAudio =
        new Audio(
          scene.audioURL
        );

      previewAudio.preload="auto";

    }

    const start =
      performance.now();

    let ended=false;

    if(previewAudio){

      previewAudio.onended=()=>{
        ended=true;
      };

      try{

        await previewAudio.play();

      }catch(e){

        console.warn(e);

      }

    }


    while(
      !ended &&
      performance.now()-start
        < duration*1000
    ){

      const elapsed =
        (performance.now()-start)
        /1000;

      const p =
        Math.min(
          1,
          elapsed/duration
        );

      drawScene(
        scene,
        p,
        canvas
      );

      await wait(30);

    }

    if(previewAudio){

      previewAudio.pause();

      previewAudio=null;

    }

    index++;

  }

}


function stopPreview(){

  if(previewTimer){

    cancelAnimationFrame(
      previewTimer
    );

    previewTimer=null;

  }

  if(previewAudio){

    previewAudio.pause();

    previewAudio=null;

  }

}


$("playPreviewBtn")
.addEventListener(
  "click",
  playPreview
);


$("stopPreviewBtn")
.addEventListener(
  "click",
  stopPreview
);


/* =========================================================
   WAIT
========================================================= */

function wait(ms){

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


/* =========================================================
   RENDER VIDEO
========================================================= */

async function renderVideo(){

  if(!scenes.length){

    alert(
      "Önce sahneleri oluştur."
    );

    return;

  }


  /*
    SESLENDİRİLMEMİŞ SAHNELER
  */

  const missingAudio =
    scenes.filter(
      s=>!s.audioURL
    );

  if(missingAudio.length){

    const ok =
      confirm(
        `${missingAudio.length} sahnede seslendirme yok.\n\n`+
        `Yine de render yapılsın mı?`
      );

    if(!ok){

      return;

    }

  }


  /*
    GÖRSELSİZ SAHNELER
  */

  const missingImages =
    scenes.filter(
      s=>!s.imageObject
    );

  if(missingImages.length){

    const ok =
      confirm(
        `${missingImages.length} sahnede görsel yok.\n\n`+
        `Bu sahneler siyah arka planla render edilecek.\n\n`+
        `Devam edilsin mi?`
      );

    if(!ok){

      return;

    }

  }


  const canvas =
    $("previewCanvas");

  const fps =
    parseInt(
      $("fps").value,
      10
    );


  /*
    CANVAS STREAM
  */

  if(
    !canvas.captureStream
  ){

    alert(
      "Tarayıcınız canvas.captureStream desteklemiyor."
    );

    return;

  }

  const videoStream =
    canvas.captureStream(fps);


  /*
    AUDIO CONTEXT
  */

  let audioContext=null;
  let destination=null;

  try{

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    destination =
      audioContext
        .createMediaStreamDestination();

  }catch(error){

    console.error(error);

  }


  /*
    AUDIO MASTER
  */

  let master=null;

  if(audioContext){

    master =
      audioContext.createGain();

    master.gain.value=1;

    master.connect(
      audioContext.destination
    );

    master.connect(
      destination
    );

  }


  /*
    STREAM
  */

  const stream =
    new MediaStream();

  videoStream
    .getVideoTracks()
    .forEach(
      track =>
        stream.addTrack(track)
    );

  if(destination){

    destination
      .stream
      .getAudioTracks()
      .forEach(
        track =>
          stream.addTrack(track)
      );

  }


  /*
    MIME
  */

  const mimeTypes = [

    "video/webm;codecs=vp9,opus",

    "video/webm;codecs=vp8,opus",

    "video/webm"

  ];

  let mimeType="";

  for(
    const type of mimeTypes
  ){

    if(
      MediaRecorder.isTypeSupported(
        type
      )
    ){

      mimeType=type;

      break;

    }

  }


  if(!mimeType){

    alert(
      "WebM MediaRecorder desteği bulunamadı."
    );

    return;

  }


  const chunks=[];


  let recorder;

  try{

    recorder =
      new MediaRecorder(
        stream,
        {
          mimeType,
          videoBitsPerSecond:
            6000000,
          audioBitsPerSecond:
            160000
        }
      );

  }catch(error){

    alert(
      "MediaRecorder başlatılamadı:\n\n"+
      error.message
    );

    return;

  }


  recorder.ondataavailable=e=>{

    if(
      e.data &&
      e.data.size
    ){

      chunks.push(
        e.data
      );

    }

  };


  $("downloadArea").innerHTML="";

  $("progressBar").style.width =
    "0%";

  $("progressText").textContent =
    "🎥 Render hazırlanıyor...";


  const recorderStopped =
    new Promise(
      (resolve,reject)=>{

        recorder.onstop=
          resolve;

        recorder.onerror=
          e=>reject(
            e.error ||
            new Error(
              "MediaRecorder hatası."
            )
          );

      }
    );


  recorder.start(250);


  /*
    AUDIO CONTEXT AKTİF
  */

  if(
    audioContext &&
    audioContext.state==="suspended"
  ){

    try{

      await audioContext.resume();

    }catch(e){}

  }


  /*
    SCENES
  */

  for(
    let i=0;
    i<scenes.length;
    i++
  ){

    const scene =
      scenes[i];

    currentSceneIndex=i;


    /*
      SCENE DURATION
    */

    const duration =
      Math.max(
        0.5,
        Number(
          scene.duration || 4
        )
      );


    /*
      AUDIO
    */

    let audioElement=null;
    let audioSource=null;

    if(
      scene.audioURL &&
      audioContext &&
      master
    ){

      audioElement =
        new Audio();

      audioElement.src =
        scene.audioURL;

      audioElement.preload =
        "auto";

      audioElement.crossOrigin =
        "anonymous";

      try{

        audioSource =
          audioContext
            .createMediaElementSource(
              audioElement
            );

        audioSource.connect(
          master
        );

      }catch(error){

        console.warn(
          "Audio source:",
          error
        );

      }

    }


    /*
      WAIT AUDIO READY
    */

    if(audioElement){

      try{

        await new Promise(
          resolve=>{

            if(
              audioElement.readyState>=2
            ){

              resolve();

              return;

            }

            audioElement.oncanplay=
              resolve;

            audioElement.onerror=
              resolve;

          }
        );

      }catch(e){}

    }


    /*
      START AUDIO
    */

    if(audioElement){

      try{

        audioElement.currentTime=0;

        await audioElement.play();

      }catch(error){

        console.warn(
          "Audio play:",
          error
        );

      }

    }


    /*
      ANIMATION
    */

    const start =
      performance.now();

    while(true){

      const elapsed =
        (
          performance.now()-
          start
        )/1000;

      const p =
        Math.min(
          1,
          elapsed/duration
        );


      drawScene(
        scene,
        p,
        canvas
      );


      /*
        PROGRESS
      */

      const sceneProgress =
        i/scenes.length+
        p/scenes.length;

      const percent =
        Math.round(
          sceneProgress*100
        );

      $("progressBar")
        .style
        .width =
        percent+"%";

      $("progressText")
        .textContent =
        `🎬 Render: Sahne ${
          i+1
        }/${scenes.length} • ${
          elapsed.toFixed(1)
        } / ${
          duration.toFixed(1)
        } sn • ${
          percent
        }%`;


      if(
        elapsed>=duration
      ){

        break;

      }

      await wait(
        1000/fps
      );

    }


    /*
      STOP AUDIO
    */

    if(audioElement){

      audioElement.pause();

      audioElement.currentTime=0;

      audioElement.src="";

    }

    if(audioSource){

      try{

        audioSource.disconnect();

      }catch(e){}

    }

  }


  /*
    FINAL FRAME
  */

  if(scenes.length){

    drawScene(
      scenes[scenes.length-1],
      1,
      canvas
    );

  }


  await wait(500);


  recorder.stop();

  await recorderStopped;


  /*
    STOP STREAMS
  */

  stream
    .getTracks()
    .forEach(
      track =>
        track.stop()
    );


  videoStream
    .getTracks()
    .forEach(
      track =>
        track.stop()
    );


  if(audioContext){

    try{

      await audioContext.close();

    }catch(e){}

  }


  /*
    BLOB
  */

  renderBlob =
    new Blob(
      chunks,
      {
        type:
          mimeType
      }
    );


  const url =
    URL.createObjectURL(
      renderBlob
    );


  $("progressBar")
    .style
    .width="100%";


  $("progressText")
    .textContent =
    "✅ Render tamamlandı.";


  $("downloadArea").innerHTML = `

    <div
      class="panel"
      style="margin-top:12px"
    >

      <strong>
        🎉 VİDEO HAZIR
      </strong>

      <br><br>

      <a
        href="${url}"
        download="GeldStory_Video.webm"
      >

        <button
          class="primary"
        >
          ⬇️ WEBM VİDEOYU İNDİR
        </button>

      </a>

      <video
        src="${url}"
        controls
        style="
          width:100%;
          margin-top:12px;
          border-radius:10px;
          background:#000;
        "
      ></video>

    </div>

  `;

}


/* =========================================================
   RENDER BUTTON
========================================================= */

$("renderBtn")
.addEventListener(
  "click",
  async()=>{

    try{

      await renderVideo();

    }catch(error){

      console.error(error);

      $("progressText")
        .textContent =
        "❌ Render hatası: "+
        error.message;

      alert(
        "Render hatası:\n\n"+
        error.message
      );

    }

  }
);


/* =========================================================
   CREATE SCENES
========================================================= */

$("createScenesBtn")
.addEventListener(
  "click",
  createScenes
);


/* =========================================================
   CLEAR STORY
========================================================= */

$("clearStoryBtn")
.addEventListener(
  "click",
  ()=>{

    if(
      !confirm(
        "Hikâye ve sahneler temizlensin mi?"
      )
    ){

      return;

    }

    scenes.forEach(scene=>{

      if(scene.imageURL){

        URL.revokeObjectURL(
          scene.imageURL
        );

      }

      if(scene.audioURL){

        URL.revokeObjectURL(
          scene.audioURL
        );

      }

    });

    scenes=[];

    sceneCounter=1;

    $("story").value="";

    $("scenes").innerHTML="";

    $("storyStatus").textContent =
      "Temizlendi.";

    $("downloadArea").innerHTML="";

    $("previewCanvas")
      .getContext("2d")
      .clearRect(
        0,
        0,
        $("previewCanvas").width,
        $("previewCanvas").height
      );

  }
);


/* =========================================================
   DEFAULT CANVAS
========================================================= */

(function(){

  const canvas =
    $("previewCanvas");

  const size =
    getCanvasSize();

  canvas.width =
    size.width;

  canvas.height =
    size.height;

  const ctx =
    canvas.getContext("2d");

  ctx.fillStyle="#050505";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.fillStyle="#555";

  ctx.font="28px Arial";

  ctx.textAlign="center";

  ctx.textBaseline="middle";

  ctx.fillText(
    "GeldStory",
    canvas.width/2,
    canvas.height/2
  );

})();


/* =========================================================
   FORMAT CHANGE
========================================================= */

$("format")
.addEventListener(
  "change",
  ()=>{

    updatePreview();

  }
);


/* =========================================================
   PAGE UNLOAD CLEANUP
========================================================= */

window.addEventListener(
  "beforeunload",
  ()=>{

    scenes.forEach(scene=>{

      if(scene.imageURL){

        try{

          URL.revokeObjectURL(
            scene.imageURL
          );

        }catch(e){}

      }

      if(scene.audioURL){

        try{

          URL.revokeObjectURL(
            scene.audioURL
          );

        }catch(e){}

      }

    });

  }
);

</script>

</body>
</html>
